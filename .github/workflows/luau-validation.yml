name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - "docs/**"
      - "tools/hroi_run_upgrade_patch.py"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"
  push:
    branches:
      - main
    paths:
      - "games/living-kingdoms/**"
      - "docs/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply exact squad upgrade integration
        run: python3 tools/hroi_run_upgrade_patch.py

      - name: Apply exact Selene corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          choice_path = Path("games/living-kingdoms/src/client/Controllers/RunUpgradeChoiceController.luau")
          choice = choice_path.read_text(encoding="utf-8")
          choice = choice.replace("UDim2.new(0, 18, 0, 12)", "UDim2.fromOffset(18, 12)")
          choice = choice.replace("UDim2.new(0, 18, 0, 48)", "UDim2.fromOffset(18, 48)")
          choice = choice.replace("UDim2.new(0, 14, 0, 84)", "UDim2.fromOffset(14, 84)")
          choice_path.write_text(choice, encoding="utf-8")

          config_path = Path("games/living-kingdoms/src/shared/Config/RunProgressionConfig.luau")
          config = config_path.read_text(encoding="utf-8")
          config = config.replace(
              "assert(RunProgressionConfig.DamageBonusPerStack > 0 and RunProgressionConfig.DamageBonusPerStack <= 10)",
              "assert(\n\tRunProgressionConfig.DamageBonusPerStack > 0 and RunProgressionConfig.DamageBonusPerStack <= 10,\n\t\"damage upgrades require a positive bounded per-stack bonus\"\n)",
          )
          config = config.replace(
              "\t\tand RunProgressionConfig.MinimumCadenceMultiplier < 1\n)",
              "\t\tand RunProgressionConfig.MinimumCadenceMultiplier < 1,\n\t\"cadence upgrades require bounded faster multipliers\"\n)",
          )
          config = config.replace(
              "\t\tand RunProgressionConfig.MinimumReloadMultiplier < 1\n)",
              "\t\tand RunProgressionConfig.MinimumReloadMultiplier < 1,\n\t\"reload upgrades require bounded faster multipliers\"\n)",
          )
          config_path.write_text(config, encoding="utf-8")
          PY

      - name: Format Luau integration
        run: stylua games/living-kingdoms/src games/living-kingdoms/tests

      - name: Upload formatted integration
        uses: actions/upload-artifact@v4
        with:
          name: hroi-run-upgrade-formatted
          path: |
            games/living-kingdoms/src
            games/living-kingdoms/tests
          retention-days: 1

      - name: Check Luau formatting
        shell: bash
        run: stylua --check games/living-kingdoms/src

      - name: Run Selene and capture diagnostics
        id: selene
        continue-on-error: true
        shell: bash
        run: |
          set +e
          selene games/living-kingdoms/src > /tmp/selene.log 2>&1
          status=$?
          cat /tmp/selene.log
          echo "$status" > /tmp/selene-status
          exit "$status"

      - name: Upload Selene diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hroi-run-upgrade-selene-log
          path: |
            /tmp/selene.log
            /tmp/selene-status
          retention-days: 1

      - name: Enforce Selene result
        if: steps.selene.outcome == 'failure'
        run: exit 1

      - name: Run Lune fixtures and capture diagnostics
        id: lune
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          fixture_count=0
          status=0
          : > /tmp/lune.log
          while IFS= read -r -d '' fixture; do
            echo "===== $fixture =====" | tee -a /tmp/lune.log
            lune run "$fixture" 2>&1 | tee -a /tmp/lune.log
            fixture_status=${PIPESTATUS[0]}
            fixture_count=$((fixture_count + 1))
            if [ "$fixture_status" -ne 0 ]; then
              status="$fixture_status"
              break
            fi
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            echo "No Living Kingdoms fixtures were discovered." | tee -a /tmp/lune.log
            status=1
          fi
          echo "Executed $fixture_count Living Kingdoms fixtures before exit." | tee -a /tmp/lune.log
          echo "$status" > /tmp/lune-status
          exit "$status"

      - name: Upload Lune diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hroi-run-upgrade-lune-log
          path: |
            /tmp/lune.log
            /tmp/lune-status
          retention-days: 1

      - name: Enforce Lune result
        if: steps.lune.outcome == 'failure'
        run: exit 1

      - name: Build Rojo project
        shell: bash
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

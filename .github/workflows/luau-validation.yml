name: Luau validation

on:
  pull_request:
    paths:
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  publish-visual-registry-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out synchronization branch
        uses: actions/checkout@v4
        with:
          ref: chore/sync-operative-visual-registry

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply registry and documentation synchronization
        run: |
          python .github/scripts/sync_visual_status.py
          python .github/scripts/sync_visual_registry_fixture.py
          stylua \
            games/living-kingdoms/src/shared/Config/VisualAssetConfig.luau \
            games/living-kingdoms/tests/VisualAssetContractsConfig.test.luau

      - name: Validate synchronized repository
        shell: bash
        run: |
          set -euo pipefail
          stylua --check games/living-kingdoms/src
          selene games/living-kingdoms/src
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            exit 1
          fi
          rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Remove synchronization helpers
        run: |
          rm .github/scripts/sync_visual_status.py
          rm .github/scripts/sync_visual_registry_fixture.py

      - name: Restore repository validation workflow
        run: |
          cat > .github/workflows/luau-validation.yml <<'EOF'
          name: Luau validation

          on:
            pull_request:
              paths:
                - "games/living-kingdoms/**"
                - "rokit.toml"
                - "stylua.toml"
                - "selene.toml"
                - ".github/workflows/luau-validation.yml"
            push:
              branches:
                - main
              paths:
                - "games/living-kingdoms/**"
                - "rokit.toml"
                - "stylua.toml"
                - "selene.toml"
                - ".github/workflows/luau-validation.yml"

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-22.04
              timeout-minutes: 15

              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Install pinned Rokit tools
                  uses: CompeyDev/setup-rokit@v0.1.2
                  with:
                    version: v1.2.0
                    path: .
                    cache: false
                    token: ${{ github.token }}

                - name: Check Luau formatting
                  shell: bash
                  run: stylua --check games/living-kingdoms/src

                - name: Run Selene
                  shell: bash
                  run: selene games/living-kingdoms/src

                - name: Run Lune fixtures
                  shell: bash
                  run: |
                    set -euo pipefail
                    fixture_count=0
                    while IFS= read -r -d '' fixture; do
                      echo "::group::Lune fixture: $fixture"
                      lune run "$fixture"
                      echo "::endgroup::"
                      fixture_count=$((fixture_count + 1))
                    done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
                    if [ "$fixture_count" -eq 0 ]; then
                      echo "No Living Kingdoms fixtures were discovered." >&2
                      exit 1
                    fi
                    echo "Executed $fixture_count Living Kingdoms fixtures."

                - name: Build Rojo project
                  shell: bash
                  run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx
          EOF

      - name: Commit synchronized product files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: synchronize operative visual registry"
          git push origin HEAD:chore/sync-operative-visual-registry

name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"
  push:
    branches:
      - main
    paths:
      - "games/living-kingdoms/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply deterministic StyLua formatting
        shell: bash
        run: stylua games/living-kingdoms/src

      - name: Commit formatter output
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/strict-stylua-enforcement'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/src
          git commit -m "Format Luau sources with StyLua"
          git push origin HEAD:${{ github.head_ref }}

      - name: Run Selene
        shell: bash
        run: selene games/living-kingdoms/src

      - name: Build Rojo project
        shell: bash
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

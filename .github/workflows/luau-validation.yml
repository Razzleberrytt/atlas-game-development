name: Luau validation

on:
  pull_request:
    paths:
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: read

jobs:
  diagnose-windup-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out windup branch
        uses: actions/checkout@v4
        with:
          ref: feat/exclusion-walker-attack-windup

      - name: Run apply script and capture output
        shell: bash
        run: |
          set +e
          python .github/scripts/apply_exclusion_walker_windup.py > windup-apply.log 2>&1
          status=$?
          echo "$status" > windup-apply-status.txt
          cat windup-apply.log
          exit 0

      - name: Upload apply report
        uses: actions/upload-artifact@v4
        with:
          name: exclusion-walker-windup-apply-report
          path: |
            windup-apply.log
            windup-apply-status.txt

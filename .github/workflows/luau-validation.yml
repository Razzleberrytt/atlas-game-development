name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - "docs/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Update deferred-spawn timing fixture
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("games/living-kingdoms/tests/EnemyDirectorService.test.luau")
          text = path.read_text(encoding="utf-8")
          old = "now = 1\nlocal early = service.evaluateAt(now)\n"
          new = "now = config.FairSpawn.DeferredRetryIntervalSeconds * 0.5\nlocal early = service.evaluateAt(now)\n"
          if old not in text:
              raise SystemExit("expected deferred-spawn fixture timing was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Commit fixture correction
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet -- games/living-kingdoms/tests; then
            echo "No fixture correction required."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/living-kingdoms/tests
          git commit -m "test: derive deferred retry checkpoint from config"
          git push origin HEAD:${{ github.head_ref }}

      - name: Check Luau formatting
        shell: bash
        run: stylua --check games/living-kingdoms/src

      - name: Run Selene
        shell: bash
        run: selene games/living-kingdoms/src

      - name: Capture Lune fixture report
        id: fixtures
        shell: bash
        continue-on-error: true
        run: |
          set +e
          fixture_count=0
          status=0
          : > /tmp/lune-fixtures.txt
          while IFS= read -r -d '' fixture; do
            echo "===== $fixture =====" | tee -a /tmp/lune-fixtures.txt
            lune run "$fixture" 2>&1 | tee -a /tmp/lune-fixtures.txt
            fixture_status=${PIPESTATUS[0]}
            if [ "$fixture_status" -ne 0 ]; then
              status=$fixture_status
              break
            fi
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          echo "Executed $fixture_count successful Living Kingdoms fixtures." | tee -a /tmp/lune-fixtures.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Lune fixture report
        uses: actions/upload-artifact@v4
        with:
          name: lune-fixture-report
          path: /tmp/lune-fixtures.txt
          if-no-files-found: error
          retention-days: 1

      - name: Fail on fixture findings
        if: steps.fixtures.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Build Rojo project
        shell: bash
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

name: Luau validation

on:
  pull_request:
    paths:
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  apply-windup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out windup branch
        uses: actions/checkout@v4
        with:
          ref: feat/exclusion-walker-attack-windup

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply server-owned windup contract
        run: |
          python .github/scripts/patch_windup_apply.py
          python .github/scripts/apply_exclusion_walker_windup.py
          python .github/scripts/patch_windup_fixture_expectations.py

      - name: Format changed Luau
        run: |
          stylua \
            games/living-kingdoms/src/shared/Combat/EnemyContracts.luau \
            games/living-kingdoms/src/shared/Config/EnemyConfig.luau \
            games/living-kingdoms/src/shared/Visual/EnemyPresentationContracts.luau \
            games/living-kingdoms/src/server/Systems/EnemyBehaviorResolver.luau \
            games/living-kingdoms/src/server/Systems/EnemyDirectorService.luau \
            games/living-kingdoms/src/client/Controllers/EnemyPresentationController.luau \
            games/living-kingdoms/src/client/Presentation/EnemyPresentationPoseResolver.luau \
            games/living-kingdoms/tests/EnemyBehaviorResolver.test.luau \
            games/living-kingdoms/tests/EnemyDirectorService.test.luau \
            games/living-kingdoms/tests/EnemyPresentationContracts.test.luau \
            games/living-kingdoms/tests/EnemyPresentationPoseResolver.test.luau \
            games/living-kingdoms/tests/ExclusionWalkerStateReadabilitySourceAudit.test.luau

      - name: Run focused windup fixtures
        run: |
          lune run games/living-kingdoms/tests/EnemyBehaviorResolver.test.luau
          lune run games/living-kingdoms/tests/EnemyDirectorService.test.luau
          lune run games/living-kingdoms/tests/EnemyPresentationContracts.test.luau
          lune run games/living-kingdoms/tests/EnemyPresentationPoseResolver.test.luau
          lune run games/living-kingdoms/tests/ExclusionWalkerStateReadabilitySourceAudit.test.luau

      - name: Remove temporary synchronization helpers
        run: |
          rm .github/scripts/patch_windup_apply.py
          rm .github/scripts/patch_windup_fixture_expectations.py

      - name: Restore trusted validation workflow
        run: |
          cat > .github/workflows/luau-validation.yml <<'EOF'
          name: Luau validation

          on:
            pull_request:
              paths:
                - "games/living-kingdoms/**"
                - "rokit.toml"
                - "stylua.toml"
                - "selene.toml"
                - ".github/workflows/luau-validation.yml"
            push:
              branches:
                - main
              paths:
                - "games/living-kingdoms/**"
                - "rokit.toml"
                - "stylua.toml"
                - "selene.toml"
                - ".github/workflows/luau-validation.yml"

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-22.04
              timeout-minutes: 15

              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Install pinned Rokit tools
                  uses: CompeyDev/setup-rokit@v0.1.2
                  with:
                    version: v1.2.0
                    path: .
                    cache: false
                    token: ${{ github.token }}

                - name: Check Luau formatting
                  shell: bash
                  run: stylua --check games/living-kingdoms/src

                - name: Run Selene
                  shell: bash
                  run: selene games/living-kingdoms/src

                - name: Run Lune fixtures
                  shell: bash
                  run: |
                    set -euo pipefail
                    fixture_count=0
                    while IFS= read -r -d '' fixture; do
                      echo "::group::Lune fixture: $fixture"
                      lune run "$fixture"
                      echo "::endgroup::"
                      fixture_count=$((fixture_count + 1))
                    done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
                    if [ "$fixture_count" -eq 0 ]; then
                      echo "No Living Kingdoms fixtures were discovered." >&2
                      exit 1
                    fi
                    echo "Executed $fixture_count Living Kingdoms fixtures."

                - name: Build Rojo project
                  shell: bash
                  run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx
          EOF

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add server-owned Exclusion Walker windup"
          git push origin HEAD:feat/exclusion-walker-attack-windup

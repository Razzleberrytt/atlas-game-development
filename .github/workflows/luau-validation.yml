name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}
      - name: Capture formatter diff
        shell: bash
        run: |
          stylua games/living-kingdoms/src
          git diff -- games/living-kingdoms/src > /tmp/stylua.diff
      - name: Upload formatter diff
        uses: actions/upload-artifact@v4
        with:
          name: stylua-diff
          path: /tmp/stylua.diff
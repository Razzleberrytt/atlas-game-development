name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"
  push:
    branches:
      - main
    paths:
      - "games/living-kingdoms/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rokit
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Configure Rokit authentication
        shell: bash
        env:
          ROKIT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.rokit"
          printf 'github = "%s"\n' "$ROKIT_GITHUB_TOKEN" > "$HOME/.rokit/auth.toml"
          chmod 600 "$HOME/.rokit/auth.toml"

      - name: Trust pinned tool sources
        shell: bash
        run: |
          "$HOME/.rokit/bin/rokit" add rojo-rbx/rojo
          "$HOME/.rokit/bin/rokit" add Kampfkarren/selene
          "$HOME/.rokit/bin/rokit" add JohnnyMorganz/StyLua
          git checkout -- rokit.toml

      - name: Install pinned tools
        shell: bash
        run: "$HOME/.rokit/bin/rokit install"

      - name: Check Luau formatting
        shell: bash
        run: "$HOME/.rokit/bin/stylua --check games/living-kingdoms/src"

      - name: Run Selene
        shell: bash
        run: "$HOME/.rokit/bin/selene games/living-kingdoms/src"

      - name: Build Rojo project
        shell: bash
        run: "$HOME/.rokit/bin/rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx"

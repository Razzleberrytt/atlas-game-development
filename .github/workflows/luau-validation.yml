name: Luau validation

on:
  pull_request:
    paths:
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: read

jobs:
  package-operative-life-world-cues:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out life cue branch
        uses: actions/checkout@v4
        with:
          ref: feat/operative-life-world-cues

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Build and validate operative life cues
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_operative_life_world_cues.py
          stylua \
            games/living-kingdoms/src/client/Presentation/OperativeLifePresentationResolver.luau \
            games/living-kingdoms/src/client/Controllers/OperativeLifeWorldPresentationController.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/src/shared/Config/VisualAssetConfig.luau \
            games/living-kingdoms/tests/OperativeLifePresentationResolver.test.luau \
            games/living-kingdoms/tests/OperativeLifeWorldPresentationSourceAudit.test.luau \
            games/living-kingdoms/tests/VisualAssetContractsConfig.test.luau
          stylua --check games/living-kingdoms/src
          selene games/living-kingdoms/src
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            exit 1
          fi
          rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Stage validated product files
        run: |
          mkdir -p operative-life-cue-package
          while IFS= read -r path; do
            mkdir -p "operative-life-cue-package/$(dirname "$path")"
            cp "$path" "operative-life-cue-package/$path"
          done <<'EOF'
          games/living-kingdoms/src/client/Presentation/OperativeLifePresentationResolver.luau
          games/living-kingdoms/src/client/Controllers/OperativeLifeWorldPresentationController.luau
          games/living-kingdoms/src/client/init.client.luau
          games/living-kingdoms/src/shared/Config/VisualAssetConfig.luau
          games/living-kingdoms/tests/OperativeLifePresentationResolver.test.luau
          games/living-kingdoms/tests/OperativeLifeWorldPresentationSourceAudit.test.luau
          games/living-kingdoms/tests/VisualAssetContractsConfig.test.luau
          games/living-kingdoms/assets/visual/operative/life-state-cues/README.md
          games/living-kingdoms/assets/visual/operative/life-state-cues/asset-manifest.json
          docs/roadmap/VISUAL-PRODUCTION-TRACK.md
          docs/specifications/visual-placeholder-inventory.md
          EOF

      - name: Upload validated product files
        uses: actions/upload-artifact@v4
        with:
          name: operative-life-world-cues
          path: operative-life-cue-package

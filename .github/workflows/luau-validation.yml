name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply Selene cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("games/living-kingdoms/src/server/Systems/ClassService.luau")
          source = path.read_text(encoding="utf-8")
          source = source.replace("type ClassId = ClassContracts.ClassId\n", "")
          source = source.replace(
              "\tif selectionStateId == SelectionStateIds.Open and deadline ~= nil then\n\t\tscheduleLock(deadline)\n\tend\n\tpublishAll()",
              "\tsynchronizeSelectionWindow()\n\tpublishAll()",
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Restore normal workflow
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/luau-validation.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/luau-validation.yml games/living-kingdoms/src/server/Systems/ClassService.luau
          git commit -m "Fix P7 class service lint"
          git push

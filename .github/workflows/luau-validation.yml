name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"
      - ".github/one-shot/p6_0105_patch.py"
      - ".github/one-shot/fix_p6_patch.py"
  push:
    branches:
      - main
    paths:
      - "games/living-kingdoms/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Narrow presentation contract anchor
        run: python3 .github/one-shot/fix_p6_patch.py

      - name: Apply anchored ammunition feedback patch
        id: patch
        shell: bash
        run: |
          set +e
          python3 .github/one-shot/p6_0105_patch.py > /tmp/p6-patch.log 2>&1
          status=$?
          cat /tmp/p6-patch.log
          exit "$status"

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-patch-log
          path: /tmp/p6-patch.log

      - name: Format Luau source
        run: stylua games/living-kingdoms/src games/living-kingdoms/tests/P6AmmunitionPresentation.test.luau

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: p6-ammunition-feedback-source
          path: |
            games/living-kingdoms/src/shared/Combat/CombatContracts.luau
            games/living-kingdoms/src/server/Systems/OperativeCombatRuntimeService.luau
            games/living-kingdoms/src/server/Systems/AmmunitionCacheService.luau
            games/living-kingdoms/src/client/Controllers/WeaponController.luau
            games/living-kingdoms/tests/P6AmmunitionPresentation.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run Lune fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            echo "::group::Lune fixture: $fixture"
            lune run "$fixture"
            echo "::endgroup::"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            echo "No Living Kingdoms fixtures were discovered." >&2
            exit 1
          fi
          echo "Executed $fixture_count Living Kingdoms fixtures."

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

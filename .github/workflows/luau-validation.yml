name: Atlas validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/**"
      - "games/living-kingdoms/**"
      - "docs/**"
      - "scripts/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".github/**"
      - "games/living-kingdoms/**"
      - "docs/**"
      - "scripts/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        required: true
        default: full
        type: choice
        options:
          - docs
          - fast
          - full

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-22.04
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select validation profile
        id: profile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          MANUAL_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            profile="${MANUAL_PROFILE:-full}"
            echo "profile=$profile" >> "$GITHUB_OUTPUT"
            echo "Manual validation profile: $profile"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          else
            if [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              changed_files="$(git diff --name-only "$BEFORE_SHA...$CURRENT_SHA")"
            else
              changed_files="$(git show --pretty='' --name-only "$CURRENT_SHA")"
            fi
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          profile="docs"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" == *.md ]]; then
              continue
            fi
            profile="full"
            break
          done <<< "$changed_files"

          # Empty/ambiguous diffs should never silently skip real validation.
          if [[ -z "$changed_files" ]]; then
            profile="full"
          fi

          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "Selected validation profile: $profile"

  validate:
    needs: classify
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rokit tools
        if: needs.classify.outputs.profile != 'docs'
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Validate repository
        shell: bash
        run: python scripts/validate.py "${{ needs.classify.outputs.profile }}"

      - name: Record Main World artifact identity
        if: needs.classify.outputs.profile != 'docs'
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/LivingKingdomsMainWorld.rbxlx
          sha256sum /tmp/LivingKingdomsMainWorld.rbxlx | tee /tmp/LivingKingdomsMainWorld.rbxlx.sha256
          {
            echo "commit=${GITHUB_SHA}"
            echo "project=games/living-kingdoms/main-world.project.json"
            echo "artifact=LivingKingdomsMainWorld.rbxlx"
          } > /tmp/LivingKingdomsMainWorld.identity.txt

      - name: Upload reproducible Living Kingdoms build
        if: needs.classify.outputs.profile != 'docs'
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-rbxlx-${{ github.sha }}
          path: /tmp/LivingKingdoms.rbxlx
          if-no-files-found: error
          retention-days: 14

      - name: Upload reproducible Living Kingdoms Main World build
        if: needs.classify.outputs.profile != 'docs'
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-main-world-rbxlx-${{ github.sha }}
          path: |
            /tmp/LivingKingdomsMainWorld.rbxlx
            /tmp/LivingKingdomsMainWorld.rbxlx.sha256
            /tmp/LivingKingdomsMainWorld.identity.txt
          if-no-files-found: error
          retention-days: 14

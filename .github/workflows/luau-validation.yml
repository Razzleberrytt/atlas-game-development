name: Luau validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".gitignore"
      - "games/living-kingdoms/**"
      - "docs/**"
      - "scripts/validate_living_kingdoms_layout.py"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - ".gitignore"
      - "games/living-kingdoms/**"
      - "docs/**"
      - "scripts/validate_living_kingdoms_layout.py"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository contract
        shell: bash
        run: python scripts/validate_living_kingdoms_layout.py

      - name: Verify preserved Studio import package
        shell: bash
        run: python scripts/verify_studio_import_package.py

      - name: Validate migration manifests
        shell: bash
        run: python scripts/validate_migration_manifests.py

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Check Luau formatting
        shell: bash
        run: stylua --check games/living-kingdoms/src

      - name: Run Selene
        shell: bash
        run: selene games/living-kingdoms/src

      - name: Run Lune fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            echo "::group::Lune fixture: $fixture"
            lune run "$fixture"
            echo "::endgroup::"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            echo "No Living Kingdoms fixtures were discovered." >&2
            exit 1
          fi
          echo "Executed $fixture_count Living Kingdoms fixtures."

      - name: Build Rojo project
        shell: bash
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Upload reproducible Living Kingdoms build
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-rbxlx-${{ github.sha }}
          path: /tmp/LivingKingdoms.rbxlx
          if-no-files-found: error
          retention-days: 14

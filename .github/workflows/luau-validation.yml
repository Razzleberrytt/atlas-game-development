name: Luau validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".gitignore"
      - "games/living-kingdoms/**"
      - "docs/**"
      - "scripts/validate_*.py"
      - "scripts/verify_studio_import_package.py"
      - "scripts/roblox/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - ".gitignore"
      - "games/living-kingdoms/**"
      - "docs/**"
      - "scripts/validate_*.py"
      - "scripts/verify_studio_import_package.py"
      - "scripts/roblox/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply temporary run-power replay patch
        if: github.head_ref == 'mvp-01/reset-temporary-run-power-on-replay'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_run_power_replay.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            games/living-kingdoms/src/server/Systems/RunProgressionService.luau \
            games/living-kingdoms/tests/OperationLifecycleReplay.test.luau
          if ! git diff --cached --quiet; then
            git commit -m "[MVP 0.1] Apply temporary run-power replay reset"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Validate repository contract
        shell: bash
        run: python scripts/validate_living_kingdoms_layout.py

      - name: Verify preserved Studio import package
        shell: bash
        run: python scripts/verify_studio_import_package.py

      - name: Validate migration manifests
        shell: bash
        run: python scripts/validate_migration_manifests.py

      - name: Validate current migration evidence
        shell: bash
        run: python scripts/validate_migration_current_evidence.py

      - name: Self-test RBXL property decoder
        shell: bash
        run: python scripts/roblox/extract_rbxl_world_properties.py --self-test

      - name: Self-test RBXL presentation decoder
        shell: bash
        run: python scripts/roblox/extract_rbxl_presentation_properties.py --self-test

      - name: Self-test RBXL BillboardGui decoder
        shell: bash
        run: python scripts/roblox/extract_rbxl_billboard_properties.py --self-test

      - name: Validate re-extracted property evidence
        shell: bash
        run: python scripts/validate_reextracted_property_evidence.py

      - name: Validate re-extracted presentation evidence
        shell: bash
        run: python scripts/validate_reextracted_presentation_evidence.py

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      # Formatting covers every Luau tree in the game, not just src. Fixtures
      # and tooling drifted unchecked until 2026-08-08 because this step was
      # scoped to src alone.
      - name: Check Luau formatting
        shell: bash
        run: |
          stylua --check \
            games/living-kingdoms/src \
            games/living-kingdoms/tests \
            games/living-kingdoms/tools

      - name: Run Selene
        shell: bash
        run: selene games/living-kingdoms/src

      - name: Run Lune fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            echo "::group::Lune fixture: $fixture"
            lune run "$fixture"
            echo "::endgroup::"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            echo "No Living Kingdoms fixtures were discovered." >&2
            exit 1
          fi
          echo "Executed $fixture_count Living Kingdoms fixtures."

      - name: Build Rojo project
        shell: bash
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Upload reproducible Living Kingdoms build
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-rbxlx-${{ github.sha }}
          path: /tmp/LivingKingdoms.rbxlx
          if-no-files-found: error
          retention-days: 14

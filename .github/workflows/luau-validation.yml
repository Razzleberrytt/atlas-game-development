name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - "docs/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Format Luau sources
        shell: bash
        run: stylua games/living-kingdoms/src

      - name: Commit formatter output
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet -- games/living-kingdoms/src; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/living-kingdoms/src
          git commit -m "style: format horde vertical slice"
          git push origin HEAD:${{ github.head_ref }}

      - name: Capture Selene report
        id: selene
        shell: bash
        continue-on-error: true
        run: |
          set +e
          selene games/living-kingdoms/src > /tmp/selene.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/selene.txt
          exit 0

      - name: Upload Selene report
        uses: actions/upload-artifact@v4
        with:
          name: selene-report
          path: /tmp/selene.txt
          if-no-files-found: error
          retention-days: 1

      - name: Fail on Selene findings
        if: steps.selene.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Run Lune fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            echo "::group::Lune fixture: $fixture"
            lune run "$fixture"
            echo "::endgroup::"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            echo "No Living Kingdoms fixtures were discovered." >&2
            exit 1
          fi
          echo "Executed $fixture_count Living Kingdoms fixtures."

      - name: Build Rojo project
        shell: bash
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

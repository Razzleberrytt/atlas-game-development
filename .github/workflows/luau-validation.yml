name: Luau validation

on:
  pull_request:
    paths:
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  publish-operative-firearm-carry-poses:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out carry pose branch
        uses: actions/checkout@v4
        with:
          ref: feat/operative-firearm-carry-poses

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Build and validate operative carry poses
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_operative_carry_poses.py
          stylua \
            games/living-kingdoms/src/client/Presentation/OperativeCarryPoseResolver.luau \
            games/living-kingdoms/src/client/Controllers/OperativeCarryPresentationController.luau \
            games/living-kingdoms/src/client/Controllers/WeaponPresentationController.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/tests/OperativeCarryPoseResolver.test.luau \
            games/living-kingdoms/tests/OperativeCarryPresentationSourceAudit.test.luau
          stylua --check games/living-kingdoms/src
          selene games/living-kingdoms/src
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            exit 1
          fi
          rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit only validated product files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            games/living-kingdoms/src/client/Presentation/OperativeCarryPoseResolver.luau \
            games/living-kingdoms/src/client/Controllers/OperativeCarryPresentationController.luau \
            games/living-kingdoms/src/client/Controllers/WeaponPresentationController.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/tests/OperativeCarryPoseResolver.test.luau \
            games/living-kingdoms/tests/OperativeCarryPresentationSourceAudit.test.luau \
            games/living-kingdoms/assets/visual/operative/carry-poses/README.md \
            games/living-kingdoms/assets/visual/operative/carry-poses/asset-manifest.json \
            docs/roadmap/VISUAL-PRODUCTION-TRACK.md \
            docs/specifications/visual-placeholder-inventory.md
          git commit -m "feat: add operative firearm carry poses"
          git push origin HEAD:feat/operative-firearm-carry-poses

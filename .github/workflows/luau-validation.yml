name: Luau validation

on:
  pull_request:
    paths:
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: read

jobs:
  package-visual-registry-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out synchronization branch
        uses: actions/checkout@v4
        with:
          ref: chore/sync-operative-visual-registry

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Build and validate synchronized files
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/sync_visual_status.py
          python .github/scripts/sync_visual_registry_fixture.py
          stylua \
            games/living-kingdoms/src/shared/Config/VisualAssetConfig.luau \
            games/living-kingdoms/tests/VisualAssetContractsConfig.test.luau
          stylua --check games/living-kingdoms/src
          selene games/living-kingdoms/src
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            exit 1
          fi
          rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Stage validated product files
        run: |
          mkdir -p visual-registry-package
          while IFS= read -r path; do
            mkdir -p "visual-registry-package/$(dirname "$path")"
            cp "$path" "visual-registry-package/$path"
          done <<'EOF'
          games/living-kingdoms/src/shared/Config/VisualAssetConfig.luau
          games/living-kingdoms/tests/VisualAssetContractsConfig.test.luau
          docs/roadmap/VISUAL-PRODUCTION-TRACK.md
          docs/specifications/visual-placeholder-inventory.md
          EOF

      - name: Upload validated product files
        uses: actions/upload-artifact@v4
        with:
          name: operative-visual-registry-sync
          path: visual-registry-package

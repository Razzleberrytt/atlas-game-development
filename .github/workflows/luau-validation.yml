name: Luau validation

on:
  pull_request:
    paths:
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: read

jobs:
  package-formatted-operative-silhouettes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/operative-class-silhouettes

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply canonical formatting
        run: |
          stylua \
            games/living-kingdoms/src/shared/Visual/ClassSilhouetteConfig.luau \
            games/living-kingdoms/src/client/Controllers/ClassSilhouetteController.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/tests/ClassSilhouetteConfig.test.luau \
            games/living-kingdoms/tests/OperativeClassSilhouetteSourceAudit.test.luau

      - name: Stage formatted files
        run: |
          mkdir -p formatted-operative-silhouettes
          while IFS= read -r path; do
            mkdir -p "formatted-operative-silhouettes/$(dirname "$path")"
            cp "$path" "formatted-operative-silhouettes/$path"
          done <<'EOF'
          games/living-kingdoms/src/shared/Visual/ClassSilhouetteConfig.luau
          games/living-kingdoms/src/client/Controllers/ClassSilhouetteController.luau
          games/living-kingdoms/src/client/init.client.luau
          games/living-kingdoms/tests/ClassSilhouetteConfig.test.luau
          games/living-kingdoms/tests/OperativeClassSilhouetteSourceAudit.test.luau
          EOF

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-operative-silhouettes
          path: formatted-operative-silhouettes

name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Capture remaining Lune output
        shell: bash
        run: |
          mkdir -p docs/validation
          : > docs/validation/P7-LUNE-DIAGNOSTIC-2.txt
          overall=0
          started=0
          while IFS= read -r -d '' fixture; do
            if [ "$fixture" = "games/living-kingdoms/tests/P7ClassSelectionSourceAudit.test.luau" ]; then
              started=1
            fi
            if [ "$started" -eq 0 ]; then
              continue
            fi
            printf '\n===== %s =====\n' "$fixture" >> docs/validation/P7-LUNE-DIAGNOSTIC-2.txt
            set +e
            lune run "$fixture" >> docs/validation/P7-LUNE-DIAGNOSTIC-2.txt 2>&1
            status=$?
            set -e
            printf 'exit_status=%s\n' "$status" >> docs/validation/P7-LUNE-DIAGNOSTIC-2.txt
            if [ "$status" -ne 0 ]; then
              overall=$status
              break
            fi
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          printf '\noverall_exit_status=%s\n' "$overall" >> docs/validation/P7-LUNE-DIAGNOSTIC-2.txt

      - name: Restore normal workflow and commit diagnostic
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/luau-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/luau-validation.yml docs/validation/P7-LUNE-DIAGNOSTIC-2.txt
          git commit -m "Capture remaining P7 Lune failure"
          git push

name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Capture Selene output
        shell: bash
        run: |
          mkdir -p docs/validation
          set +e
          selene games/living-kingdoms/src > docs/validation/P7-SELENE-DIAGNOSTIC.txt 2>&1
          status=$?
          set -e
          printf "\nexit_status=%s\n" "$status" >> docs/validation/P7-SELENE-DIAGNOSTIC.txt

      - name: Restore normal workflow and commit diagnostic
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/luau-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/luau-validation.yml docs/validation/P7-SELENE-DIAGNOSTIC.txt
          git commit -m "Capture P7 Selene diagnostic"
          git push

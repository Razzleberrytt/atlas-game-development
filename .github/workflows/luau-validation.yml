name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - "docs/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"
  push:
    branches:
      - main
    paths:
      - "games/living-kingdoms/**"
      - "docs/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  format-pr134:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 134
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pattern-target-stability-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Format focused files
        run: |
          stylua \
            games/living-kingdoms/src/server/Systems/WeaponTargetSelector.luau \
            games/living-kingdoms/src/server/Systems/OperativeCombatRuntimeService.luau \
            games/living-kingdoms/tests/WeaponTargetSelector.test.luau \
            games/living-kingdoms/tests/WeaponTargetSelectorSourceAudit.test.luau

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            games/living-kingdoms/src/server/Systems/WeaponTargetSelector.luau \
            games/living-kingdoms/src/server/Systems/OperativeCombatRuntimeService.luau \
            games/living-kingdoms/tests/WeaponTargetSelector.test.luau \
            games/living-kingdoms/tests/WeaponTargetSelectorSourceAudit.test.luau
          git commit -m "Apply pinned StyLua to target stability pass"
          git push origin HEAD:feat/pattern-target-stability-v1

  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Check Luau formatting
        shell: bash
        run: stylua --check games/living-kingdoms/src

      - name: Run Selene
        shell: bash
        run: selene games/living-kingdoms/src

      - name: Run Lune fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            echo "::group::Lune fixture: $fixture"
            lune run "$fixture"
            echo "::endgroup::"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            echo "No Living Kingdoms fixtures were discovered." >&2
            exit 1
          fi
          echo "Executed $fixture_count Living Kingdoms fixtures."

      - name: Build Rojo project
        shell: bash
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

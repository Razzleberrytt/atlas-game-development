name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - "docs/**"
      - "tools/hroi_loot_integration_patch.py"
      - "tools/hroi_loot_patch_anchor_fix.py"
      - "tools/hroi_loot_fixture_patch.py"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"
  push:
    branches:
      - main
    paths:
      - "games/living-kingdoms/**"
      - "docs/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply exact loot integration and capture diagnostics
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 tools/hroi_loot_patch_anchor_fix.py > /tmp/patch.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 tools/hroi_loot_integration_patch.py >> /tmp/patch.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python3 tools/hroi_loot_fixture_patch.py >> /tmp/patch.log 2>&1
            status=$?
          fi
          cat /tmp/patch.log
          echo "$status" > /tmp/patch-status
          exit "$status"

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hroi-loot-patch-log
          path: |
            /tmp/patch.log
            /tmp/patch-status
          retention-days: 1

      - name: Enforce patch result
        if: steps.patch.outcome == 'failure'
        run: exit 1

      - name: Format Luau integration
        run: stylua games/living-kingdoms/src games/living-kingdoms/tests

      - name: Upload formatted integration
        uses: actions/upload-artifact@v4
        with:
          name: hroi-loot-formatted
          path: |
            games/living-kingdoms/src
            games/living-kingdoms/tests
          retention-days: 1

      - name: Check Luau formatting
        run: stylua --check games/living-kingdoms/src

      - name: Run Selene and capture diagnostics
        id: selene
        continue-on-error: true
        shell: bash
        run: |
          set +e
          selene games/living-kingdoms/src > /tmp/selene.log 2>&1
          status=$?
          cat /tmp/selene.log
          echo "$status" > /tmp/selene-status
          exit "$status"

      - name: Upload Selene diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hroi-loot-selene-log
          path: |
            /tmp/selene.log
            /tmp/selene-status
          retention-days: 1

      - name: Enforce Selene result
        if: steps.selene.outcome == 'failure'
        run: exit 1

      - name: Run Lune fixtures and capture diagnostics
        id: lune
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          fixture_count=0
          status=0
          : > /tmp/lune.log
          while IFS= read -r -d '' fixture; do
            echo "===== $fixture =====" | tee -a /tmp/lune.log
            lune run "$fixture" 2>&1 | tee -a /tmp/lune.log
            fixture_status=${PIPESTATUS[0]}
            fixture_count=$((fixture_count + 1))
            if [ "$fixture_status" -ne 0 ]; then
              status="$fixture_status"
              break
            fi
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            echo "No Living Kingdoms fixtures were discovered." | tee -a /tmp/lune.log
            status=1
          fi
          echo "Executed $fixture_count Living Kingdoms fixtures before exit." | tee -a /tmp/lune.log
          echo "$status" > /tmp/lune-status
          exit "$status"

      - name: Upload Lune diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hroi-loot-lune-log
          path: |
            /tmp/lune.log
            /tmp/lune-status
          retention-days: 1

      - name: Enforce Lune result
        if: steps.lune.outcome == 'failure'
        run: exit 1

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated integration and restore normal CI
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/hroi-immediate-loot-drops'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --depth=1
          git checkout origin/main -- .github/workflows/luau-validation.yml
          rm -f tools/hroi_loot_integration_patch.py tools/hroi_loot_patch_anchor_fix.py tools/hroi_loot_fixture_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate validated immediate loot drops"
          git push origin HEAD:feat/hroi-immediate-loot-drops

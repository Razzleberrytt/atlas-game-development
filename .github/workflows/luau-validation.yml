name: Luau validation

on:
  pull_request:
    paths:
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: write

jobs:
  apply-windup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out windup branch
        uses: actions/checkout@v4
        with:
          ref: feat/exclusion-walker-attack-windup

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Synchronize the staged director fixture match
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_exclusion_walker_windup.py')
          text = path.read_text(encoding='utf-8')
          marker = '# Enemy director fixture: synchronize contract mock and attack lifecycle assertions.'
          call_start = text.index('replace_once(', text.index(marker))
          old_start = text.index("    '''", call_start)
          old_end = text.index("''',\n    '''", old_start) + 3
          current_block = r'''-- Attacks: in range, cooldown-gated, deterministic event IDs, Alive-only.
          -- The spawn is fair; the operative then walks into melee range.
          reset()
          local target, targetRoot = addOperative("operative.player:7", 300, 300)
          assert(service.spawnEnemy(request("enemy.biter", 0, 0)).didSpawn)
          local attackModel = findCreated("Test Walker")
          assert(attackModel ~= nil)
          targetRoot.Position = roblox.Vector3.new(3, 2, 0)
          now = 10
          local swing = service.evaluateAt(now)
          assert(swing.attackCommittedCount == 1 and #damageCalls == 1)
          assert(damageCalls[1].operativeEntityId == "operative.player:7")
          assert(damageCalls[1].expectedRevision == 0)
          assert(damageCalls[1].damage.damageEventId == "enemyattack:enemy.biter:operative.player:7:10")
          assert(damageCalls[1].damage.damageAmount == walker.AttackDamage)
          assert(damageCalls[1].damage.sourceEntityId == "enemy.biter")
          assert(damageCalls[1].damage.serverTimestamp == 10)
          assert(attackModel:GetAttribute(presentationAttributes.BehaviorStateId) == "Attacking")
          assert(attackModel:GetAttribute(presentationAttributes.AttackSequence) == 1)
          assert(attackModel:GetAttribute(presentationAttributes.AttackServerTimestamp) == 10)
          now = 10 + walker.AttackCooldownSeconds - 0.01
          assert(service.evaluateAt(now).attackCommittedCount == 0, "cooldown must block the second swing")
          now = 10 + walker.AttackCooldownSeconds
          assert(service.evaluateAt(now).attackCommittedCount == 1)
          assert(#damageCalls == 2)
          assert(attackModel:GetAttribute(presentationAttributes.AttackSequence) == 2)
          assert(attackModel:GetAttribute(presentationAttributes.AttackServerTimestamp) == now)
          -- A rejected life commit leaves the cooldown unarmed so the swing retries.
          rejectNextDamage = true
          now += walker.AttackCooldownSeconds
          assert(service.evaluateAt(now).attackCommittedCount == 0)
          assert(
          	attackModel:GetAttribute(presentationAttributes.AttackSequence) == 2,
          	"rejected damage must not disclose an attack"
          )
          now += 0.2
          assert(service.evaluateAt(now).attackCommittedCount == 1, "rejected commits must not consume the cooldown")
          assert(attackModel:GetAttribute(presentationAttributes.AttackSequence) == 3)
          assert(attackModel:GetAttribute(presentationAttributes.AttackServerTimestamp) == now)
          -- Downed operatives are not attacked.
          target.snapshot.lifeStateId = "Incapacitated"
          now += walker.AttackCooldownSeconds
          assert(service.evaluateAt(now).attackCommittedCount == 0, "only Alive operatives receive enemy damage")'''
          text = text[:old_start] + "    '''" + current_block + "'''" + text[old_end:]
          next_call = text.index('\nreplace_once(', call_start + 1)
          source_audit = text.index('\n# Source audit now locks truthful windup and runtime bounds.', next_call)
          text = text[:next_call] + text[source_audit:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply server-owned windup contract
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python .github/scripts/apply_exclusion_walker_windup.py > windup-apply.log 2>&1
          status=$?
          echo "$status" > windup-apply-status.txt
          cat windup-apply.log
          exit "$status"

      - name: Upload apply report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exclusion-walker-windup-apply-report
          path: |
            windup-apply.log
            windup-apply-status.txt

      - name: Stop after a guarded apply failure
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - name: Format changed Luau
        run: |
          stylua \
            games/living-kingdoms/src/shared/Combat/EnemyContracts.luau \
            games/living-kingdoms/src/shared/Config/EnemyConfig.luau \
            games/living-kingdoms/src/shared/Visual/EnemyPresentationContracts.luau \
            games/living-kingdoms/src/server/Systems/EnemyBehaviorResolver.luau \
            games/living-kingdoms/src/server/Systems/EnemyDirectorService.luau \
            games/living-kingdoms/src/client/Controllers/EnemyPresentationController.luau \
            games/living-kingdoms/src/client/Presentation/EnemyPresentationPoseResolver.luau \
            games/living-kingdoms/tests/EnemyBehaviorResolver.test.luau \
            games/living-kingdoms/tests/EnemyDirectorService.test.luau \
            games/living-kingdoms/tests/EnemyPresentationContracts.test.luau \
            games/living-kingdoms/tests/EnemyPresentationPoseResolver.test.luau \
            games/living-kingdoms/tests/ExclusionWalkerStateReadabilitySourceAudit.test.luau

      - name: Run focused windup fixtures
        run: |
          lune run games/living-kingdoms/tests/EnemyBehaviorResolver.test.luau
          lune run games/living-kingdoms/tests/EnemyDirectorService.test.luau
          lune run games/living-kingdoms/tests/EnemyPresentationContracts.test.luau
          lune run games/living-kingdoms/tests/EnemyPresentationPoseResolver.test.luau
          lune run games/living-kingdoms/tests/ExclusionWalkerStateReadabilitySourceAudit.test.luau

      - name: Restore trusted validation workflow
        run: |
          cat > .github/workflows/luau-validation.yml <<'EOF'
          name: Luau validation

          on:
            pull_request:
              paths:
                - "games/living-kingdoms/**"
                - "rokit.toml"
                - "stylua.toml"
                - "selene.toml"
                - ".github/workflows/luau-validation.yml"
            push:
              branches:
                - main
              paths:
                - "games/living-kingdoms/**"
                - "rokit.toml"
                - "stylua.toml"
                - "selene.toml"
                - ".github/workflows/luau-validation.yml"

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-22.04
              timeout-minutes: 15

              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Install pinned Rokit tools
                  uses: CompeyDev/setup-rokit@v0.1.2
                  with:
                    version: v1.2.0
                    path: .
                    cache: false
                    token: ${{ github.token }}

                - name: Check Luau formatting
                  shell: bash
                  run: stylua --check games/living-kingdoms/src

                - name: Run Selene
                  shell: bash
                  run: selene games/living-kingdoms/src

                - name: Run Lune fixtures
                  shell: bash
                  run: |
                    set -euo pipefail
                    fixture_count=0
                    while IFS= read -r -d '' fixture; do
                      echo "::group::Lune fixture: $fixture"
                      lune run "$fixture"
                      echo "::endgroup::"
                      fixture_count=$((fixture_count + 1))
                    done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
                    if [ "$fixture_count" -eq 0 ]; then
                      echo "No Living Kingdoms fixtures were discovered." >&2
                      exit 1
                    fi
                    echo "Executed $fixture_count Living Kingdoms fixtures."

                - name: Build Rojo project
                  shell: bash
                  run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx
          EOF

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add server-owned Exclusion Walker windup"
          git push origin HEAD:feat/exclusion-walker-attack-windup

name: Luau validation

on:
  pull_request:
    paths:
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: read

jobs:
  diagnose-operative-silhouette-fixtures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/operative-class-silhouettes

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Run fixtures and capture failures
        shell: bash
        run: |
          set +e
          : > operative-silhouette-fixtures.log
          status=0
          while IFS= read -r -d '' fixture; do
            echo "===== $fixture =====" | tee -a operative-silhouette-fixtures.log
            lune run "$fixture" >> operative-silhouette-fixtures.log 2>&1
            code=$?
            echo "exit=$code" | tee -a operative-silhouette-fixtures.log
            if [ "$code" -ne 0 ]; then status=1; fi
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          echo "$status" > operative-silhouette-fixtures-status.txt
          exit 0

      - name: Upload fixture report
        uses: actions/upload-artifact@v4
        with:
          name: operative-silhouette-fixture-report
          path: |
            operative-silhouette-fixtures.log
            operative-silhouette-fixtures-status.txt

name: Luau validation

on:
  pull_request:
    paths:
      - "games/living-kingdoms/**"
      - "docs/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"
  push:
    branches:
      - main
    paths:
      - "games/living-kingdoms/**"
      - "docs/**"
      - "rokit.toml"
      - "stylua.toml"
      - "selene.toml"
      - ".github/workflows/luau-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Check Luau formatting
        shell: bash
        run: stylua --check games/living-kingdoms/src

      - name: Run Selene
        shell: bash
        run: selene games/living-kingdoms/src

      - name: Run Lune fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            echo "::group::Lune fixture: $fixture"
            lune run "$fixture"
            echo "::endgroup::"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            echo "No Living Kingdoms fixtures were discovered." >&2
            exit 1
          fi
          echo "Executed $fixture_count Living Kingdoms fixtures."

      - name: Build Rojo project
        shell: bash
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

  finalize-pr137:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 137 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/screamer-interrupt-confirmation-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply authoritative interrupt confirmation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              file_path.write_text(source.replace(old, new, 1))

          special_config = "games/living-kingdoms/src/shared/Config/HordeSpecialTelegraphConfig.luau"
          replace_once(
              special_config,
              'local StateIds = table.freeze({\n\tIdle = "Idle",\n\tWindup = "Windup",\n\tCommitted = "Committed",\n})',
              'local StateIds = table.freeze({\n\tIdle = "Idle",\n\tWindup = "Windup",\n\tInterrupted = "Interrupted",\n\tCommitted = "Committed",\n})',
          )
          replace_once(
              special_config,
              'Version = "HROI-0131-v1-horde-special-telegraphs",',
              'Version = "HROI-0137-v1-screamer-interrupt-confirmation",',
          )

          server = "games/living-kingdoms/src/server/Systems/HordeExperienceService.luau"
          replace_once(
              server,
              '''local function cancelPendingSpecial(record: EnemyRecord)
\trecord.pendingSpecialKindId = nil
\trecord.pendingSpecialCommitServerTimestamp = nil
\trecord.model:SetAttribute(SpecialAttributeNames.KindId, nil)
\trecord.model:SetAttribute(SpecialAttributeNames.CommitServerTimestamp, 0)
\trecord.model:SetAttribute(SpecialAttributeNames.StateId, SpecialStateIds.Idle)
end''',
              '''local function interruptPendingSpecial(record: EnemyRecord)
\trecord.pendingSpecialKindId = nil
\trecord.pendingSpecialCommitServerTimestamp = nil
\trecord.model:SetAttribute(SpecialAttributeNames.CommitServerTimestamp, 0)
\trecord.model:SetAttribute(SpecialAttributeNames.StateId, SpecialStateIds.Interrupted)
end''',
          )
          replace_once(server, 'cancelPendingSpecial(record)', 'interruptPendingSpecial(record)')

          death_config = "games/living-kingdoms/src/shared/Config/HordeDeathPunctuationConfig.luau"
          replace_once(
              death_config,
              '''local KindIds = table.freeze({
\tScreamer = "Screamer",
\tBloater = "Bloater",''',
              '''local KindIds = table.freeze({
\tScreamer = "Screamer",
\tScreamerInterrupted = "ScreamerInterrupted",
\tBloater = "Bloater",''',
          )
          replace_once(
              death_config,
              '''\t[KindIds.Screamer] = table.freeze({
\t\tTitle = "CHOIR SILENCED",
\t\tColor = table.freeze({ 255, 224, 64 }),
\t\tBloodDiameterStuds = 6,
\t\tBloodColor = table.freeze({ 84, 7, 9 }),
\t\tShakeMagnitude = 0.18,
\t\tShakeDurationSeconds = 0.2,
\t\tBillboardLifetimeSeconds = 1.45,
\t}),
\t[KindIds.Bloater]''',
              '''\t[KindIds.Screamer] = table.freeze({
\t\tTitle = "CHOIR SILENCED",
\t\tColor = table.freeze({ 255, 224, 64 }),
\t\tBloodDiameterStuds = 6,
\t\tBloodColor = table.freeze({ 84, 7, 9 }),
\t\tShakeMagnitude = 0.18,
\t\tShakeDurationSeconds = 0.2,
\t\tBillboardLifetimeSeconds = 1.45,
\t}),
\t[KindIds.ScreamerInterrupted] = table.freeze({
\t\tTitle = "SUMMON INTERRUPTED",
\t\tColor = table.freeze({ 255, 244, 120 }),
\t\tBloodDiameterStuds = 6.5,
\t\tBloodColor = table.freeze({ 92, 8, 10 }),
\t\tShakeMagnitude = 0.26,
\t\tShakeDurationSeconds = 0.23,
\t\tBillboardLifetimeSeconds = 1.65,
\t}),
\t[KindIds.Bloater]''',
          )

          effects = "games/living-kingdoms/src/client/Controllers/HordeEffectsController.luau"
          replace_once(
              effects,
              '''local HordeConfig = require(ReplicatedStorage.Shared.Config.HordeExperienceConfig)
local HordeDeathPunctuationConfig = require(ReplicatedStorage.Shared.Config.HordeDeathPunctuationConfig)''',
              '''local HordeConfig = require(ReplicatedStorage.Shared.Config.HordeExperienceConfig)
local HordeDeathPunctuationConfig = require(ReplicatedStorage.Shared.Config.HordeDeathPunctuationConfig)
local HordeSpecialTelegraphConfig = require(ReplicatedStorage.Shared.Config.HordeSpecialTelegraphConfig)''',
          )
          replace_once(
              effects,
              '''local punctuationKindIds = HordeDeathPunctuationConfig.KindIds

type DeathPunctuationDefinition''',
              '''local punctuationKindIds = HordeDeathPunctuationConfig.KindIds
local SpecialAttributeNames = HordeSpecialTelegraphConfig.AttributeNames
local SpecialKindIds = HordeSpecialTelegraphConfig.KindIds
local SpecialStateIds = HordeSpecialTelegraphConfig.StateIds

type DeathPunctuationDefinition''',
          )
          replace_once(
              effects,
              '''local function readCombatEntityId(model: Model): string?
\tlocal value = model:GetAttribute("CombatEntityId")
\treturn if type(value) == "string" and value ~= "" then value else nil
end

local function resolveDeathPunctuation''',
              '''local function readStringAttribute(model: Model, attributeName: string): string?
\tlocal value = model:GetAttribute(attributeName)
\treturn if type(value) == "string" and value ~= "" then value else nil
end

local function readCombatEntityId(model: Model): string?
\treturn readStringAttribute(model, "CombatEntityId")
end

local function resolveDeathPunctuation''',
          )
          replace_once(
              effects,
              '''\tif roleId == HordeConfig.Roles.Screamer.Id then
\t\tkindId = punctuationKindIds.Screamer
\telseif roleId == HordeConfig.Roles.Bloater.Id then''',
              '''\tif roleId == HordeConfig.Roles.Screamer.Id then
\t\tlocal specialKindId = readStringAttribute(model, SpecialAttributeNames.KindId)
\t\tlocal specialStateId = readStringAttribute(model, SpecialAttributeNames.StateId)
\t\tlocal wasInterrupted = specialKindId == SpecialKindIds.ScreamerReinforcement
\t\t\tand (specialStateId == SpecialStateIds.Windup or specialStateId == SpecialStateIds.Interrupted)
\t\tkindId = if wasInterrupted then punctuationKindIds.ScreamerInterrupted else punctuationKindIds.Screamer
\telseif roleId == HordeConfig.Roles.Bloater.Id then''',
          )

          special_test = "games/living-kingdoms/tests/HordeSpecialTelegraphConfig.test.luau"
          replace_once(
              special_test,
              'assert(config.Version == "HROI-0131-v1-horde-special-telegraphs")',
              'assert(config.Version == "HROI-0137-v1-screamer-interrupt-confirmation")',
          )
          replace_once(
              special_test,
              'assert(attributeNames.HordeSpecialCommitServerTimestamp)\n',
              'assert(attributeNames.HordeSpecialCommitServerTimestamp)\nassert(config.StateIds.Interrupted == "Interrupted")\n',
          )

          death_test = "games/living-kingdoms/tests/HordeDeathPunctuationConfig.test.luau"
          replace_once(
              death_test,
              '''\t[config.KindIds.Screamer] = "CHOIR SILENCED",
\t[config.KindIds.Bloater]''',
              '''\t[config.KindIds.Screamer] = "CHOIR SILENCED",
\t[config.KindIds.ScreamerInterrupted] = "SUMMON INTERRUPTED",
\t[config.KindIds.Bloater]''',
          )

          audit = "games/living-kingdoms/tests/ScreamerInterruptConfirmationSourceAudit.test.luau"
          source = Path(audit).read_text()
          source = source.replace(
              '''local function contains(source: string, token: string): boolean
\treturn string.find(source, token, 1, true) ~= nil
end
''',
              '''local function contains(source: string, token: string): boolean
\treturn string.find(source, token, 1, true) ~= nil
end

local function count(source: string, token: string): number
\tlocal occurrences = 0
\tlocal startIndex = 1
\twhile true do
\t\tlocal found = string.find(source, token, startIndex, true)
\t\tif found == nil then
\t\t\treturn occurrences
\t\tend
\t\toccurrences += 1
\t\tstartIndex = found + #token
\tend
end
''',
              1,
          )
          source = source.replace(
              '''assertThat(
\tnot contains(server, "record.model:SetAttribute(SpecialAttributeNames.KindId, nil)"),
\t"interrupted Screamer corpses must preserve the authoritative special kind"
)
assertThat(
\tnot contains(server, "record.specialSequence += 1\\n\\trecord.pendingSpecialKindId = nil"),
\t"interrupting a summon cannot advance the warning sequence"
)
''',
              '''assertThat(
\tcount(server, "record.model:SetAttribute(SpecialAttributeNames.KindId, nil)") == 1,
\t"only enemy initialization may clear the special kind"
)
assertThat(
\tcount(server, "record.specialSequence += 1") == 1,
\t"only beginning a warning may advance the warning sequence"
)
''',
              1,
          )
          source = source.replace(
              '''assertThat(
\tcontains(effects, "specialStateId == SpecialStateIds.Windup or specialStateId == SpecialStateIds.Interrupted"),
\t"death feedback must tolerate authoritative replication ordering"
)
''',
              '''assertThat(contains(effects, "specialStateId == SpecialStateIds.Windup"), "Windup interrupt fact is missing")
assertThat(
\tcontains(effects, "specialStateId == SpecialStateIds.Interrupted"),
\t"durable Interrupted fact is missing"
)
''',
              1,
          )
          Path(audit).write_text(source)
          PY

      - name: Format focused Luau
        shell: bash
        run: |
          stylua \
            games/living-kingdoms/src/server/Systems/HordeExperienceService.luau \
            games/living-kingdoms/src/shared/Config/HordeSpecialTelegraphConfig.luau \
            games/living-kingdoms/src/shared/Config/HordeDeathPunctuationConfig.luau \
            games/living-kingdoms/src/client/Controllers/HordeEffectsController.luau \
            games/living-kingdoms/tests/HordeSpecialTelegraphConfig.test.luau \
            games/living-kingdoms/tests/HordeDeathPunctuationConfig.test.luau \
            games/living-kingdoms/tests/ScreamerInterruptConfirmationConfig.test.luau \
            games/living-kingdoms/tests/ScreamerInterruptConfirmationSourceAudit.test.luau

      - name: Run complete validation
        shell: bash
        run: |
          set -euo pipefail
          stylua --check games/living-kingdoms/src
          selene games/living-kingdoms/src
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0
          rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated feature tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            games/living-kingdoms/src/server/Systems/HordeExperienceService.luau \
            games/living-kingdoms/src/shared/Config/HordeSpecialTelegraphConfig.luau \
            games/living-kingdoms/src/shared/Config/HordeDeathPunctuationConfig.luau \
            games/living-kingdoms/src/client/Controllers/HordeEffectsController.luau \
            games/living-kingdoms/tests/HordeSpecialTelegraphConfig.test.luau \
            games/living-kingdoms/tests/HordeDeathPunctuationConfig.test.luau \
            games/living-kingdoms/tests/ScreamerInterruptConfirmationConfig.test.luau \
            games/living-kingdoms/tests/ScreamerInterruptConfirmationSourceAudit.test.luau
          git diff --cached --quiet && exit 0
          git commit -m "Confirm authoritative Screamer interrupts"
          git push origin HEAD:feat/screamer-interrupt-confirmation-v1

name: VIS-0102 tracer patch

on:
  push:
    branches:
      - "agent/vis-0102-hit-confirmed-tracer"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/vis-0102-hit-confirmed-tracer

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Update tracer registry and roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path("games/living-kingdoms/src/shared/Config/VisualAssetConfig.luau")
          source = registry.read_text()
          old = "Accepted shots now drive temporary code-built muzzle flash, casing ejection, and authoritative damage-impact presentation; tracer and production effects remain pending."
          new = "Accepted shots now drive temporary code-built muzzle flash, casing ejection, hit-confirmed tracer, and authoritative damage-impact presentation; production effects remain pending."
          if old in source:
              source = source.replace(old, new, 1)
              registry.write_text(source)
          elif new not in source:
              raise SystemExit("visual registry tracer status text not found")

          roadmap = Path("docs/roadmap/VISUAL-PRODUCTION-TRACK.md")
          source = roadmap.read_text()
          anchor = "   - Accepted shots also drive temporary muzzle flash and casing presentation; an impact spark appears only when the server confirms that damage was applied and supplies the impact position.\n"
          addition = anchor + "   - Hit-confirmed tracer policy now permits one 0.055-second presentation-only streak from the correct visible muzzle to the server-disclosed damage endpoint; blocked and non-damaging shots display no tracer.\n"
          if anchor in source and "Hit-confirmed tracer policy" not in source:
              source = source.replace(anchor, addition, 1)
          pending_old = "   - Still required: Roblox Studio mesh import and canonical swap, grip/isometric readability review, tracer policy, production effects, audio, and representative performance evidence."
          pending_new = "   - Still required: Roblox Studio mesh import and canonical swap, grip/isometric readability review, production effects, audio, and representative performance evidence."
          if pending_old in source:
              source = source.replace(pending_old, pending_new, 1)
          elif pending_new not in source:
              raise SystemExit("VIS-0102 pending work line not found")
          roadmap.write_text(source)
          PY

          stylua \
            games/living-kingdoms/src/client/Presentation/WeaponShotEffectPresenter.luau \
            games/living-kingdoms/tests/HitConfirmedTracerSourceAudit.test.luau

      - name: Commit patch
        run: |
          if [ -z "$(git status --porcelain -- docs games/living-kingdoms)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs games/living-kingdoms
          git commit -m "Integrate hit-confirmed tracer policy"
          git push

name: Walker StyLua apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}
      - name: Apply pinned StyLua
        run: |
          stylua \
            games/living-kingdoms/src/client/Controllers/EnemyPresentationController.luau \
            games/living-kingdoms/src/client/Presentation/EnemyPresentationPoseResolver.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/src/server/Systems/EnemyPresentationService.luau
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "StyLua made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            games/living-kingdoms/src/client/Controllers/EnemyPresentationController.luau \
            games/living-kingdoms/src/client/Presentation/EnemyPresentationPoseResolver.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/src/server/Systems/EnemyPresentationService.luau
          git commit -m "style(living-kingdoms): apply pinned StyLua"
          git push origin HEAD:${{ github.head_ref }}

name: Final horde special telegraph validation once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/horde-special-telegraphs-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/horde-special-telegraphs-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply corrected integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/horde-special-telegraphs-once.yml').read_text()
          marker = '      - name: Wire authoritative special telegraphs\n'
          section = workflow.split(marker, 1)[1].split('\n\n      - name: Format focused Luau', 1)[0]
          script = textwrap.dedent(section.split('        run: |\n', 1)[1])

          old_helper = '''          def replace_once(path, old, new):
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              file_path.write_text(source.replace(old, new, 1))
          '''
          new_helper = old_helper + '''
          def replace_first(path, old, new):
              file_path = Path(path)
              source = file_path.read_text()
              if old not in source:
                  raise RuntimeError(f"{path}: expected at least one replacement")
              file_path.write_text(source.replace(old, new, 1))
          '''
          if script.count(old_helper) != 1:
              raise RuntimeError('could not locate integration helper')
          script = script.replace(old_helper, new_helper, 1)

          target = '''          replace_once(
              audio,
              '''\\tlocal hitSequence = readNumberAttribute(model, PresentationAttributeNames.HitSequence)
          \\tif''',
              '''\\tlocal hitSequence = readNumberAttribute(model, PresentationAttributeNames.HitSequence)
          \\tlocal specialSequence = readNumberAttribute(model, SpecialAttributeNames.Sequence) or 0
          \\tif''',
          )'''
          replacement = target.replace('replace_once(', 'replace_first(', 1)
          if script.count(target) != 1:
              raise RuntimeError('could not locate initial audio sequence patch')
          script = script.replace(target, replacement, 1)
          Path('/tmp/apply-corrected.sh').write_text(script)
          PY
          bash /tmp/apply-corrected.sh

      - name: Format focused Luau
        run: |
          stylua \
            games/living-kingdoms/src/server/Systems/HordeExperienceService.luau \
            games/living-kingdoms/src/client/Controllers/HordeSpecialTelegraphController.luau \
            games/living-kingdoms/src/client/Controllers/EnemyAudioController.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/src/shared/Config/HordeSpecialTelegraphConfig.luau \
            games/living-kingdoms/src/shared/Config/EnemyAudioConfig.luau \
            games/living-kingdoms/tests/HordeSpecialTelegraphConfig.test.luau \
            games/living-kingdoms/tests/HordeSpecialTelegraphSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0
          echo "Executed $fixture_count fixtures."

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/horde-special-telegraphs-once.yml \
            .github/workflows/diagnose-horde-special-telegraphs-once.yml \
            .github/workflows/finalize-horde-special-telegraphs-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make horde special attacks readable before they commit"
          git push origin HEAD:feat/horde-special-telegraphs-v1

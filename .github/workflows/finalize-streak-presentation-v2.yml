name: Finalize streak presentation v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/streak-presentation-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/streak-presentation-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply final integration and audit correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/finalize-streak-presentation-once.yml').read_text()
          marker = '      - name: Wire authoritative streak crescendo\n'
          section = source.split(marker, 1)[1].split('\n\n      - name: Format focused Luau', 1)[0]
          script = section.split('        run: |\n', 1)[1]
          Path('/tmp/replay.sh').write_text(textwrap.dedent(script))

          audit_path = Path('games/living-kingdoms/tests/HordeVerticalSliceSourceAudit.test.luau')
          audit = audit_path.read_text()
          old = '\t\t"MASSACRE",\n\t\t"streakExpiresServerTimestamp",'
          new = '\t\t"streakExpiresServerTimestamp",'
          if audit.count(old) != 1:
              raise RuntimeError('expected one legacy controller vocabulary assertion')
          audit_path.write_text(audit.replace(old, new, 1))
          PY
          bash /tmp/replay.sh

      - name: Format focused Luau
        run: |
          stylua \
            games/living-kingdoms/src/server/Systems/HordeExperienceService.luau \
            games/living-kingdoms/src/client/Controllers/HordeHUDController.luau \
            games/living-kingdoms/src/client/Controllers/MassacreCrescendoController.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/src/shared/Config/MassacreCrescendoConfig.luau \
            games/living-kingdoms/tests/HordeVerticalSliceSourceAudit.test.luau \
            games/living-kingdoms/tests/MassacreCrescendoConfig.test.luau \
            games/living-kingdoms/tests/MassacreCrescendoSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          while IFS= read -r -d '' fixture; do
            echo "=== $fixture ==="
            lune run "$fixture"
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json -o /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          rm -f \
            .github/workflows/finalize-streak-presentation-once.yml \
            .github/workflows/diagnose-streak-presentation-once.yml \
            .github/workflows/finalize-streak-presentation-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make authoritative kill chains escalate audiovisually"
          git push origin HEAD:feat/streak-presentation-v1

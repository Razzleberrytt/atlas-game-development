name: Walker disclosure fixture synchronization

on:
  push:
    branches:
      - feat/exclusion-walker-attack-disclosure

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exclusion-walker-attack-disclosure
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}
      - name: Synchronize executable director fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}; found {count}: {old[:100]!r}")
              file_path.write_text(text.replace(old, new, 1))

          director_test = "games/living-kingdoms/tests/EnemyDirectorService.test.luau"
          replace_once(
              director_test,
              'local contracts = loadSimple("games/living-kingdoms/src/shared/Combat/EnemyContracts.luau", "EnemyContracts")\nlocal worldConfig =',
              'local contracts = loadSimple("games/living-kingdoms/src/shared/Combat/EnemyContracts.luau", "EnemyContracts")\nlocal presentationContracts = loadSimple(\n\t"games/living-kingdoms/src/shared/Visual/EnemyPresentationContracts.luau",\n\t"EnemyPresentationContracts"\n)\nlocal worldConfig =',
          )
          replace_once(
              director_test,
              'local CONFIG_TOKEN = {}\nlocal RESOLVER_TOKEN = {}',
              'local CONFIG_TOKEN = {}\nlocal PRESENTATION_TOKEN = {}\nlocal RESOLVER_TOKEN = {}',
          )
          replace_once(
              director_test,
              '''\tShared = {\n\t\tCombat = { EnemyContracts = CONTRACTS_TOKEN },\n\t\tConfig = { EnemyConfig = CONFIG_TOKEN, WorldFoundationConfig = WORLD_TOKEN },\n\t},''',
              '''\tShared = {\n\t\tCombat = { EnemyContracts = CONTRACTS_TOKEN },\n\t\tConfig = { EnemyConfig = CONFIG_TOKEN, WorldFoundationConfig = WORLD_TOKEN },\n\t\tVisual = { EnemyPresentationContracts = PRESENTATION_TOKEN },\n\t},''',
          )
          replace_once(
              director_test,
              '''\t\t\telseif token == CONTRACTS_TOKEN then\n\t\t\t\treturn contracts\n\t\t\telseif token == WORLD_TOKEN then''',
              '''\t\t\telseif token == CONTRACTS_TOKEN then\n\t\t\t\treturn contracts\n\t\t\telseif token == PRESENTATION_TOKEN then\n\t\t\t\treturn presentationContracts\n\t\t\telseif token == WORLD_TOKEN then''',
          )
          replace_once(
              director_test,
              '''local walkerModel = findCreated("Test Walker")\nassert(walkerModel ~= nil and walkerModel:GetAttribute("CombatEntityId") == "enemy.a")''',
              '''local walkerModel = findCreated("Test Walker")\nassert(walkerModel ~= nil and walkerModel:GetAttribute("CombatEntityId") == "enemy.a")\nlocal presentationAttributes = presentationContracts.AttributeNames\nassert(walkerModel:GetAttribute(presentationAttributes.BehaviorStateId) == "Roaming")\nassert(walkerModel:GetAttribute(presentationAttributes.LifeStateId) == presentationContracts.LifeStateIds.Alive)\nassert(walkerModel:GetAttribute(presentationAttributes.AttackSequence) == 0)\nassert(walkerModel:GetAttribute(presentationAttributes.AttackServerTimestamp) == 0)\nassert(walkerModel:GetAttribute(presentationAttributes.HitSequence) == 0)\nassert(walkerModel:GetAttribute(presentationAttributes.HitServerTimestamp) == 0)''',
          )
          replace_once(
              director_test,
              '''assert(service.spawnEnemy(request("enemy.biter", 0, 0)).didSpawn)\ntargetRoot.Position = roblox.Vector3.new(3, 2, 0)''',
              '''assert(service.spawnEnemy(request("enemy.biter", 0, 0)).didSpawn)\nlocal attackModel = findCreated("Test Walker")\nassert(attackModel ~= nil)\ntargetRoot.Position = roblox.Vector3.new(3, 2, 0)''',
          )
          replace_once(
              director_test,
              '''assert(damageCalls[1].damage.sourceEntityId == "enemy.biter")\nassert(damageCalls[1].damage.serverTimestamp == 10)''',
              '''assert(damageCalls[1].damage.sourceEntityId == "enemy.biter")\nassert(damageCalls[1].damage.serverTimestamp == 10)\nassert(attackModel:GetAttribute(presentationAttributes.BehaviorStateId) == "Attacking")\nassert(attackModel:GetAttribute(presentationAttributes.AttackSequence) == 1)\nassert(attackModel:GetAttribute(presentationAttributes.AttackServerTimestamp) == 10)''',
          )
          replace_once(
              director_test,
              '''assert(service.evaluateAt(now).attackCommittedCount == 1)\nassert(#damageCalls == 2)\n-- A rejected life commit leaves the cooldown unarmed so the swing retries.''',
              '''assert(service.evaluateAt(now).attackCommittedCount == 1)\nassert(#damageCalls == 2)\nassert(attackModel:GetAttribute(presentationAttributes.AttackSequence) == 2)\nassert(attackModel:GetAttribute(presentationAttributes.AttackServerTimestamp) == now)\n-- A rejected life commit leaves the cooldown unarmed so the swing retries.''',
          )
          replace_once(
              director_test,
              '''now += walker.AttackCooldownSeconds\nassert(service.evaluateAt(now).attackCommittedCount == 0)\nnow += 0.2\nassert(service.evaluateAt(now).attackCommittedCount == 1, "rejected commits must not consume the cooldown")''',
              '''now += walker.AttackCooldownSeconds\nassert(service.evaluateAt(now).attackCommittedCount == 0)\nassert(attackModel:GetAttribute(presentationAttributes.AttackSequence) == 2, "rejected damage must not disclose an attack")\nnow += 0.2\nassert(service.evaluateAt(now).attackCommittedCount == 1, "rejected commits must not consume the cooldown")\nassert(attackModel:GetAttribute(presentationAttributes.AttackSequence) == 3)\nassert(attackModel:GetAttribute(presentationAttributes.AttackServerTimestamp) == now)''',
          )
          replace_once(
              director_test,
              '''assert(service.spawnEnemy(request("enemy.mark", 0, 0)).didSpawn)\nlocal read = service.readHealthState("enemy.mark")''',
              '''assert(service.spawnEnemy(request("enemy.mark", 0, 0)).didSpawn)\nlocal markModel = findCreated("Test Walker")\nassert(markModel ~= nil)\nlocal read = service.readHealthState("enemy.mark")''',
          )
          replace_once(
              director_test,
              '''local afterHit = service.readHealthState("enemy.mark")\nassert(afterHit ~= nil and afterHit.revision == 2 and afterHit.healthState.currentHealth == 40)''',
              '''local afterHit = service.readHealthState("enemy.mark")\nassert(afterHit ~= nil and afterHit.revision == 2 and afterHit.healthState.currentHealth == 40)\nassert(markModel:GetAttribute(presentationAttributes.HitSequence) == 1)\nassert(markModel:GetAttribute(presentationAttributes.HitServerTimestamp) == 5)''',
          )
          replace_once(
              director_test,
              '''local dead = service.readHealthState("enemy.mark")\nassert(dead ~= nil and not dead.isAlive)''',
              '''local dead = service.readHealthState("enemy.mark")\nassert(dead ~= nil and not dead.isAlive)\nassert(markModel:GetAttribute(presentationAttributes.HitSequence) == 2)\nassert(markModel:GetAttribute(presentationAttributes.HitServerTimestamp) == 7)\nassert(markModel:GetAttribute(presentationAttributes.LifeStateId) == presentationContracts.LifeStateIds.Dead)\nassert(markModel:GetAttribute(presentationAttributes.BehaviorStateId) == "Dead")''',
          )
          replace_once(
              director_test,
              '''local markModel = findCreated("Test Walker")\nassert(markModel ~= nil and not markModel._destroyed, "the corpse must persist through the cleanup window")''',
              '''assert(markModel ~= nil and not markModel._destroyed, "the corpse must persist through the cleanup window")''',
          )

          integration_test = "games/living-kingdoms/tests/P5IntegrationValidation.test.luau"
          replace_once(
              integration_test,
              'local enemyContracts = loadSimple("games/living-kingdoms/src/shared/Combat/EnemyContracts.luau", "EnemyContracts")\nlocal worldConfig =',
              'local enemyContracts = loadSimple("games/living-kingdoms/src/shared/Combat/EnemyContracts.luau", "EnemyContracts")\nlocal presentationContracts = loadSimple(\n\t"games/living-kingdoms/src/shared/Visual/EnemyPresentationContracts.luau",\n\t"EnemyPresentationContracts"\n)\nlocal worldConfig =',
          )
          replace_once(
              integration_test,
              'local ENEMY_CONFIG_TOKEN = {}\nlocal MISSION_CONFIG_TOKEN = {}',
              'local ENEMY_CONFIG_TOKEN = {}\nlocal PRESENTATION_TOKEN = {}\nlocal MISSION_CONFIG_TOKEN = {}',
          )
          replace_once(
              integration_test,
              '''\t\tMission = { MissionContracts = MISSION_CONTRACTS_TOKEN },\n\t},''',
              '''\t\tMission = { MissionContracts = MISSION_CONTRACTS_TOKEN },\n\t\tVisual = { EnemyPresentationContracts = PRESENTATION_TOKEN },\n\t},''',
          )
          replace_once(
              integration_test,
              '''\t\t\telseif token == ENEMY_CONTRACTS_TOKEN then\n\t\t\t\treturn enemyContracts\n\t\t\telseif token == WORLD_TOKEN then''',
              '''\t\t\telseif token == ENEMY_CONTRACTS_TOKEN then\n\t\t\t\treturn enemyContracts\n\t\t\telseif token == PRESENTATION_TOKEN then\n\t\t\t\treturn presentationContracts\n\t\t\telseif token == WORLD_TOKEN then''',
          )
          PY
          stylua \
            games/living-kingdoms/tests/EnemyDirectorService.test.luau \
            games/living-kingdoms/tests/P5IntegrationValidation.test.luau
          lune run games/living-kingdoms/tests/EnemyDirectorService.test.luau
          lune run games/living-kingdoms/tests/P5IntegrationValidation.test.luau
      - name: Commit synchronized fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            games/living-kingdoms/tests/EnemyDirectorService.test.luau \
            games/living-kingdoms/tests/P5IntegrationValidation.test.luau
          git commit -m "test: synchronize Walker presentation disclosure fixtures"
          git push origin HEAD:feat/exclusion-walker-attack-disclosure
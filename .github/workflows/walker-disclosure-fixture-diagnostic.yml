name: Walker disclosure fixture diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  director-a-f:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}
      - run: |
          set -euo pipefail
          failed=0
          for file in games/living-kingdoms/tests/[A-F]*.test.luau; do
            [ -e "$file" ] || continue
            grep -q 'EnemyDirectorService.luau' "$file" || continue
            echo "Running $file"
            lune run "$file" || failed=1
          done
          exit "$failed"


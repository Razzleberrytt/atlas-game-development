name: Walker disclosure fixture diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}
      - name: Run director fixtures and record failures
        run: |
          set +e
          : > director-fixtures.txt
          : > failing-director-fixtures.txt
          for file in games/living-kingdoms/tests/*.test.luau; do
            grep -q 'EnemyDirectorService.luau' "$file" || continue
            echo "$file" >> director-fixtures.txt
            echo "Running $file"
            lune run "$file"
            if [ "$?" -ne 0 ]; then
              echo "$file" >> failing-director-fixtures.txt
            fi
          done
          echo "All director fixtures:"
          cat director-fixtures.txt
          echo "Failing director fixtures:"
          cat failing-director-fixtures.txt
      - uses: actions/upload-artifact@v4
        with:
          name: walker-director-fixture-report
          path: |
            director-fixtures.txt
            failing-director-fixtures.txt
          if-no-files-found: error
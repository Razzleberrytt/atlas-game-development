name: Agent 4 final merge-gate formatter

on:
  push:
    branches:
      - agent-4/progression-core-wave-1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent-4/progression-core-wave-1
          fetch-depth: 0

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Format remaining merge-gate files
        run: |
          stylua \
            games/living-kingdoms/src/server/Systems/PlayerInventoryPersistenceService.luau \
            games/living-kingdoms/src/server/Systems/ModularDungeonRoomPresentation.luau \
            games/living-kingdoms/src/client/Presentation/RewardContainerViewportPresenter.luau \
            games/living-kingdoms/tests/presentation/ModularAssetReadinessSourceAudit.test.luau \
            games/living-kingdoms/tests/presentation/ModularDungeonRoomPresentationSourceAudit.test.luau \
            games/living-kingdoms/tests/presentation/RewardContainerViewportPresenterSourceAudit.test.luau

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/src games/living-kingdoms/tests
          git commit -m "style(living-kingdoms): clear merge-gate StyLua drift"
          git push origin HEAD:agent-4/progression-core-wave-1

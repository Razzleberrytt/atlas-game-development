name: Format RPG-0101 declarations

on:
  push:
    branches:
      - feat/rpg-0101-contracts-config

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/rpg-0101-contracts-config
          fetch-depth: 0

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Format focused RPG files
        shell: bash
        run: |
          set -euo pipefail
          stylua \
            games/living-kingdoms/src/shared/RPG/RunRpgContracts.luau \
            games/living-kingdoms/src/shared/Config/RunRpgConfig.luau \
            games/living-kingdoms/tests/RunRpgContractsConfig.test.luau
          rm .github/workflows/format-rpg-0101.yml

      - name: Commit exact formatter output and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            games/living-kingdoms/src/shared/RPG/RunRpgContracts.luau \
            games/living-kingdoms/src/shared/Config/RunRpgConfig.luau \
            games/living-kingdoms/tests/RunRpgContractsConfig.test.luau \
            .github/workflows/format-rpg-0101.yml
          git commit -m "Format RPG-0101 declarations"
          git push origin HEAD:feat/rpg-0101-contracts-config

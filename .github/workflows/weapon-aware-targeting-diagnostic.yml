name: Diagnose weapon-aware targeting once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feat/weapon-aware-auto-targeting-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/weapon-aware-auto-targeting-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Reproduce production wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/weapon-aware-targeting-once.yml').read_text()
          marker = '      - name: Wire weapon-aware targeting\n'
          section = source.split(marker, 1)[1].split('\n\n      - name: Format focused Luau', 1)[0]
          script = section.split('        run: |\n', 1)[1]
          Path('/tmp/reproduce.sh').write_text(textwrap.dedent(script))
          PY
          bash /tmp/reproduce.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('games/living-kingdoms/tests/WeaponTargetSelector.test.luau')
          source = path.read_text()
          old = 'candidate("hostile.close", 6, 0)'
          if source.count(old) != 1:
              raise RuntimeError('expected one no-opportunity candidate')
          path.write_text(source.replace(old, 'candidate("hostile.close", 0, 6)', 1))
          PY

      - name: Run focused selector fixtures
        run: |
          lune run games/living-kingdoms/tests/WeaponTargetSelector.test.luau
          lune run games/living-kingdoms/tests/WeaponTargetSelectorSourceAudit.test.luau

      - name: Capture complete fixture suite
        id: full_suite
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' fixture; do
            echo "FIXTURE $fixture"
            lune run "$fixture"
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z) 2>&1 | tee /tmp/weapon-target-full-suite.log

      - name: Upload full-suite diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weapon-target-full-suite-log
          path: /tmp/weapon-target-full-suite.log
          retention-days: 1

      - name: Enforce suite result
        if: steps.full_suite.outcome == 'failure'
        run: exit 1

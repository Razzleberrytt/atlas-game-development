name: Temporary Ability Power patch

on:
  push:
    branches:
      - roadmap/ability-power-live

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply guarded ClassService patch, format, and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('games/living-kingdoms/src/server/Systems/ClassService.luau')
          text = path.read_text()

          replacements = [
              (
                  '\tactionCooldownDurationMultiplier: number?,\n\tresources:',
                  '\tactionCooldownDurationMultiplier: number?,\n\tactionPowerMultiplier: number?,\n\tresources:',
              ),
              (
                  '\t\tactionCooldownDurationMultiplier = nil,\n\t\tresources =',
                  '\t\tactionCooldownDurationMultiplier = nil,\n\t\tactionPowerMultiplier = nil,\n\t\tresources =',
              ),
              (
                  '''local function clearActionContinuity(entry: Entry)\n\tentry.actionOriginPosition = nil\n\tentry.actionActorProcessedDamageEventIds = nil\n\tentry.actionCooldownDurationMultiplier = nil\nend''',
                  '''local function clearActionContinuity(entry: Entry)\n\tentry.actionOriginPosition = nil\n\tentry.actionActorProcessedDamageEventIds = nil\n\tentry.actionCooldownDurationMultiplier = nil\n\tentry.actionPowerMultiplier = nil\nend''',
              ),
              (
                  '\tlocal cooldownDurationMultiplier = entry.actionCooldownDurationMultiplier or 1\n\tlocal resolution',
                  '\tlocal cooldownDurationMultiplier = entry.actionCooldownDurationMultiplier or 1\n\tlocal abilityPowerMultiplier = entry.actionPowerMultiplier or 1\n\tlocal resolution',
              ),
              (
                  '\t\t\t\t\thealingAmount = ClassConfig.Actions.FieldTreatment.healAmount,',
                  '\t\t\t\t\thealingAmount = ClassConfig.Actions.FieldTreatment.healAmount * abilityPowerMultiplier,',
              ),
              (
                  '\t\t\t\t\tClassConfig.Actions.FieldResupply.roundsPerCharge\n\t\t\t\t)',
                  '\t\t\t\t\tmath.max(1, math.floor(ClassConfig.Actions.FieldResupply.roundsPerCharge * abilityPowerMultiplier + 0.5))\n\t\t\t\t)',
              ),
              (
                  '\t\t\tentry.actionCooldownDurationMultiplier = effectiveAbilityCooldownDurationMultiplier(player)\n\t\tend',
                  '\t\t\tentry.actionCooldownDurationMultiplier = effectiveAbilityCooldownDurationMultiplier(player)\n\t\t\tentry.actionPowerMultiplier = effectiveAbilityPowerMultiplier(player)\n\t\tend',
              ),
              (
                  '\t\treturn ClassConfig.Actions.Brace.cadenceIntervalMultiplier\n\tend\n\treturn 1\nend',
                  '\t\tlocal baseMultiplier = ClassConfig.Actions.Brace.cadenceIntervalMultiplier\n\t\tlocal powerMultiplier = entry.actionPowerMultiplier or 1\n\t\treturn math.clamp(1 - (1 - baseMultiplier) * powerMultiplier, 0.25, 1)\n\tend\n\treturn 1\nend',
              ),
          ]

          marker = '''local function clearActionContinuity(entry: Entry)'''
          helper = '''local function effectiveAbilityPowerMultiplier(player: Player): number\n\tif RelicModifierService == nil then\n\t\treturn 1\n\tend\n\tlocal modifiers = RelicModifierService.read(player)\n\tlocal multiplier = (modifiers :: any).equipmentAbilityPowerMultiplier\n\tif\n\t\ttype(multiplier) ~= "number"\n\t\tor multiplier ~= multiplier\n\t\tor multiplier == math.huge\n\t\tor multiplier == -math.huge\n\t\tor multiplier < 1\n\t\tor multiplier > 2\n\tthen\n\t\treturn 1\n\tend\n\treturn multiplier\nend\n\n'''

          if 'local function effectiveAbilityPowerMultiplier(player: Player): number' not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f'expected one ClassService continuity marker, found {text.count(marker)}')
              text = text.replace(marker, helper + marker, 1)

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guarded replacement expected once, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          stylua games/living-kingdoms/src/server/Systems/ClassService.luau
          rm .github/workflows/temporary-ability-power-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(lk): apply ability power in class authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"

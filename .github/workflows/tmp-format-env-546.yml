name: Temporary environment formatter

on:
  push:
    branches:
      - feat/lk-hierarchical-environment-packing

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/lk-hierarchical-environment-packing

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false

      - name: Apply pinned StyLua formatting
        run: |
          stylua games/living-kingdoms/src/server/EnvironmentModelFactory.luau games/living-kingdoms/tests/EnvironmentModelSourceAudit.test.luau

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/src/server/EnvironmentModelFactory.luau games/living-kingdoms/tests/EnvironmentModelSourceAudit.test.luau
          git commit -m "style(environment): apply pinned StyLua formatting"
          git push origin HEAD:feat/lk-hierarchical-environment-packing

name: LK LKB-0033 Source Snapshot

on:
  push:
    branches:
      - lk/LKB-0033-run-build-rpg-playergui-waits

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload Living Kingdoms client source
        uses: actions/upload-artifact@v4
        with:
          name: lk-lkb0033-client-source
          path: games/living-kingdoms/src/client
          if-no-files-found: error
          retention-days: 1

name: Refine bounded rear-target validation once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/authoritative-weapon-patterns-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/authoritative-weapon-patterns-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply bounded validation refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/refine_sniper_pierce_validation.py")
          source = path.read_text()
          anchor = '''def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              file_path.write_text(source.replace(old, new, 1))
          '''
          addition = anchor + '''

          def replace_first(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text()
              if old not in source:
                  raise RuntimeError(f"{path}: expected first replacement token")
              file_path.write_text(source.replace(old, new, 1))
          '''
          if source.count(anchor) != 1:
              raise RuntimeError("replace_once anchor drifted")
          source = source.replace(anchor, addition, 1)
          needle = "replace_once(\n    resolver,\n    '''\\tfor _, fact in targetFacts do"
          replacement = "replace_first(\n    resolver,\n    '''\\tfor _, fact in targetFacts do"
          if source.count(needle) != 1:
              raise RuntimeError(f"cone helper call count: {source.count(needle)}")
          path.write_text(source.replace(needle, replacement, 1))
          PY
          python3 tools/refine_sniper_pierce_validation.py

      - name: Format edited Luau
        run: |
          stylua \
            games/living-kingdoms/src/server/Systems/WeaponPatternResolver.luau \
            games/living-kingdoms/src/server/Systems/OperativeCombatRuntimeService.luau \
            games/living-kingdoms/tests/WeaponPatternResolver.test.luau \
            games/living-kingdoms/tests/WeaponPatternSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            echo "::group::Lune fixture: $fixture"
            lune run "$fixture"
            echo "::endgroup::"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0
          echo "Executed $fixture_count fixtures."

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated refinement
        shell: bash
        run: |
          set -euo pipefail
          rm tools/refine_sniper_pierce_validation.py
          rm .github/workflows/refine-sniper-pierce-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate sniper rear targets beyond the primary"
          git push origin HEAD:feat/authoritative-weapon-patterns-v1

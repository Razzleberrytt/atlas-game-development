name: Harden horde role readability once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/horde-role-readability-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/horde-role-readability-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Harden replication-safe role composition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              file_path.write_text(source.replace(old, new, 1))

          presenter = "games/living-kingdoms/src/server/Systems/EnemyPresentationService.luau"
          replace_once(
              presenter,
              "\tpart.Size = size\n\tif shape ~= nil then",
              '\tpart.Size = size\n\tpart:SetAttribute("HordeRoleBaseSize", size)\n\tif shape ~= nil then',
          )
          replace_once(
              presenter,
              "\tmotor.C0 = motorParent.CFrame:ToObjectSpace(part.CFrame)\n\tmotor.C1 = CFrame.new()",
              '\tmotor.C0 = motorParent.CFrame:ToObjectSpace(part.CFrame)\n\tmotor:SetAttribute("HordeRoleBaseC0", motor.C0)\n\tmotor.C1 = CFrame.new()',
          )

          service = "games/living-kingdoms/src/server/Systems/HordeRolePresentationService.luau"
          replace_once(service, 'local STRIDE_SCALE_ATTRIBUTE = "HordeRoleStrideScale"\n', "")
          replace_once(
              service,
              '''\tlocal defaultStride = HordeRolePresentationConfig.Default.StridesPerSecond
          \tenemyModel:SetAttribute(STRIDE_SCALE_ATTRIBUTE, profile.StridesPerSecond / defaultStride)
          ''',
              "",
          )

          controller = "games/living-kingdoms/src/client/Controllers/EnemyPresentationController.luau"
          replace_once(
              controller,
              "local EnemyConfig = require(ReplicatedStorage.Shared.Config.EnemyConfig)\nlocal EnemyContracts",
              "local EnemyConfig = require(ReplicatedStorage.Shared.Config.EnemyConfig)\nlocal HordeRolePresentationConfig = require(ReplicatedStorage.Shared.Config.HordeRolePresentationConfig)\nlocal EnemyContracts",
          )
          replace_once(
              controller,
              '''\tphaseOffsetSeconds: number,
          \tposeId: string,
          }''',
              '''\tphaseOffsetSeconds: number,
          \tposeId: string,
          \troleId: string,
          }''',
          )
          replace_once(
              controller,
              '''local function readStringAttribute(model: Model, attributeName: string): string?
          \tlocal value = model:GetAttribute(attributeName)
          \treturn if type(value) == "string" then value else nil
          end

          local function stablePhaseOffset''',
              '''local function readStringAttribute(model: Model, attributeName: string): string?
          \tlocal value = model:GetAttribute(attributeName)
          \treturn if type(value) == "string" then value else nil
          end

          local function colorFromTuple(tuple: HordeRolePresentationConfig.Triple): Color3
          \treturn Color3.fromRGB(tuple[1], tuple[2], tuple[3])
          end

          local function roleProfile(roleId: string): HordeRolePresentationConfig.RolePresentationProfile
          \treturn HordeRolePresentationConfig.get(roleId) or HordeRolePresentationConfig.Default
          end

          local function readMotorBaseC0(motor: Motor6D): CFrame
          \tlocal baseC0 = motor:GetAttribute("HordeRoleBaseC0")
          \treturn if typeof(baseC0) == "CFrame" then baseC0 else motor.C0
          end

          local function stablePhaseOffset''',
          )
          replace_once(
              controller,
              '''\trecords[model] = {
          \t\troot = root,''',
              '''\tlocal roleId = readStringAttribute(model, "HordeRoleId") or HordeRolePresentationConfig.Default.RoleId
          \trecords[model] = {
          \t\troot = root,''',
          )
          replace_once(
              controller,
              '''\t\ttorsoBaseC0 = torsoMotor.C0,
          \t\tleftArmBaseC0 = leftArmMotor.C0,
          \t\trightArmBaseC0 = rightArmMotor.C0,
          \t\tleftLegBaseC0 = leftLegMotor.C0,
          \t\trightLegBaseC0 = rightLegMotor.C0,''',
              '''\t\ttorsoBaseC0 = readMotorBaseC0(torsoMotor),
          \t\tleftArmBaseC0 = readMotorBaseC0(leftArmMotor),
          \t\trightArmBaseC0 = readMotorBaseC0(rightArmMotor),
          \t\tleftLegBaseC0 = readMotorBaseC0(leftLegMotor),
          \t\trightLegBaseC0 = readMotorBaseC0(rightLegMotor),''',
          )
          replace_once(
              controller,
              '''\t\tphaseOffsetSeconds = stablePhaseOffset(model),
          \t\tposeId = "",
          \t}''',
              '''\t\tphaseOffsetSeconds = stablePhaseOffset(model),
          \t\tposeId = "",
          \t\troleId = roleId,
          \t}''',
          )
          replace_once(
              controller,
              '''\trecord.sensor.Color = SENSOR_COLORS.Normal
          \trecord.sensor.Transparency = SENSOR_TRANSPARENCY.Normal''',
              '''\trecord.sensor.Color = colorFromTuple(roleProfile(record.roleId).Colors.Sensor)
          \trecord.sensor.Transparency = SENSOR_TRANSPARENCY.Normal''',
          )
          replace_once(
              controller,
              '''local function applyPose(record: Record, pose: EnemyPresentationPoseResolver.Pose)
          \trecord.torsoMotor.C0 = record.torsoBaseC0
          \t\t* CFrame.Angles(math.rad(pose.torsoPitchDegrees), 0, math.rad(pose.torsoRollDegrees))
          \trecord.leftArmMotor.C0 = record.leftArmBaseC0
          \t\t* CFrame.Angles(math.rad(pose.leftArmPitchDegrees), 0, math.rad(pose.leftArmRollDegrees))
          \trecord.rightArmMotor.C0 = record.rightArmBaseC0
          \t\t* CFrame.Angles(math.rad(pose.rightArmPitchDegrees), 0, math.rad(pose.rightArmRollDegrees))
          \trecord.leftLegMotor.C0 = record.leftLegBaseC0 * CFrame.Angles(math.rad(pose.leftLegPitchDegrees), 0, 0)
          \trecord.rightLegMotor.C0 = record.rightLegBaseC0 * CFrame.Angles(math.rad(pose.rightLegPitchDegrees), 0, 0)

          \tlocal color = SENSOR_COLORS[pose.sensorMode]
          \tlocal transparency = SENSOR_TRANSPARENCY[pose.sensorMode]
          \tif color ~= nil and transparency ~= nil then
          \t\trecord.sensor.Color = color
          \t\trecord.sensor.Transparency = transparency
          \tend
          \trecord.poseId = pose.id
          end''',
              '''local function applyPose(record: Record, pose: EnemyPresentationPoseResolver.Pose)
          \tlocal profile = roleProfile(record.roleId)
          \tlocal posture = profile.Posture
          \trecord.torsoMotor.C0 = record.torsoBaseC0
          \t\t* CFrame.new(0, posture.TorsoHeightStuds, 0)
          \t\t* CFrame.Angles(
          \t\t\tmath.rad(posture.TorsoPitchDegrees + pose.torsoPitchDegrees),
          \t\t\t0,
          \t\t\tmath.rad(posture.TorsoRollDegrees + pose.torsoRollDegrees)
          \t\t)
          \trecord.leftArmMotor.C0 = record.leftArmBaseC0
          \t\t* CFrame.Angles(
          \t\t\tmath.rad(posture.LeftArmPitchDegrees + pose.leftArmPitchDegrees),
          \t\t\t0,
          \t\t\tmath.rad(posture.LeftArmRollDegrees + pose.leftArmRollDegrees)
          \t\t)
          \trecord.rightArmMotor.C0 = record.rightArmBaseC0
          \t\t* CFrame.Angles(
          \t\t\tmath.rad(posture.RightArmPitchDegrees + pose.rightArmPitchDegrees),
          \t\t\t0,
          \t\t\tmath.rad(posture.RightArmRollDegrees + pose.rightArmRollDegrees)
          \t\t)
          \trecord.leftLegMotor.C0 = record.leftLegBaseC0
          \t\t* CFrame.Angles(math.rad(posture.LeftLegPitchDegrees + pose.leftLegPitchDegrees), 0, 0)
          \trecord.rightLegMotor.C0 = record.rightLegBaseC0
          \t\t* CFrame.Angles(math.rad(posture.RightLegPitchDegrees + pose.rightLegPitchDegrees), 0, 0)

          \tlocal color = SENSOR_COLORS[pose.sensorMode]
          \tif pose.sensorMode == "Normal" or pose.sensorMode == "Alert" then
          \t\tlocal roleColor = colorFromTuple(profile.Colors.Sensor)
          \t\tcolor = if pose.sensorMode == "Alert" then roleColor:Lerp(SENSOR_COLORS.Alert, 0.45) else roleColor
          \tend
          \tlocal transparency = SENSOR_TRANSPARENCY[pose.sensorMode]
          \tif color ~= nil and transparency ~= nil then
          \t\trecord.sensor.Color = color
          \t\trecord.sensor.Transparency = transparency
          \tend
          \trecord.poseId = pose.id
          end''',
          )
          replace_once(
              controller,
              '''local function updateRecord(model: Model, record: Record, serverTimestamp: number)
          \tlocal windupSequence''',
              '''local function updateRecord(model: Model, record: Record, serverTimestamp: number)
          \tlocal disclosedRoleId = readStringAttribute(model, "HordeRoleId")
          \tif disclosedRoleId ~= nil and disclosedRoleId ~= record.roleId and HordeRolePresentationConfig.get(disclosedRoleId) ~= nil then
          \t\trecord.roleId = disclosedRoleId
          \t\trecord.poseId = ""
          \tend
          \tlocal windupSequence''',
          )
          replace_once(
              controller,
              '''\tlocal strideScaleValue = model:GetAttribute("HordeRoleStrideScale")
          \tlocal strideScale = if type(strideScaleValue) == "number"
          \t\t\tand strideScaleValue == strideScaleValue
          \t\t\tand strideScaleValue >= 0.5
          \t\t\tand strideScaleValue <= 2
          \t\tthen strideScaleValue
          \t\telse 1
          \tlocal strideIndex = math.floor((serverTimestamp + record.phaseOffsetSeconds) * STRIDES_PER_SECOND * strideScale) % 2''',
              '''\tlocal profile = roleProfile(record.roleId)
          \tlocal strideIndex =
          \t\tmath.floor((serverTimestamp + record.phaseOffsetSeconds) * profile.StridesPerSecond) % 2''',
          )

          spec = "docs/specifications/horde-role-readability.md"
          replace_once(
              spec,
              '`EnemyPresentationController` keeps its existing single frame loop and reads only a bounded `HordeRoleStrideScale` attribute before composing its existing behavior poses from the role-adjusted motor bases.',
              '`EnemyPresentationController` keeps its existing single frame loop, reads the server-authored role ID, and composes the shared role posture, normal eye color, and stride timing with its existing behavior poses from replicated canonical motor bases.',
          )
          replace_once(
              spec,
              '- the client accepts only a 0.5–2.0 stride scalar.',
              '- canonical motor bases are authored before the shell is parented, preventing a replication-order posture race.',
          )
          PY

      - name: Format focused Luau
        run: |
          stylua \
            games/living-kingdoms/src/server/Systems/HordeRolePresentationService.luau \
            games/living-kingdoms/src/server/Systems/EnemyPresentationService.luau \
            games/living-kingdoms/src/client/Controllers/EnemyPresentationController.luau \
            games/living-kingdoms/tests/HordeRolePresentationSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0
          echo "Executed $fixture_count fixtures."

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/horde-role-readability-replication-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden horde role presentation replication"
          git push origin HEAD:feat/horde-role-readability-v1

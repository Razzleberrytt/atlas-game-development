name: HROI squad run-upgrade integration builder

on:
  push:
    branches:
      - feat/hroi-run-upgrade-choices
    paths:
      - "tools/hroi_run_upgrade_patch.py"
      - ".github/workflows/hroi-run-upgrade-builder.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/hroi-run-upgrade-choices

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply exact integration patch
        run: python3 tools/hroi_run_upgrade_patch.py

      - name: Format Luau
        run: stylua games/living-kingdoms/src games/living-kingdoms/tests

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            echo "::group::Lune fixture: $fixture"
            lune run "$fixture"
            echo "::endgroup::"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0
          echo "Executed $fixture_count Living Kingdoms fixtures."

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated integration and remove builder
        shell: bash
        run: |
          set -euo pipefail
          rm tools/hroi_run_upgrade_patch.py .github/workflows/hroi-run-upgrade-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate squad run-upgrade choices"
          git push origin HEAD:feat/hroi-run-upgrade-choices

name: Cleanup merged branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-merged-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-22.04
    steps:
      - name: Delete merged same-repository branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          echo "Deleting merged branch: $HEAD_REF"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" || {
            echo "Branch was already deleted or cannot be removed; merge remains valid."
            exit 0
          }

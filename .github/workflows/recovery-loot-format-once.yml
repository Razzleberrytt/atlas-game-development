name: Format recovery loot once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/enemy-recovery-loot-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/enemy-recovery-loot-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Format, clean up, and commit
        shell: bash
        run: |
          set -euo pipefail
          stylua games/living-kingdoms/src
          rm .github/workflows/recovery-loot-format-once.yml
          if git diff --quiet; then
            echo "Formatter made no source changes." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply pinned StyLua formatting"
          git push origin HEAD:feat/enemy-recovery-loot-v1

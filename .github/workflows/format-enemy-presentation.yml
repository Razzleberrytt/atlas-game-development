name: Format enemy presentation source

on:
  push:
    branches:
      - fix/stylua-enemy-presentation-20260814

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/stylua-enemy-presentation-20260814
      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
      - name: Format enemy presentation Luau
        run: stylua games/living-kingdoms/src/server/Systems/EnemyArchetypePresentationService.luau
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/src/server/Systems/EnemyArchetypePresentationService.luau
          git commit -m "style: format enemy archetype presentation"
          git push origin HEAD:fix/stylua-enemy-presentation-20260814

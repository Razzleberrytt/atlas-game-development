name: VIS-0102 shot effects fixture diagnostic

on:
  push:
    branches:
      - "agent/vis-0102-authoritative-shot-effects"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/vis-0102-authoritative-shot-effects

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Capture fixture output
        run: |
          mkdir -p .diagnostics
          : > .diagnostics/vis-0102-shot-effects-lune.txt
          while IFS= read -r -d '' fixture; do
            echo "=== $fixture ===" >> .diagnostics/vis-0102-shot-effects-lune.txt
            lune run "$fixture" >> .diagnostics/vis-0102-shot-effects-lune.txt 2>&1 || true
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)

      - name: Commit diagnostic
        run: |
          if [ -z "$(git status --porcelain -- .diagnostics/vis-0102-shot-effects-lune.txt)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/vis-0102-shot-effects-lune.txt
          git commit -m "Capture shot effects fixture diagnostic"
          git push

name: VIS-0102 shot effects fixture diagnostic

on:
  push:
    branches:
      - "agent/vis-0102-authoritative-shot-effects"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/vis-0102-authoritative-shot-effects

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Narrow accepted-shot broadcast audit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("games/living-kingdoms/tests/OperativeCombatRuntimeService.test.luau")
          source = path.read_text()
          before = '''for _, prohibited in { "FireAllClients", "RemoteFunction", "InvokeClient", "math.random" } do
          \tassert(not string.find(source, prohibited, 1, true), "combat runtime must stay narrow: " .. prohibited)
          end
          '''
          after = '''for _, prohibited in { "RemoteFunction", "InvokeClient", "math.random" } do
          \tassert(not string.find(source, prohibited, 1, true), "combat runtime must stay narrow: " .. prohibited)
          end
          local _, broadcastCount = string.gsub(source, "presentationRemote:FireAllClients", "")
          assert(broadcastCount == 1, "only accepted shot presentation may broadcast to the squad")
          assert(
          \tstring.find(
          \t\tsource,
          \t\t"presentationRemote:FireAllClients({\\n\\t\\tkindId = CombatContracts.PresentationMessageKindIds.ShotFired",
          \t\t1,
          \t\ttrue
          \t) ~= nil,
          \t"the one broadcast must remain the accepted ShotFired disclosure"
          )
          '''
          if source.count(before) != 1:
              raise SystemExit("legacy FireAllClients prohibition not found")
          path.write_text(source.replace(before, after, 1))
          PY
          stylua games/living-kingdoms/tests/OperativeCombatRuntimeService.test.luau

      - name: Capture fixture output
        run: |
          mkdir -p .diagnostics
          : > .diagnostics/vis-0102-shot-effects-lune.txt
          while IFS= read -r -d '' fixture; do
            echo "=== $fixture ===" >> .diagnostics/vis-0102-shot-effects-lune.txt
            lune run "$fixture" >> .diagnostics/vis-0102-shot-effects-lune.txt 2>&1 || true
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)

      - name: Commit fixture audit and diagnostic
        run: |
          if [ -z "$(git status --porcelain -- games/living-kingdoms/tests/OperativeCombatRuntimeService.test.luau .diagnostics/vis-0102-shot-effects-lune.txt)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/tests/OperativeCombatRuntimeService.test.luau .diagnostics/vis-0102-shot-effects-lune.txt
          git commit -m "Narrow accepted shot broadcast audit"
          git push

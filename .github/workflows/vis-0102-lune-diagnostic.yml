name: VIS-0102 shot effects fixture diagnostic

on:
  push:
    branches:
      - "agent/vis-0102-authoritative-shot-effects"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/vis-0102-authoritative-shot-effects

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Update broadcast shot fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_test = Path("games/living-kingdoms/tests/OperativeCombatRuntimeService.test.luau")
          source = runtime_test.read_text()
          before = '''local presentationRemote = {
          \tFireClient = function(_, player, payload)
          \t\ttable.insert(presentationMessages, { player = player, payload = payload })
          \tend,
          }
          '''
          after = '''local presentationRemote = {
          \tFireClient = function(_, player, payload)
          \t\ttable.insert(presentationMessages, { player = player, payload = payload })
          \tend,
          \tFireAllClients = function(_, payload)
          \t\ttable.insert(presentationMessages, { player = "all", payload = payload })
          \tend,
          }
          '''
          if source.count(before) != 1:
              raise SystemExit("runtime presentation remote mock not found")
          runtime_test.write_text(source.replace(before, after, 1))

          controller_test = Path("games/living-kingdoms/tests/WeaponController.test.luau")
          source = controller_test.read_text()
          before = '''local localPlayer = {
          \tWaitForChild = function(_self: unknown, name: string)
          '''
          after = '''local localPlayer = {
          \tUserId = 42,
          \tWaitForChild = function(_self: unknown, name: string)
          '''
          if source.count(before) != 1:
              raise SystemExit("local player fixture not found")
          source = source.replace(before, after, 1)
          source = source.replace('operativeEntityId = "operative.local"', 'operativeEntityId = "operative.player:42"')
          marker = '''presentationEvent:Fire(authoritativePayload)
          local shotWrites = 0
          '''
          replacement = '''presentationEvent:Fire({
          \tkindId = "ShotFired",
          \tshotId = "shot.server.remote",
          \toperativeEntityId = "operative.player:99",
          \tweaponId = "weapon.basic_firearm",
          \ttargetEntityId = "hostile.disclosed",
          \tserverTimestamp = 10.45,
          })
          presentationEvent:Fire(authoritativePayload)
          local shotWrites = 0
          '''
          if source.count(marker) != 1:
              raise SystemExit("weapon HUD shot fixture marker not found")
          controller_test.write_text(source.replace(marker, replacement, 1))
          PY
          stylua \
            games/living-kingdoms/tests/OperativeCombatRuntimeService.test.luau \
            games/living-kingdoms/tests/WeaponController.test.luau

      - name: Capture fixture output
        run: |
          mkdir -p .diagnostics
          : > .diagnostics/vis-0102-shot-effects-lune.txt
          while IFS= read -r -d '' fixture; do
            echo "=== $fixture ===" >> .diagnostics/vis-0102-shot-effects-lune.txt
            lune run "$fixture" >> .diagnostics/vis-0102-shot-effects-lune.txt 2>&1 || true
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)

      - name: Commit fixture fixes and diagnostic
        run: |
          if [ -z "$(git status --porcelain -- games/living-kingdoms/tests .diagnostics/vis-0102-shot-effects-lune.txt)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/tests/OperativeCombatRuntimeService.test.luau games/living-kingdoms/tests/WeaponController.test.luau .diagnostics/vis-0102-shot-effects-lune.txt
          git commit -m "Update broadcast shot presentation fixtures"
          git push

name: Temporary Stylua autofix

on:
  push:
    branches:
      - roadmap/ability-haste-live

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply canonical Stylua formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          stylua games/living-kingdoms/src games/living-kingdoms/tests games/living-kingdoms/tools
          rm .github/workflows/temporary-stylua-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(lk): apply canonical Stylua formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"

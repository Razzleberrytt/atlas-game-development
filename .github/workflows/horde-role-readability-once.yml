name: Finalize horde role readability once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/horde-role-readability-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/horde-role-readability-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Wire bounded role presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              file_path.write_text(source.replace(old, new, 1))

          horde = "games/living-kingdoms/src/server/Systems/HordeExperienceService.luau"
          replace_once(
              horde,
              "local EnemyDirectorService = require(script.Parent.EnemyDirectorService)\nlocal OperativeLifeService",
              "local EnemyDirectorService = require(script.Parent.EnemyDirectorService)\nlocal HordeRolePresentationService = require(script.Parent.HordeRolePresentationService)\nlocal OperativeLifeService",
          )
          replace_once(
              horde,
              '\trecord.model:SetAttribute("HordeThreatValue", role.Threat)\n\tlocal highlight',
              '\trecord.model:SetAttribute("HordeThreatValue", role.Threat)\n\tHordeRolePresentationService.applyRolePresentation(record.model)\n\tlocal highlight',
          )
          replace_once(
              horde,
              '''\tif role.Id == HordeConfig.Roles.Brute.Id then
          \t\tpcall(function()
          \t\t\trecord.model:ScaleTo(1.35)
          \t\tend)
          \telseif role.Id == HordeConfig.Roles.Crawler.Id then
          \t\tpcall(function()
          \t\t\trecord.model:ScaleTo(0.72)
          \t\tend)
          \telseif role.Id == HordeConfig.Roles.Runner.Id then
          \t\tpcall(function()
          \t\t\trecord.model:ScaleTo(0.9)
          \t\tend)
          \tend
          ''',
              "",
          )

          presenter = "games/living-kingdoms/src/server/Systems/EnemyPresentationService.luau"
          replace_once(
              presenter,
              "local EnemyConfig = require(ReplicatedStorage.Shared.Config.EnemyConfig)\nlocal VisualAssetContracts",
              "local EnemyConfig = require(ReplicatedStorage.Shared.Config.EnemyConfig)\nlocal HordeRolePresentationService = require(script.Parent.HordeRolePresentationService)\nlocal VisualAssetContracts",
          )
          replace_once(
              presenter,
              '''\tlocal presentation = createPresentation(root)
          \tpresentation.Parent = enemyModel
          end''',
              '''\tlocal presentation = createPresentation(root)
          \tpresentation.Parent = enemyModel
          \tHordeRolePresentationService.applyRolePresentation(enemyModel)
          end''',
          )

          controller = "games/living-kingdoms/src/client/Controllers/EnemyPresentationController.luau"
          replace_once(
              controller,
              '''\tlocal strideIndex = math.floor((serverTimestamp + record.phaseOffsetSeconds) * STRIDES_PER_SECOND) % 2''',
              '''\tlocal strideScaleValue = model:GetAttribute("HordeRoleStrideScale")
          \tlocal strideScale = if type(strideScaleValue) == "number"
          \t\tand strideScaleValue == strideScaleValue
          \t\tand strideScaleValue >= 0.5
          \t\tand strideScaleValue <= 2
          \t\tthen strideScaleValue
          \t\telse 1
          \tlocal strideIndex =
          \t\tmath.floor((serverTimestamp + record.phaseOffsetSeconds) * STRIDES_PER_SECOND * strideScale) % 2''',
          )

          spec = "docs/specifications/horde-role-readability.md"
          replace_once(
              spec,
              '`HordeRolePresentationConfig` contains presentation-only component proportions, RGB tuples, eye-light bounds, stride timing, and pose offsets. `EnemyPresentationService` applies those values only to massless, non-colliding, non-queryable parts inside `ExclusionWalkerPresentation`. `EnemyPresentationController` reads the server-authored `HordeRoleId` attribute through its existing single frame loop and composes role posture with the existing behavior pose.',
              '`HordeRolePresentationConfig` contains presentation-only component proportions, RGB tuples, eye-light bounds, stride timing, and base-pose offsets. The stateless `HordeRolePresentationService` applies those values only to massless, non-colliding, non-queryable parts and the five presentation motors inside `ExclusionWalkerPresentation`. Both `EnemyPresentationService` and `HordeExperienceService` invoke the same applicator so the correct role is resolved whether the shell or server-authored role arrives first. `EnemyPresentationController` keeps its existing single frame loop and reads only a bounded `HordeRoleStrideScale` attribute before composing its existing behavior poses from the role-adjusted motor bases.',
          )
          replace_once(
              spec,
              '- one existing client `RenderStepped` connection;\n- zero per-enemy attribute or property connections;',
              '- one existing client `RenderStepped` connection;\n- a stateless role applicator with zero connections;\n- zero per-enemy attribute or property connections;',
          )
          replace_once(
              spec,
              '- role posture stays within one stud of the authoritative root.',
              '- role posture stays within one stud of the authoritative root;\n- the client accepts only a 0.5–2.0 stride scalar.',
          )
          PY

      - name: Format focused Luau
        run: |
          stylua \
            games/living-kingdoms/src/shared/Config/HordeRolePresentationConfig.luau \
            games/living-kingdoms/src/server/Systems/HordeRolePresentationService.luau \
            games/living-kingdoms/src/server/Systems/HordeExperienceService.luau \
            games/living-kingdoms/src/server/Systems/EnemyPresentationService.luau \
            games/living-kingdoms/src/client/Controllers/EnemyPresentationController.luau \
            games/living-kingdoms/tests/HordeRolePresentationConfig.test.luau \
            games/living-kingdoms/tests/HordeRolePresentationSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0
          echo "Executed $fixture_count fixtures."

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/horde-role-readability-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make all six horde roles visually readable"
          git push origin HEAD:feat/horde-role-readability-v1

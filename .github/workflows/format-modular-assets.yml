name: Format modular asset sources

on:
  push:
    branches:
      - feature/modular-asset-systems-20260814

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/modular-asset-systems-20260814
      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
      - name: Format modular asset Luau
        run: |
          stylua games/living-kingdoms/src/shared/Config/ModularAssetProductionCatalog.luau
          stylua games/living-kingdoms/src/shared/Assets/ModularAssetFactory.luau
          stylua games/living-kingdoms/src/shared/Assets/ModularAssetResolver.luau
          stylua games/living-kingdoms/src/server/ModularAssetBootstrap.server.luau
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/src/shared/Config/ModularAssetProductionCatalog.luau
          git add games/living-kingdoms/src/shared/Assets/ModularAssetFactory.luau
          git add games/living-kingdoms/src/shared/Assets/ModularAssetResolver.luau
          git add games/living-kingdoms/src/server/ModularAssetBootstrap.server.luau
          git commit -m "style: format modular asset sources"
          git push origin HEAD:feature/modular-asset-systems-20260814

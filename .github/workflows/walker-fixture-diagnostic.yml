name: Walker fixture diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  pose-resolver:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}
      - run: lune run games/living-kingdoms/tests/EnemyPresentationPoseResolver.test.luau

  state-source-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}
      - run: lune run games/living-kingdoms/tests/ExclusionWalkerStateReadabilitySourceAudit.test.luau

  existing-walker-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}
      - run: lune run games/living-kingdoms/tests/ExclusionWalkerPresentationSourceAudit.test.luau

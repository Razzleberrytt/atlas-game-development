name: Walker fixture synchronization

on:
  pull_request:

permissions:
  contents: write

jobs:
  synchronize-p5-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Tighten P5 client authority audit
        shell: python
        run: |
          from pathlib import Path

          path = Path("games/living-kingdoms/tests/P5IntegrationValidation.test.luau")
          source = path.read_text()
          old = '''local clientBootstrap = fs.readFile("games/living-kingdoms/src/client/init.client.luau")
          assert(not string.find(clientBootstrap, "Enemy", 1, true), "clients must not bootstrap enemy authority")'''
          new = '''local clientBootstrap = fs.readFile("games/living-kingdoms/src/client/init.client.luau")
          assert(
          \tstring.find(clientBootstrap, "EnemyPresentationController.start()", 1, true) ~= nil,
          \t"clients may bootstrap bounded enemy presentation"
          )
          for _, prohibitedClientAuthority in
          \t{ "EnemyDirectorService", "EnemyBehaviorResolver", "EnemyCombatRuntime", "EnemyNetwork" }
          do
          \tassert(
          \t\tnot string.find(clientBootstrap, prohibitedClientAuthority, 1, true),
          \t\t"client bootstrap gained enemy authority: " .. prohibitedClientAuthority
          \t)
          end'''
          if old in source:
              path.write_text(source.replace(old, new))
          elif new not in source:
              raise SystemExit("expected P5 client authority assertion was not found")
      - name: Commit synchronized fixture
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "P5 audit already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/tests/P5IntegrationValidation.test.luau
          git commit -m "test(living-kingdoms): distinguish enemy presentation from authority"
          git push origin HEAD:${{ github.head_ref }}

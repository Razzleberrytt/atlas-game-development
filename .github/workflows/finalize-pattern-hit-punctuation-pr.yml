name: Finalize pattern punctuation PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/pattern-hit-punctuation-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pattern-hit-punctuation-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Extract and apply committed patch script
        shell: bash
        run: |
          python3 - <<'EXTRACT'
          from pathlib import Path

          workflow_lines = Path('.github/workflows/finalize-pattern-hit-punctuation-once.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(workflow_lines) if line.strip() == 'from pathlib import Path')
          end = next(index for index in range(start + 1, len(workflow_lines)) if workflow_lines[index].strip() == 'PY')
          code_lines = [line[10:] if line.startswith('          ') else line for line in workflow_lines[start:end]]
          Path('/tmp/apply-pattern-punctuation.py').write_text('\n'.join(code_lines) + '\n')
          EXTRACT
          python3 /tmp/apply-pattern-punctuation.py

      - name: Format focused Luau
        run: |
          stylua \
            games/living-kingdoms/src/client/Controllers/ConfirmedHitMarkerController.luau \
            games/living-kingdoms/src/shared/Config/ConfirmedHitMarkerConfig.luau \
            games/living-kingdoms/tests/ConfirmedHitMarkerSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          while IFS= read -r -d '' fixture; do
            echo "=== $fixture ==="
            lune run "$fixture"
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json -o /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          rm .github/workflows/finalize-pattern-hit-punctuation-once.yml
          rm .github/workflows/finalize-pattern-hit-punctuation-pr.yml
          rm docs/pattern-punctuation-trigger.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/roadmap/RECOMMENDED-PASSES.md \
            docs/specifications/authoritative-pattern-hit-punctuation.md \
            games/living-kingdoms/src/client/Controllers/ConfirmedHitMarkerController.luau \
            games/living-kingdoms/src/shared/Config/ConfirmedHitMarkerConfig.luau \
            games/living-kingdoms/tests/ConfirmedHitMarkerSourceAudit.test.luau \
            .github/workflows/finalize-pattern-hit-punctuation-once.yml \
            .github/workflows/finalize-pattern-hit-punctuation-pr.yml \
            docs/pattern-punctuation-trigger.md
          git commit -m "Make authoritative weapon patterns hit unmistakably"
          git push origin HEAD:feat/pattern-hit-punctuation-v1

name: Lint-clean horde special telegraph validation once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/horde-special-telegraphs-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/horde-special-telegraphs-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply lint-clean integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/final-horde-special-telegraphs-v3.yml').read_text()
          marker = '      - name: Apply deterministic integration\n'
          section = source.split(marker, 1)[1].split('\n\n      - name: Format focused Luau', 1)[0]
          script = section.split('        run: |\n', 1)[1]
          Path('/tmp/replay.sh').write_text(textwrap.dedent(script))
          PY
          bash /tmp/replay.sh
          python3 - <<'PY'
          from pathlib import Path

          path = Path('games/living-kingdoms/src/client/Controllers/HordeSpecialTelegraphController.luau')
          source = path.read_text()
          for token in (
              'local enemyFolder: Folder? = nil\n',
              '\tenemyFolder = found\n',
              '\tenemyFolder = nil\n',
          ):
              if source.count(token) != 1:
                  raise RuntimeError(f'expected one unused enemy-folder token: {token!r}')
              source = source.replace(token, '', 1)
          path.write_text(source)
          PY

      - name: Format focused Luau
        run: |
          stylua \
            games/living-kingdoms/src/server/Systems/HordeExperienceService.luau \
            games/living-kingdoms/src/client/Controllers/HordeSpecialTelegraphController.luau \
            games/living-kingdoms/src/client/Controllers/EnemyAudioController.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/src/shared/Config/HordeSpecialTelegraphConfig.luau \
            games/living-kingdoms/src/shared/Config/EnemyAudioConfig.luau \
            games/living-kingdoms/tests/HordeSpecialTelegraphConfig.test.luau \
            games/living-kingdoms/tests/HordeSpecialTelegraphSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0
          echo "Executed $fixture_count fixtures."

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/horde-special-telegraphs-once.yml \
            .github/workflows/diagnose-horde-special-telegraphs-once.yml \
            .github/workflows/finalize-horde-special-telegraphs-v2.yml \
            .github/workflows/final-horde-special-telegraphs-v3.yml \
            .github/workflows/final-horde-special-telegraphs-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make horde special attacks readable before they commit"
          git push origin HEAD:feat/horde-special-telegraphs-v1

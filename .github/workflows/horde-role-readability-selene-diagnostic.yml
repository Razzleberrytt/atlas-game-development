name: Diagnose horde role Selene once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feat/horde-role-readability-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/horde-role-readability-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Reproduce hardened source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/horde-role-readability-replication-once.yml').read_text()
          marker = '      - name: Harden replication-safe role composition\n'
          section = source.split(marker, 1)[1].split('\n\n      - name: Format focused Luau', 1)[0]
          script = section.split('        run: |\n', 1)[1]
          Path('/tmp/reproduce.sh').write_text(textwrap.dedent(script))
          PY
          bash /tmp/reproduce.sh
          stylua \
            games/living-kingdoms/src/server/Systems/HordeRolePresentationService.luau \
            games/living-kingdoms/src/server/Systems/EnemyPresentationService.luau \
            games/living-kingdoms/src/client/Controllers/EnemyPresentationController.luau \
            games/living-kingdoms/tests/HordeRolePresentationSourceAudit.test.luau

      - name: Capture Selene output
        id: selene
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          selene games/living-kingdoms/src 2>&1 | tee /tmp/horde-role-selene.log

      - name: Upload Selene diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horde-role-selene-log
          path: /tmp/horde-role-selene.log
          retention-days: 1

      - name: Enforce diagnostic result
        if: steps.selene.outcome == 'failure'
        run: exit 1

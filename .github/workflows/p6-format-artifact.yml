name: P6 formatting artifact

on:
  pull_request:
    paths:
      - "games/living-kingdoms/src/**"
      - ".github/workflows/p6-format-artifact.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Format source
        shell: bash
        run: stylua games/living-kingdoms/src

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- games/living-kingdoms/src; then
            echo "Source is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/src
          git commit -m "Format P6 scarcity telemetry"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

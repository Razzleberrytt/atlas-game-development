name: Finalize weapon-aware targeting once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/weapon-aware-auto-targeting-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/weapon-aware-auto-targeting-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Wire weapon-aware targeting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              file_path.write_text(source.replace(old, new, 1))

          contracts = "games/living-kingdoms/src/shared/Combat/CombatContracts.luau"
          replace_once(
              contracts,
              'export type TargetSelectionReasonId = "ThreateningClosest" | "ValidClosest"',
              '''export type TargetSelectionReasonId =
          \t"ThreateningClosest" | "ValidClosest" | "ThreateningPatternUtility" | "ValidPatternUtility"''',
          )
          replace_once(
              contracts,
              '''CombatContracts.TargetSelectionReasonIds = table.freeze({
          \tThreateningClosest = "ThreateningClosest",
          \tValidClosest = "ValidClosest",
          })''',
              '''CombatContracts.TargetSelectionReasonIds = table.freeze({
          \tThreateningClosest = "ThreateningClosest",
          \tValidClosest = "ValidClosest",
          \tThreateningPatternUtility = "ThreateningPatternUtility",
          \tValidPatternUtility = "ValidPatternUtility",
          })''',
          )

          runtime = "games/living-kingdoms/src/server/Systems/OperativeCombatRuntimeService.luau"
          replace_once(
              runtime,
              'pipeline — TargetCandidateSelector, AutomaticFireResolver,',
              'pipeline — WeaponTargetSelector, AutomaticFireResolver,',
          )
          replace_once(
              runtime,
              'local TargetCandidateSelector = require(script.Parent.TargetCandidateSelector)',
              'local WeaponTargetSelector = require(script.Parent.WeaponTargetSelector)',
          )
          replace_once(
              runtime,
              'local selectedTarget = TargetCandidateSelector.select(targetingState, candidates)',
              'local selectedTarget = WeaponTargetSelector.select(targetingState, candidates)',
          )

          test_path = "games/living-kingdoms/tests/WeaponTargetSelector.test.luau"
          replace_once(
              test_path,
              '''invalidPatternPrimary[2].hasLineOfSight = false
          assertSelected(''',
              '''invalidPatternPrimary[2].hasLineOfSight = false
          invalidPatternPrimary[3].hasLineOfSight = false
          invalidPatternPrimary[4].hasLineOfSight = false
          assertSelected(''',
          )
          PY

      - name: Format focused Luau
        run: |
          stylua \
            games/living-kingdoms/src/shared/Combat/CombatContracts.luau \
            games/living-kingdoms/src/server/Systems/OperativeCombatRuntimeService.luau \
            games/living-kingdoms/src/server/Systems/WeaponTargetSelector.luau \
            games/living-kingdoms/tests/WeaponTargetSelector.test.luau \
            games/living-kingdoms/tests/WeaponTargetSelectorSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0
          echo "Executed $fixture_count fixtures."

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/weapon-aware-targeting-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make automatic targeting exploit weapon patterns"
          git push origin HEAD:feat/weapon-aware-auto-targeting-v1

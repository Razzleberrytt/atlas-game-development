name: Finalize horde special telegraphs once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/horde-special-telegraphs-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/horde-special-telegraphs-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Wire authoritative special telegraphs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              file_path.write_text(source.replace(old, new, 1))

          server = "games/living-kingdoms/src/server/Systems/HordeExperienceService.luau"
          replace_once(
              server,
              '''local HordeConfig = require(ReplicatedStorage.Shared.Config.HordeExperienceConfig)
          local WorldFoundationConfig = require(ReplicatedStorage.Shared.Config.WorldFoundationConfig)''',
              '''local HordeConfig = require(ReplicatedStorage.Shared.Config.HordeExperienceConfig)
          local HordeSpecialTelegraphConfig = require(ReplicatedStorage.Shared.Config.HordeSpecialTelegraphConfig)
          local WorldFoundationConfig = require(ReplicatedStorage.Shared.Config.WorldFoundationConfig)''',
          )
          replace_once(
              server,
              '''local EnemyLifeStateIds = EnemyPresentationContracts.LifeStateIds
          local SpawnSourceIds = EnemyContracts.EnemySpawnSourceIds''',
              '''local EnemyLifeStateIds = EnemyPresentationContracts.LifeStateIds
          local SpawnSourceIds = EnemyContracts.EnemySpawnSourceIds
          local SpecialAttributeNames = HordeSpecialTelegraphConfig.AttributeNames
          local SpecialKindIds = HordeSpecialTelegraphConfig.KindIds
          local SpecialStateIds = HordeSpecialTelegraphConfig.StateIds''',
          )
          replace_once(
              server,
              '''	nextSpecialServerTimestamp: number,
          	deathHandled: boolean,''',
              '''	nextSpecialServerTimestamp: number,
          	specialSequence: number,
          	pendingSpecialKindId: string?,
          	pendingSpecialCommitServerTimestamp: number?,
          	deathHandled: boolean,''',
          )
          replace_once(
              server,
              '''	record.model:SetAttribute("HordeThreatValue", role.Threat)
          	HordeRolePresentationService.applyRolePresentation(record.model)''',
              '''	record.model:SetAttribute("HordeThreatValue", role.Threat)
          	record.model:SetAttribute(SpecialAttributeNames.KindId, nil)
          	record.model:SetAttribute(SpecialAttributeNames.Sequence, 0)
          	record.model:SetAttribute(SpecialAttributeNames.StateId, SpecialStateIds.Idle)
          	record.model:SetAttribute(SpecialAttributeNames.CommitServerTimestamp, 0)
          	HordeRolePresentationService.applyRolePresentation(record.model)''',
          )
          replace_once(
              server,
              '''		nextSpecialServerTimestamp = now() + (role.SpecialIntervalSeconds or math.huge),
          		deathHandled = false,''',
              '''		nextSpecialServerTimestamp = now() + (role.SpecialIntervalSeconds or math.huge),
          		specialSequence = 0,
          		pendingSpecialKindId = nil,
          		pendingSpecialCommitServerTimestamp = nil,
          		deathHandled = false,''',
          )

          begin_helpers = '''local function beginSpecialTelegraph(record: EnemyRecord, kindId: string, serverTimestamp: number): boolean
          	if record.pendingSpecialKindId ~= nil then
          		return false
          	end
          	local definition = HordeSpecialTelegraphConfig.get(kindId)
          	if definition == nil then
          		return false
          	end
          	record.specialSequence += 1
          	record.pendingSpecialKindId = kindId
          	record.pendingSpecialCommitServerTimestamp = serverTimestamp + definition.WindupSeconds
          	record.model:SetAttribute(SpecialAttributeNames.KindId, kindId)
          	record.model:SetAttribute(
          		SpecialAttributeNames.CommitServerTimestamp,
          		record.pendingSpecialCommitServerTimestamp
          	)
          	record.model:SetAttribute(SpecialAttributeNames.StateId, SpecialStateIds.Windup)
          	record.model:SetAttribute(SpecialAttributeNames.Sequence, record.specialSequence)
          	return true
          end

          local function cancelPendingSpecial(record: EnemyRecord)
          	record.pendingSpecialKindId = nil
          	record.pendingSpecialCommitServerTimestamp = nil
          	record.model:SetAttribute(SpecialAttributeNames.KindId, nil)
          	record.model:SetAttribute(SpecialAttributeNames.CommitServerTimestamp, 0)
          	record.model:SetAttribute(SpecialAttributeNames.StateId, SpecialStateIds.Idle)
          end

          '''
          replace_once(server, 'local function damagePlayersInBurst', begin_helpers + 'local function damagePlayersInBurst')

          commit_helper = '''local function commitPendingSpecial(record: EnemyRecord, role, serverTimestamp: number): boolean
          	local kindId = record.pendingSpecialKindId
          	local commitServerTimestamp = record.pendingSpecialCommitServerTimestamp
          	if kindId == nil or commitServerTimestamp == nil or serverTimestamp < commitServerTimestamp then
          		return false
          	end
          	record.pendingSpecialKindId = nil
          	record.pendingSpecialCommitServerTimestamp = nil
          	record.model:SetAttribute(SpecialAttributeNames.StateId, SpecialStateIds.Committed)

          	if kindId == SpecialKindIds.ScreamerReinforcement then
          		if record.lifeStateId == EnemyLifeStateIds.Dead then
          			return false
          		end
          		record.model:SetAttribute("HordeScreamSequence", serverTimestamp)
          		spawnReinforcements(record.root.Position, role.ReinforcementCount, "scream")
          		record.nextSpecialServerTimestamp = serverTimestamp + role.SpecialIntervalSeconds
          	elseif kindId == SpecialKindIds.BloaterDeathBurst then
          		damagePlayersInBurst(record, role, serverTimestamp)
          		record.model:SetAttribute("HordeDeathBurstSequence", serverTimestamp)
          	elseif kindId == SpecialKindIds.BruteSecondPhase then
          		spawnRoleAt(HordeConfig.Roles.Brute.Id, record.root.Position, "brute-phase2")
          	else
          		return false
          	end
          	return true
          end

          '''
          replace_once(server, 'local function handleEnemyDeath', commit_helper + 'local function handleEnemyDeath')
          replace_once(
              server,
              '''	local role = roleById[record.roleId] or HordeConfig.Roles.Basic
          	for _, state in playerStates do''',
              '''	local role = roleById[record.roleId] or HordeConfig.Roles.Basic
          	if record.pendingSpecialKindId == SpecialKindIds.ScreamerReinforcement then
          		cancelPendingSpecial(record)
          	end
          	for _, state in playerStates do''',
          )
          replace_once(
              server,
              '''	if role.Id == HordeConfig.Roles.Bloater.Id then
          		damagePlayersInBurst(record, role, serverTimestamp)
          		record.model:SetAttribute("HordeDeathBurstSequence", serverTimestamp)
          	elseif role.Id == HordeConfig.Roles.Brute.Id then
          		local entityId = enemyEntityId(record.model) or ""
          		if not string.find(entityId, "phase2", 1, true) then
          			spawnRoleAt(HordeConfig.Roles.Brute.Id, record.root.Position, "brute-phase2")
          		end
          	end''',
              '''	if role.Id == HordeConfig.Roles.Bloater.Id then
          		beginSpecialTelegraph(record, SpecialKindIds.BloaterDeathBurst, serverTimestamp)
          	elseif role.Id == HordeConfig.Roles.Brute.Id then
          		local entityId = enemyEntityId(record.model) or ""
          		if not string.find(entityId, "phase2", 1, true) then
          			beginSpecialTelegraph(record, SpecialKindIds.BruteSecondPhase, serverTimestamp)
          		end
          	end''',
          )
          replace_once(
              server,
              '''	if record.lifeStateId == EnemyLifeStateIds.Dead then
          		return
          	end
          	record.humanoid.WalkSpeed = role.SpeedFloor''',
              '''	commitPendingSpecial(record, role, serverTimestamp)
          	if record.lifeStateId == EnemyLifeStateIds.Dead then
          		return
          	end
          	record.humanoid.WalkSpeed = role.SpeedFloor''',
          )
          replace_once(
              server,
              '''	if role.Id == HordeConfig.Roles.Screamer.Id and serverTimestamp >= record.nextSpecialServerTimestamp then
          		record.nextSpecialServerTimestamp = serverTimestamp + role.SpecialIntervalSeconds
          		record.model:SetAttribute("HordeScreamSequence", serverTimestamp)
          		spawnReinforcements(record.root.Position, role.ReinforcementCount, "scream")
          	end''',
              '''	if
          		role.Id == HordeConfig.Roles.Screamer.Id
          		and record.pendingSpecialKindId == nil
          		and serverTimestamp >= record.nextSpecialServerTimestamp
          	then
          		beginSpecialTelegraph(record, SpecialKindIds.ScreamerReinforcement, serverTimestamp)
          	end''',
          )

          controller = "games/living-kingdoms/src/client/Controllers/HordeSpecialTelegraphController.luau"
          replace_once(controller, '\troot: BasePart?,\n\tkindId: string?,', '\tmodel: Model?,\n\troot: BasePart?,\n\tkindId: string?,')
          replace_once(controller, '\tslot.root = nil\n\tslot.kindId = nil', '\tslot.model = nil\n\tslot.root = nil\n\tslot.kindId = nil')
          replace_once(controller, '\t\tactive = false,\n\t\troot = nil,', '\t\tactive = false,\n\t\tmodel = nil,\n\t\troot = nil,')
          replace_once(
              controller,
              'local function activateTelegraph(root: BasePart, kindId: string, commitServerTimestamp: number)',
              'local function activateTelegraph(model: Model, root: BasePart, kindId: string, commitServerTimestamp: number)',
          )
          replace_once(controller, '\tslot.active = true\n\tslot.root = root', '\tslot.active = true\n\tslot.model = model\n\tslot.root = root')
          replace_once(controller, '\tactivateTelegraph(record.root, kindId, commitServerTimestamp)', '\tactivateTelegraph(model, record.root, kindId, commitServerTimestamp)')
          replace_once(controller, '\t\tactivateTelegraph(root, kindId, commitServerTimestamp)', '\t\tactivateTelegraph(instance, root, kindId, commitServerTimestamp)')
          replace_once(
              controller,
              '''	local root = slot.root
          	local kindId = slot.kindId
          	local definition = HordeSpecialTelegraphConfig.get(kindId)
          	if root == nil or root.Parent == nil or definition == nil then''',
              '''	local model = slot.model
          	local root = slot.root
          	local kindId = slot.kindId
          	local definition = HordeSpecialTelegraphConfig.get(kindId)
          	if model == nil or model.Parent == nil or root == nil or root.Parent == nil or definition == nil then''',
          )
          replace_once(
              controller,
              '''	local center = root.Position
          	local duration = math.max(0.01, slot.commitServerTimestamp - slot.startServerTimestamp)''',
              '''	if
          		serverTimestamp < slot.commitServerTimestamp - HordeSpecialTelegraphConfig.PollIntervalSeconds
          		and readStringAttribute(model, AttributeNames.StateId) ~= StateIds.Windup
          	then
          		deactivateSlot(slot)
          		return
          	end

          	local center = root.Position
          	local duration = math.max(0.01, slot.commitServerTimestamp - slot.startServerTimestamp)''',
          )

          audio_config = "games/living-kingdoms/src/shared/Config/EnemyAudioConfig.luau"
          replace_once(audio_config, 'Version = "AUD-0103-v1"', 'Version = "AUD-0103-v2-special-warnings"')
          warning_cues = '''
          	ScreamerWarning = table.freeze({
          		SoundId = "rbxassetid://7058441251",
          		Volume = 0.58,
          		PlaybackSpeed = 0.32,
          		MinimumIntervalSeconds = 0.8,
          	}),

          	BloaterWarning = table.freeze({
          		SoundId = "rbxassetid://165946267",
          		Volume = 0.6,
          		PlaybackSpeed = 0.2,
          		MinimumIntervalSeconds = 0.35,
          	}),

          	BruteWarning = table.freeze({
          		SoundId = "rbxassetid://165946267",
          		Volume = 0.66,
          		PlaybackSpeed = 0.16,
          		MinimumIntervalSeconds = 0.5,
          	}),
          '''
          replace_once(audio_config, '\n\tDeath = table.freeze({', warning_cues + '\n\tDeath = table.freeze({')
          replace_once(
              audio_config,
              'for _, cueName in { "Alert", "Windup", "Strike", "Hit", "Death" } do',
              'for _, cueName in { "Alert", "Windup", "Strike", "Hit", "ScreamerWarning", "BloaterWarning", "BruteWarning", "Death" } do',
          )

          audio = "games/living-kingdoms/src/client/Controllers/EnemyAudioController.luau"
          replace_once(
              audio,
              '''local EnemyConfig = require(ReplicatedStorage.Shared.Config.EnemyConfig)
          local EnemyContracts = require(ReplicatedStorage.Shared.Combat.EnemyContracts)''',
              '''local EnemyConfig = require(ReplicatedStorage.Shared.Config.EnemyConfig)
          local HordeSpecialTelegraphConfig = require(ReplicatedStorage.Shared.Config.HordeSpecialTelegraphConfig)
          local EnemyContracts = require(ReplicatedStorage.Shared.Combat.EnemyContracts)''',
          )
          replace_once(
              audio,
              '''local BehaviorStateIds = EnemyContracts.EnemyBehaviorStateIds

          local ENEMY_FOLDER_NAME''',
              '''local BehaviorStateIds = EnemyContracts.EnemyBehaviorStateIds
          local SpecialAttributeNames = HordeSpecialTelegraphConfig.AttributeNames
          local SpecialKindIds = HordeSpecialTelegraphConfig.KindIds

          local ENEMY_FOLDER_NAME''',
          )
          replace_once(audio, '\tlastHitSequence: number,\n\twasDead: boolean,', '\tlastHitSequence: number,\n\tlastSpecialSequence: number,\n\twasDead: boolean,')
          replace_once(
              audio,
              '''	local hitSequence = readNumberAttribute(model, PresentationAttributeNames.HitSequence)
          	if''',
              '''	local hitSequence = readNumberAttribute(model, PresentationAttributeNames.HitSequence)
          	local specialSequence = readNumberAttribute(model, SpecialAttributeNames.Sequence) or 0
          	if''',
          )
          replace_once(
              audio,
              '''		lastHitSequence = hitSequence,
          		wasDead = lifeStateId == PresentationLifeStateIds.Dead,''',
              '''		lastHitSequence = hitSequence,
          		lastSpecialSequence = specialSequence,
          		wasDead = lifeStateId == PresentationLifeStateIds.Dead,''',
          )
          replace_once(
              audio,
              '''	local hitSequence = readNumberAttribute(model, PresentationAttributeNames.HitSequence)
          	if
          		behaviorStateId == nil''',
              '''	local hitSequence = readNumberAttribute(model, PresentationAttributeNames.HitSequence)
          	local specialSequence = readNumberAttribute(model, SpecialAttributeNames.Sequence) or record.lastSpecialSequence
          	local specialKindId = readStringAttribute(model, SpecialAttributeNames.KindId)
          	if
          		behaviorStateId == nil''',
          )
          special_audio = '''
          	if specialSequence > record.lastSpecialSequence then
          		if specialKindId == SpecialKindIds.ScreamerReinforcement then
          			playCue("ScreamerWarning", EnemyAudioConfig.ScreamerWarning, record)
          		elseif specialKindId == SpecialKindIds.BloaterDeathBurst then
          			playCue("BloaterWarning", EnemyAudioConfig.BloaterWarning, record)
          		elseif specialKindId == SpecialKindIds.BruteSecondPhase then
          			playCue("BruteWarning", EnemyAudioConfig.BruteWarning, record)
          		end
          	end
          '''
          replace_once(audio, '\n\trecord.lastBehaviorStateId = behaviorStateId', special_audio + '\n\trecord.lastBehaviorStateId = behaviorStateId')
          replace_once(audio, '\trecord.lastHitSequence = hitSequence\n\trecord.wasDead = isDead', '\trecord.lastHitSequence = hitSequence\n\trecord.lastSpecialSequence = specialSequence\n\trecord.wasDead = isDead')

          bootstrap = "games/living-kingdoms/src/client/init.client.luau"
          replace_once(
              bootstrap,
              'local HordeEffectsController = require(script.Controllers.HordeEffectsController)',
              'local HordeEffectsController = require(script.Controllers.HordeEffectsController)\nlocal HordeSpecialTelegraphController = require(script.Controllers.HordeSpecialTelegraphController)',
          )
          replace_once(
              bootstrap,
              'HordeEffectsController.start()\nCriticalConditionController.start()',
              'HordeEffectsController.start()\nHordeSpecialTelegraphController.start()\nCriticalConditionController.start()',
          )

          roadmap = "docs/roadmap/RECOMMENDED-PASSES.md"
          replace_once(
              roadmap,
              '''  ([`../specifications/horde-role-readability.md`](../specifications/horde-role-readability.md)).

          ## C. Explicitly excluded''',
              '''  ([`../specifications/horde-role-readability.md`](../specifications/horde-role-readability.md)).
          - **Horde special-role telegraph pass** — short server-owned warning windows,
            exact-radius Bloater disclosure, pooled world presentation, and role-specific
            warning audio for Screamer reinforcement, Bloater burst, and Brute phase two
            ([`../specifications/horde-special-role-telegraphs.md`](../specifications/horde-special-role-telegraphs.md)).

          ## C. Explicitly excluded''',
          )
          PY

      - name: Format focused Luau
        run: |
          stylua \
            games/living-kingdoms/src/server/Systems/HordeExperienceService.luau \
            games/living-kingdoms/src/client/Controllers/HordeSpecialTelegraphController.luau \
            games/living-kingdoms/src/client/Controllers/EnemyAudioController.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/src/shared/Config/HordeSpecialTelegraphConfig.luau \
            games/living-kingdoms/src/shared/Config/EnemyAudioConfig.luau \
            games/living-kingdoms/tests/HordeSpecialTelegraphConfig.test.luau \
            games/living-kingdoms/tests/HordeSpecialTelegraphSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0
          echo "Executed $fixture_count fixtures."

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/horde-special-telegraphs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make horde special attacks readable before they commit"
          git push origin HEAD:feat/horde-special-telegraphs-v1

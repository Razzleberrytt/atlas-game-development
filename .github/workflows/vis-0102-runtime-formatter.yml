name: VIS-0102 runtime formatter

on:
  push:
    branches:
      - "agent/vis-0102-runtime-carbine-presentation"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/vis-0102-runtime-carbine-presentation

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Format carbine runtime files
        run: |
          stylua \
            games/living-kingdoms/src/client/Presentation/BasicFirearmPresentationFactory.luau \
            games/living-kingdoms/src/client/Controllers/WeaponPresentationController.luau \
            games/living-kingdoms/tests/WeaponPresentationSourceAudit.test.luau

      - name: Commit pinned formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/src/client/Presentation/BasicFirearmPresentationFactory.luau games/living-kingdoms/src/client/Controllers/WeaponPresentationController.luau games/living-kingdoms/tests/WeaponPresentationSourceAudit.test.luau
          git commit -m "Format carbine runtime presentation"
          git push

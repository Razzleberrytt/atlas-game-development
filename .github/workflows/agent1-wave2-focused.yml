name: Agent 1 Wave 2 focused validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused-combat:
    if: github.head_ref == 'agent-1/combat-weapons-wave-2'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false

      - name: Check Agent 1 formatting
        run: |
          stylua --check \
            games/living-kingdoms/src/server/Systems/AutomaticFireResolver.luau \
            games/living-kingdoms/src/shared/Combat/WeaponRuntimeStatsResolver.luau \
            games/living-kingdoms/src/shared/Config/FirearmConfig.luau \
            games/living-kingdoms/src/shared/Config/WeaponPatternConfig.luau \
            games/living-kingdoms/tests/WeaponArchetypeConfig.test.luau \
            games/living-kingdoms/tests/WeaponFiringModes.test.luau \
            games/living-kingdoms/tests/WeaponRuntimeStatsResolver.test.luau

      - name: Lint Agent 1 source
        run: |
          selene \
            games/living-kingdoms/src/server/Systems/AutomaticFireResolver.luau \
            games/living-kingdoms/src/shared/Combat/WeaponRuntimeStatsResolver.luau \
            games/living-kingdoms/src/shared/Config/FirearmConfig.luau \
            games/living-kingdoms/src/shared/Config/WeaponPatternConfig.luau

      - name: Run focused combat fixtures
        run: |
          lune run games/living-kingdoms/tests/AutomaticFireResolver.test.luau
          lune run games/living-kingdoms/tests/WeaponPatternResolver.test.luau
          lune run games/living-kingdoms/tests/WeaponArchetypeConfig.test.luau
          lune run games/living-kingdoms/tests/WeaponFiringModes.test.luau
          lune run games/living-kingdoms/tests/WeaponRuntimeStatsResolver.test.luau

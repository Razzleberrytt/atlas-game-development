name: Exclusion Walker diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures-hg:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with: { version: v1.2.0, path: ., cache: false, token: "${{ github.token }}" }
      - shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' fixture; do base="$(basename "$fixture")"; if [[ "$base" =~ ^[Hh][Gg] ]]; then echo "Running $fixture"; lune run "$fixture"; fi; done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)


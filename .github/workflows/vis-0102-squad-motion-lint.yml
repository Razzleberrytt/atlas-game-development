name: VIS-0102 squad motion lint diagnostic

on:
  push:
    branches:
      - "agent/vis-0102-squad-weapon-motion"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vis-0102-squad-weapon-motion
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}
      - run: |
          mkdir -p .diagnostics
          selene games/living-kingdoms/src > .diagnostics/vis-0102-squad-motion-selene.txt 2>&1 || true
      - run: |
          if [ -z "$(git status --porcelain -- .diagnostics/vis-0102-squad-motion-selene.txt)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/vis-0102-squad-motion-selene.txt
          git commit -m "Capture squad motion Selene diagnostic"
          git push

name: P7 format once

on:
  pull_request:
    paths:
      - "games/living-kingdoms/src/shared/Classes/ClassContracts.luau"
      - "games/living-kingdoms/src/shared/Config/ClassConfig.luau"
      - ".github/workflows/p7-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Format P7 declarations
        shell: bash
        run: stylua games/living-kingdoms/src/shared/Classes/ClassContracts.luau games/living-kingdoms/src/shared/Config/ClassConfig.luau

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/src/shared/Classes/ClassContracts.luau games/living-kingdoms/src/shared/Config/ClassConfig.luau
          git commit -m "Format P7 class declarations"
          git push

name: Finalize streak presentation once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/streak-presentation-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/streak-presentation-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Wire authoritative streak crescendo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              file_path.write_text(source.replace(old, new, 1))

          server = "games/living-kingdoms/src/server/Systems/HordeExperienceService.luau"
          replace_once(
              server,
              "\t\tstreak = state.streak,\n\t\tthreat = value,",
              "\t\tstreak = state.streak,\n\t\tstreakExpiresServerTimestamp = if state.streak >= 2\n\t\t\tthen state.lastKillServerTimestamp + HordeConfig.Streak.KillStreakWindowSeconds\n\t\t\telse 0,\n\t\tthreat = value,",
          )

          hud = "games/living-kingdoms/src/client/Controllers/HordeHUDController.luau"
          replace_once(hud, "local streakLabel: TextLabel? = nil\n", "")
          replace_once(
              hud,
              "\tlocal streak = tonumber(payload.streak) or 0\n\tif streakLabel ~= nil then\n\t\tstreakLabel.Text = if streak >= 2 then string.format(\"MASSACRE x%d\", streak) else \"\"\n\t\tstreakLabel.Visible = streak >= 2\n\tend\n",
              "",
          )
          replace_once(
              hud,
              "\tstreakLabel = createLabel(\n\t\tgui,\n\t\t\"Streak\",\n\t\tUDim2.new(0.5, -300, 0.72, 0),\n\t\tUDim2.fromOffset(600, 40),\n\t\t25,\n\t\tEnum.Font.GothamBlack,\n\t\tEnum.TextXAlignment.Center\n\t)\n\tstreakLabel.TextColor3 = Color3.fromRGB(255, 94, 61)\n\tstreakLabel.Visible = false\n\n",
              "",
          )

          bootstrap = "games/living-kingdoms/src/client/init.client.luau"
          replace_once(
              bootstrap,
              "local HordeSpecialTelegraphController = require(script.Controllers.HordeSpecialTelegraphController)\nlocal CriticalConditionController",
              "local HordeSpecialTelegraphController = require(script.Controllers.HordeSpecialTelegraphController)\nlocal MassacreCrescendoController = require(script.Controllers.MassacreCrescendoController)\nlocal CriticalConditionController",
          )
          replace_once(
              bootstrap,
              "HordeSpecialTelegraphController.start()\nCriticalConditionController.start()",
              "HordeSpecialTelegraphController.start()\nMassacreCrescendoController.start()\nCriticalConditionController.start()",
          )

          roadmap = "docs/roadmap/RECOMMENDED-PASSES.md"
          replace_once(
              roadmap,
              "- **Horde special-role telegraph pass** — short server-owned warning windows,\n  exact-radius Bloater disclosure, pooled world presentation, and role-specific\n  warning audio for Screamer reinforcement, Bloater burst, and Brute phase two\n  ([`../specifications/horde-special-role-telegraphs.md`](../specifications/horde-special-role-telegraphs.md)).\n",
              "- **Horde special-role telegraph pass** — short server-owned warning windows,\n  exact-radius Bloater disclosure, pooled world presentation, and role-specific\n  warning audio for Screamer reinforcement, Bloater burst, and Brute phase two\n  ([`../specifications/horde-special-role-telegraphs.md`](../specifications/horde-special-role-telegraphs.md)).\n- **Massacre crescendo pass** — escalating, non-rewarding kill-chain titles,\n  exact authoritative expiry, fixed audiovisual punch, and one verified tier\n  stinger without changing XP, loot, health, ammunition, or combat power\n  ([`../specifications/massacre-crescendo.md`](../specifications/massacre-crescendo.md)).\n",
          )
          PY

      - name: Format focused Luau
        run: |
          stylua \
            games/living-kingdoms/src/server/Systems/HordeExperienceService.luau \
            games/living-kingdoms/src/client/Controllers/HordeHUDController.luau \
            games/living-kingdoms/src/client/Controllers/MassacreCrescendoController.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/src/shared/Config/MassacreCrescendoConfig.luau \
            games/living-kingdoms/tests/MassacreCrescendoConfig.test.luau \
            games/living-kingdoms/tests/MassacreCrescendoSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          while IFS= read -r -d '' fixture; do
            echo "=== $fixture ==="
            lune run "$fixture"
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json -o /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          rm .github/workflows/finalize-streak-presentation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/roadmap/RECOMMENDED-PASSES.md \
            docs/specifications/massacre-crescendo.md \
            games/living-kingdoms/src/server/Systems/HordeExperienceService.luau \
            games/living-kingdoms/src/client/Controllers/HordeHUDController.luau \
            games/living-kingdoms/src/client/Controllers/MassacreCrescendoController.luau \
            games/living-kingdoms/src/client/init.client.luau \
            games/living-kingdoms/src/shared/Config/MassacreCrescendoConfig.luau \
            games/living-kingdoms/tests/MassacreCrescendoConfig.test.luau \
            games/living-kingdoms/tests/MassacreCrescendoSourceAudit.test.luau \
            .github/workflows/finalize-streak-presentation-once.yml
          if git diff --cached --quiet; then
            echo "No finalization changes to commit"
            exit 0
          fi
          git commit -m "Make authoritative kill chains escalate audiovisually"
          git push origin HEAD:feat/streak-presentation-v1

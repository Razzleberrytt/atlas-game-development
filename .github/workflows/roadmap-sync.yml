name: Roadmap synchronization

on:
  push:
    branches:
      - agent/roadmap-p6-p12-execution

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Synchronize master roadmap summary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap/MASTER-ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          start = text.index("## P6 — Ammunition scarcity and supply collection")
          end = text.index("## Superseded RTS roadmap")
          replacement = """## Remaining MVP execution roadmap

The PR-sized tasks, dependencies, validation gates, and completion process for P6 through P12 live in [`P6-P12-EXECUTION-ROADMAP.md`](P6-P12-EXECUTION-ROADMAP.md). That document is the executable continuation of this milestone history and must remain synchronized with milestone status here.

## P6 — Ammunition scarcity and supply collection

Replace temporary firearm resources with server-owned finite ammunition, supply caches at authored risky locations, collection rules, clear inventory feedback, and balance telemetry sufficient to distinguish tension from unavoidable starvation.

**P6 status:** In progress. Contracts, finite production ammunition, authored caches, server-owned collection, authoritative HUD feedback, per-operative cache depletion, and sampled Studio telemetry are complete. Controlled one-, two-, and four-operative evidence (`P6-0108`) and evidence-based tuning/sign-off (`P6-0109`) remain.

## P7 — Three interdependent MVP classes

Implement combat specialist, medic, and engineer responsibilities, limitations, cross-class interactions, class choice, and multiplayer verification. The engineer may restore ammunition only within strict scarcity constraints.

**P7 status:** Planning complete in `docs/specifications/mvp-specialist-classes.md`. Gameplay implementation begins with shared class contracts/configuration after P6 sign-off.

## P8 — Authored operation objectives

Build one operation flow with two or three authored objectives, forced relocation, useful temporary defensive positions, failure rules, and objective state readable to the squad.

**P8 status:** Not started. Eight ordered tasks are defined in the executable roadmap.

## P9 — Special enemy and boss encounter

Add one special enemy that disrupts a reliable tactic and one readable boss climax that demands coordination and tests lessons taught earlier in the operation.

**P9 status:** Not started. Six ordered tasks are defined in the executable roadmap.

## P10 — Match completion, failure, extraction, and replay

Implement final extraction or holdout, full-squad success and failure resolution, result screens, cleanup, replay flow, and safe handling of leave/disconnect cases.

**P10 status:** Not started. Seven ordered tasks are defined in the executable roadmap.

## P11 — Persistent XP, ranks, and class unlock

Implement server-owned XP awards for victory and limited meaningful participation on failure, a small military-style rank ladder, reliable persistence, anti-idle safeguards, and at least one side-grade specialist class unlock. Do not add paid power or material permanent stat inflation.

**P11 status:** Not started. Eight ordered tasks are defined in the executable roadmap.

## P12 — Cooperative balance, performance, accessibility, and polish

Tune difficulty for high but learnable failure, class dependence, scarcity, relocation pressure, solo-to-four-player scaling, horde performance, accessibility, feedback, and operation readability. Validate that architecture has no fixed four-player assumptions before expanding toward eight-player support.

**P12 status:** Not started. Nine ordered tasks are defined in the executable roadmap.

"""
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Commit synchronized roadmap
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/MASTER-ROADMAP.md
          git commit -m "Synchronize master roadmap with execution plan"
          git push

name: Finish weapon-aware targeting once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/weapon-aware-auto-targeting-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/weapon-aware-auto-targeting-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Reproduce wiring and correct fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/weapon-aware-targeting-once.yml').read_text()
          marker = '      - name: Wire weapon-aware targeting\n'
          section = source.split(marker, 1)[1].split('\n\n      - name: Format focused Luau', 1)[0]
          script = section.split('        run: |\n', 1)[1]
          Path('/tmp/reproduce.sh').write_text(textwrap.dedent(script))
          PY
          bash /tmp/reproduce.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('games/living-kingdoms/tests/WeaponTargetSelector.test.luau')
          source = path.read_text()
          old = '''local noPattern = {
          \tcandidate("hostile.far", 20, 0),
          \tcandidate("hostile.close", 6, 0),
          }'''
          new = '''local noPattern = {
          \tcandidate("hostile.far", 20, 0),
          \tcandidate("hostile.close", 0, 6),
          }'''
          if source.count(old) != 1:
              raise RuntimeError('expected one no-opportunity fixture')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Format focused Luau
        run: |
          stylua \
            games/living-kingdoms/src/shared/Combat/CombatContracts.luau \
            games/living-kingdoms/src/server/Systems/OperativeCombatRuntimeService.luau \
            games/living-kingdoms/src/server/Systems/WeaponTargetSelector.luau \
            games/living-kingdoms/tests/WeaponTargetSelector.test.luau \
            games/living-kingdoms/tests/WeaponTargetSelectorSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0
          echo "Executed $fixture_count fixtures."

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/weapon-aware-targeting-once.yml
          rm .github/workflows/weapon-aware-targeting-diagnostic.yml
          rm .github/workflows/weapon-aware-targeting-finish-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make automatic targeting exploit weapon patterns"
          git push origin HEAD:feat/weapon-aware-auto-targeting-v1

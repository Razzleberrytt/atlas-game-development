name: Format MVP 299 once

on:
  push:
    branches:
      - mvp-01/activate-authored-outdoor-approach
    paths:
      - ".github/workflows/format-mvp-299-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: mvp-01/activate-authored-outdoor-approach

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Format PR 299 Luau files
        shell: bash
        run: |
          stylua \
            games/living-kingdoms/src/server/Systems/ExpeditionServerBootstrap.luau \
            games/living-kingdoms/src/shared/Config/FirstOutdoorEncounterBeatConfig.luau \
            games/living-kingdoms/tests/ExpeditionServerBootstrap.test.luau \
            games/living-kingdoms/tests/FirstOutdoorEncounterBeatConfig.test.luau

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "StyLua made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            games/living-kingdoms/src/server/Systems/ExpeditionServerBootstrap.luau \
            games/living-kingdoms/src/shared/Config/FirstOutdoorEncounterBeatConfig.luau \
            games/living-kingdoms/tests/ExpeditionServerBootstrap.test.luau \
            games/living-kingdoms/tests/FirstOutdoorEncounterBeatConfig.test.luau
          git commit -m "Apply StyLua formatting for PR 299"
          git push origin HEAD:mvp-01/activate-authored-outdoor-approach

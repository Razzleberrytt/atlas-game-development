name: Finalize combat feel pass v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/combat-presentation-feel-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/combat-presentation-feel-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply focused integration
        run: |
          python3 tools/apply_combat_presentation_feel.py
          python3 tools/update_tracer_profile_audit.py

      - name: Format edited Luau
        run: |
          stylua \
            games/living-kingdoms/src/shared/Config/WeaponFeelConfig.luau \
            games/living-kingdoms/src/client/Presentation/WeaponShotEffectPresenter.luau \
            games/living-kingdoms/src/client/Controllers/WeaponAudioController.luau \
            games/living-kingdoms/src/client/Controllers/WeaponPresentationController.luau \
            games/living-kingdoms/tests/WeaponFeelConfig.test.luau \
            games/living-kingdoms/tests/HitConfirmedTracerSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            echo "::group::Lune fixture: $fixture"
            lune run "$fixture"
            echo "::endgroup::"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0
          echo "Executed $fixture_count fixtures."

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_combat_presentation_feel.py
          rm tools/update_tracer_profile_audit.py
          rm .github/workflows/combat-presentation-feel-once.yml
          rm .github/workflows/combat-feel-finalize-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add distinct combat presentation feel per loadout"
          git push origin HEAD:feat/combat-presentation-feel-v1

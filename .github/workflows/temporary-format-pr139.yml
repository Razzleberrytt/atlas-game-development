name: Temporary PR 139 Formatter

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format:
    # This workflow self-deletes after applying the repository's pinned formatter.
    if: github.event.pull_request.head.ref == 'feat/screamer-interrupt-xp-reward'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/screamer-interrupt-xp-reward
          fetch-depth: 0

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Format touched Luau files
        run: |
          stylua \
            games/living-kingdoms/src/client/Controllers/HordeEffectsController.luau \
            games/living-kingdoms/src/server/Systems/ScreamerInterruptRewardService.luau \
            games/living-kingdoms/src/server/init.server.luau \
            games/living-kingdoms/src/shared/Config/HordeDeathPunctuationConfig.luau \
            games/living-kingdoms/src/shared/Config/ScreamerInterruptRewardConfig.luau \
            games/living-kingdoms/tests/HordeDeathPunctuationConfig.test.luau \
            games/living-kingdoms/tests/ScreamerInterruptRewardConfig.test.luau \
            games/living-kingdoms/tests/ScreamerInterruptRewardSourceAudit.test.luau

      - name: Remove one-shot workflow
        run: rm .github/workflows/temporary-format-pr139.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Format Screamer interrupt reward slice"
          git push origin HEAD:feat/screamer-interrupt-xp-reward

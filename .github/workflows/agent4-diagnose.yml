name: Agent 4 progression diagnostics

on:
  push:
    branches:
      - agent-4/progression-core-wave-1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}
      - name: InventorySessionLeaseService
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/InventorySessionLeaseService.test.luau
      - name: InventoryMultiServerHandoff
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/InventoryMultiServerHandoff.test.luau
      - name: InventoryReadOutageRecovery
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/InventoryReadOutageRecovery.test.luau
      - name: InventoryLifecycleFaultMatrix
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/InventoryLifecycleFaultMatrix.test.luau
      - name: StudioInventoryPersistenceIsolation
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/StudioInventoryPersistenceIsolation.test.luau
      - name: RobloxInventoryDataStoreAdapterLoadGuard
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/RobloxInventoryDataStoreAdapterLoadGuard.test.luau

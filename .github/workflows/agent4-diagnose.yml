name: Agent 4 progression diagnostics

on:
  push:
    branches:
      - agent-4/progression-core-wave-1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: CharacterProgressionResolver
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/CharacterProgressionResolver.test.luau
      - name: CharacterProgressionServiceSourceAudit
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/CharacterProgressionServiceSourceAudit.test.luau
      - name: CharacterProgressionPersistenceSourceAudit
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/CharacterProgressionPersistenceSourceAudit.test.luau
      - name: CharacterProgressionPersistence
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/CharacterProgressionPersistence.test.luau
      - name: PlayerInventoryPersistenceService
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/PlayerInventoryPersistenceService.test.luau
      - name: InventoryMigrationMatrix
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/InventoryMigrationMatrix.test.luau
      - name: InventoryRecordCapacity
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/InventoryRecordCapacity.test.luau
      - name: InventoryInvariantChecker
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/InventoryInvariantChecker.test.luau
      - name: InventoryStorageContractSourceAudit
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/InventoryStorageContractSourceAudit.test.luau
      - name: InventoryLiveLifecycleSourceAudit
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/InventoryLiveLifecycleSourceAudit.test.luau
      - name: PersistenceReasonClassificationAudit
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/PersistenceReasonClassificationAudit.test.luau
      - name: OperativeProgressionLedgerShape
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/OperativeProgressionLedgerShape.test.luau
      - name: DurableMutationAuthoritySourceAudit
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/DurableMutationAuthoritySourceAudit.test.luau
      - name: EquipmentAffixDurableLifecycle
        continue-on-error: true
        run: lune run games/living-kingdoms/tests/EquipmentAffixDurableLifecycle.test.luau

name: Temporary fixture diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-fixture-diagnostics.yml"
      - ".github/one-shot/p6_0105_patch.py"
      - ".github/one-shot/fix_p6_patch.py"
      - ".github/one-shot/fix_weapon_controller_fixture.py"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p6-0105-ammunition-feedback
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - run: python3 .github/one-shot/fix_p6_patch.py
      - run: python3 .github/one-shot/p6_0105_patch.py
      - run: python3 .github/one-shot/fix_weapon_controller_fixture.py
      - run: stylua games/living-kingdoms/src games/living-kingdoms/tests/P6AmmunitionPresentation.test.luau games/living-kingdoms/tests/WeaponController.test.luau
      - run: selene games/living-kingdoms/src

      - name: Execute fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_count=0
          while IFS= read -r -d '' fixture; do
            lune run "$fixture"
            fixture_count=$((fixture_count + 1))
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          test "$fixture_count" -gt 0

      - run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Restore strict workflow and commit
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/luau-validation.yml
          rm -f .github/workflows/temporary-fixture-diagnostics.yml
          rm -f .github/workflows/p6-0105-one-shot.yml
          rm -f .github/one-shot/p6_0105_patch.py
          rm -f .github/one-shot/fix_p6_patch.py
          rm -f .github/one-shot/fix_weapon_controller_fixture.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add authoritative ammunition feedback"
          git push origin HEAD:agent/p6-0105-ammunition-feedback

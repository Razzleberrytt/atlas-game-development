name: VIS-0102 source generator

on:
  push:
    branches:
      - "agent/vis-0102-blackwater-carbine-source"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/vis-0102-blackwater-carbine-source

      - name: Install source dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib trimesh

      - name: Generate model and preview
        run: python games/living-kingdoms/assets/visual/weapon/basic-firearm/generate_blackwater_carbine.py

      - name: Commit generated source
        run: |
          if git diff --quiet -- games/living-kingdoms/assets/visual/weapon/basic-firearm/blackwater_service_carbine.obj games/living-kingdoms/assets/visual/weapon/basic-firearm/blackwater_service_carbine_preview.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/living-kingdoms/assets/visual/weapon/basic-firearm/blackwater_service_carbine.obj games/living-kingdoms/assets/visual/weapon/basic-firearm/blackwater_service_carbine_preview.svg
          git commit -m "Generate Blackwater carbine source"
          git push

name: Finalize pattern hit punctuation once

on:
  push:
    branches:
      - feat/pattern-hit-punctuation-v1

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pattern-hit-punctuation-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Apply pattern-hit punctuation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              file_path.write_text(source.replace(old, new, 1))

          controller = "games/living-kingdoms/src/client/Controllers/ConfirmedHitMarkerController.luau"

          replace_once(
              controller,
              'local ConfirmedHitMarkerConfig = require(ReplicatedStorage.Shared.Config.ConfirmedHitMarkerConfig)\nlocal FirearmConfig = require(ReplicatedStorage.Shared.Config.FirearmConfig)\n',
              'local ConfirmedHitMarkerConfig = require(ReplicatedStorage.Shared.Config.ConfirmedHitMarkerConfig)\nlocal FirearmConfig = require(ReplicatedStorage.Shared.Config.FirearmConfig)\nlocal WeaponPatternConfig = require(ReplicatedStorage.Shared.Config.WeaponPatternConfig)\n',
          )
          replace_once(
              controller,
              'local markerCenter: Frame? = nil\nlocal markerArms: { Frame } = {}\n',
              'local markerCenter: Frame? = nil\nlocal markerScale: UIScale? = nil\nlocal markerArms: { Frame } = {}\n',
          )
          replace_once(
              controller,
              'local confirmedChain = 0\nlocal lastConfirmedServerTimestamp = -math.huge\n',
              'local confirmedChain = 0\nlocal patternModeId: string? = nil\nlocal patternHitCount = 1\nlocal lastConfirmedServerTimestamp = -math.huge\n',
          )
          replace_once(
              controller,
              'local function isFiniteNumber(value: unknown): boolean\n\treturn type(value) == "number" and value == value and math.abs(value) < math.huge\nend\n\nlocal function isLocalOperativeEntityId',
              '''local function isFiniteNumber(value: unknown): boolean
\treturn type(value) == "number" and value == value and math.abs(value) < math.huge
end

local function isWholePositive(value: unknown): boolean
\treturn isFiniteNumber(value) and value > 0 and value % 1 == 0
end

local function colorFromTuple(tuple: { number }): Color3
\treturn Color3.fromRGB(tuple[1], tuple[2], tuple[3])
end

local function readSecondaryImpactCount(value: unknown, maximumSecondaryTargets: number): number?
\tif value == nil then
\t\treturn 0
\tend
\tif type(value) ~= "table" then
\t\treturn nil
\tend
\tlocal impacts = value :: { any }
\tlocal maximumAccepted = math.min(maximumSecondaryTargets, ConfirmedHitMarkerConfig.MaximumSecondaryImpacts)
\tif #impacts > maximumAccepted then
\t\treturn nil
\tend
\tfor _, impact in impacts do
\t\tif
\t\t\ttype(impact) ~= "table"
\t\t\tor not isNonEmptyString(impact.targetEntityId)
\t\t\tor typeof(impact.impactWorldPosition) ~= "Vector3"
\t\t\tor not isWholePositive(impact.damageAmount)
\t\tthen
\t\t\treturn nil
\t\tend
\tend
\treturn #impacts
end

local function isLocalOperativeEntityId''',
          )
          replace_once(
              controller,
              '\tmarkerRoot = root\n\n\tfor index, armDefinition in ARM_DEFINITIONS do\n',
              '\tmarkerRoot = root\n\n\tlocal scale = Instance.new("UIScale")\n\tscale.Scale = 1\n\tscale.Parent = root\n\tmarkerScale = scale\n\n\tfor index, armDefinition in ARM_DEFINITIONS do\n',
          )
          replace_once(controller, '\tlabel.Size = UDim2.fromOffset(210, 25)\n', '\tlabel.Size = UDim2.fromOffset(290, 25)\n')
          replace_once(
              controller,
              '''local function markerColorForChain(chain: number): Color3
\tif chain >= ConfirmedHitMarkerConfig.BrutalChainThreshold then
\t\treturn Color3.fromRGB(255, 70, 52)
\tend
\tif chain >= ConfirmedHitMarkerConfig.HotChainThreshold then
\t\treturn Color3.fromRGB(255, 166, 62)
\tend
\treturn Color3.fromRGB(244, 238, 216)
end
''',
              '''local function markerColorForPresentation(chain: number, modeId: string?): Color3
\tlocal patternPresentation = ConfirmedHitMarkerConfig.getPatternPresentation(modeId)
\tif patternPresentation ~= nil then
\t\treturn colorFromTuple(patternPresentation.Color)
\tend
\tif chain >= ConfirmedHitMarkerConfig.BrutalChainThreshold then
\t\treturn Color3.fromRGB(255, 70, 52)
\tend
\tif chain >= ConfirmedHitMarkerConfig.HotChainThreshold then
\t\treturn Color3.fromRGB(255, 166, 62)
\tend
\treturn Color3.fromRGB(244, 238, 216)
end
''',
          )
          replace_once(
              controller,
              '''\tlocal center = markerCenter
\tlocal worldPosition = impactWorldPosition
\tif root == nil or label == nil or center == nil or worldPosition == nil then
''',
              '''\tlocal center = markerCenter
\tlocal scale = markerScale
\tlocal worldPosition = impactWorldPosition
\tif root == nil or label == nil or center == nil or scale == nil or worldPosition == nil then
''',
          )
          replace_once(
              controller,
              '''\tlocal radius = ConfirmedHitMarkerConfig.MinimumRadiusPixels
\t\t+ (ConfirmedHitMarkerConfig.MaximumRadiusPixels - ConfirmedHitMarkerConfig.MinimumRadiusPixels)
\t\t\t* easedProgress
''',
              '''\tlocal patternPresentation = ConfirmedHitMarkerConfig.getPatternPresentation(patternModeId)
\tlocal radiusBonus = if patternPresentation ~= nil then ConfirmedHitMarkerConfig.PatternRadiusBonusPixels else 0
\tlocal radius = ConfirmedHitMarkerConfig.MinimumRadiusPixels
\t\t+ radiusBonus
\t\t+ (ConfirmedHitMarkerConfig.MaximumRadiusPixels - ConfirmedHitMarkerConfig.MinimumRadiusPixels)
\t\t\t* easedProgress
''',
          )
          replace_once(
              controller,
              '\tlocal color = markerColorForChain(confirmedChain)\n',
              '\tlocal color = markerColorForPresentation(confirmedChain, patternModeId)\n',
          )
          replace_once(
              controller,
              '''\tlabel.Text = if confirmedChain >= 2 then string.format("CONFIRMED  x%d", confirmedChain) else "HIT CONFIRMED"
\tlabel.TextColor3 = color
''',
              '''\tlabel.Text = if patternPresentation ~= nil
\t\tthen string.format("%s  x%d", patternPresentation.Title, patternHitCount)
\t\telseif confirmedChain >= 2 then string.format("CONFIRMED  x%d", confirmedChain)
\t\telse "HIT CONFIRMED"
\tlabel.TextColor3 = color
\tlocal patternPulse = if patternPresentation ~= nil then (1 - progress) * (1 - progress) else 0
\tscale.Scale = 1 + (ConfirmedHitMarkerConfig.PatternPulseScale - 1) * patternPulse
''',
          )
          replace_once(
              controller,
              '''\tlocal payload = message :: any
\tif
''',
              '''\tlocal payload = message :: any
\tlocal patternDefinition = WeaponPatternConfig.get(payload.weaponId)
\tif patternDefinition == nil then
\t\treturn
\tend
\tlocal secondaryImpactCount = readSecondaryImpactCount(payload.secondaryImpacts, patternDefinition.MaximumSecondaryTargets)
\tif secondaryImpactCount == nil then
\t\treturn
\tend
\tif
''',
          )
          replace_once(
              controller,
              '''\tlastConfirmedServerTimestamp = payload.serverTimestamp
\timpactWorldPosition = payload.impactWorldPosition
\tpresentationStartedTimestamp = Workspace:GetServerTimeNow()
''',
              '''\tlastConfirmedServerTimestamp = payload.serverTimestamp
\timpactWorldPosition = payload.impactWorldPosition
\tpatternModeId = if secondaryImpactCount > 0 and patternDefinition.ModeId ~= WeaponPatternConfig.ModeIds.SingleTarget
\t\tthen patternDefinition.ModeId
\t\telse nil
\tpatternHitCount = 1 + secondaryImpactCount
\tpresentationStartedTimestamp = Workspace:GetServerTimeNow()
''',
          )
          replace_once(
              controller,
              '''\tmarkerCenter = nil
\ttable.clear(markerArms)
\timpactWorldPosition = nil
\tpresentationStartedTimestamp = -math.huge
\tconfirmedChain = 0
''',
              '''\tmarkerCenter = nil
\tmarkerScale = nil
\ttable.clear(markerArms)
\timpactWorldPosition = nil
\tpresentationStartedTimestamp = -math.huge
\tconfirmedChain = 0
\tpatternModeId = nil
\tpatternHitCount = 1
''',
          )

          config = Path("games/living-kingdoms/src/shared/Config/ConfirmedHitMarkerConfig.luau")
          config.write_text('''--!strict

--[[
\tShooter-specific confirmation for server-authored damage impacts. Pattern-hit
\tpunctuation changes only fixed client-local marker text, color, radius, and
\tscale when the accepted ShotFired disclosure includes bounded secondary
\timpacts. It cannot establish targeting, damage, death, ammunition, or rewards.
]]

export type PatternPresentationDefinition = {
\tTitle: string,
\tColor: { number },
}

local PatternPresentationsByModeId: { [string]: PatternPresentationDefinition } = {
\tConeCleave = table.freeze({
\t\tTitle = "BREACH CLEAVE",
\t\tColor = table.freeze({ 255, 151, 54 }),
\t}),
\tLinePierce = table.freeze({
\t\tTitle = "LINE PIERCE",
\t\tColor = table.freeze({ 115, 221, 255 }),
\t}),
}
PatternPresentationsByModeId = table.freeze(PatternPresentationsByModeId)

local function getPatternPresentation(modeId: unknown): PatternPresentationDefinition?
\treturn if type(modeId) == "string" then PatternPresentationsByModeId[modeId] else nil
end

local ConfirmedHitMarkerConfig = {
\tVersion = "HROI-0133-v1-authoritative-pattern-hit-punctuation",
\tDisplayOrder = 52,
\tMarkerDurationSeconds = 0.34,
\tChainWindowSeconds = 0.72,
\tMinimumRadiusPixels = 9,
\tMaximumRadiusPixels = 25,
\tArmLengthPixels = 18,
\tArmThicknessPixels = 3,
\tFadeStartFraction = 0.42,
\tHotChainThreshold = 4,
\tBrutalChainThreshold = 8,
\tMaximumRememberedShotIds = 128,
\tMaximumSecondaryImpacts = 3,
\tPatternRadiusBonusPixels = 7,
\tPatternPulseScale = 1.17,
\tPatternPresentationsByModeId = PatternPresentationsByModeId,
\tgetPatternPresentation = getPatternPresentation,
}

assert(
\tConfirmedHitMarkerConfig.MarkerDurationSeconds >= 0.18 and ConfirmedHitMarkerConfig.MarkerDurationSeconds <= 0.6,
\t"confirmed hit marker duration must remain immediate and bounded"
)
assert(
\tConfirmedHitMarkerConfig.ChainWindowSeconds >= 0.35 and ConfirmedHitMarkerConfig.ChainWindowSeconds <= 1.25,
\t"confirmed hit chain window must reward automatic-fire rhythm without becoming sticky"
)
assert(
\tConfirmedHitMarkerConfig.MinimumRadiusPixels >= 4
\t\tand ConfirmedHitMarkerConfig.MaximumRadiusPixels <= 36
\t\tand ConfirmedHitMarkerConfig.MinimumRadiusPixels < ConfirmedHitMarkerConfig.MaximumRadiusPixels,
\t"confirmed hit marker radius bounds drifted"
)
assert(
\tConfirmedHitMarkerConfig.MaximumRadiusPixels + ConfirmedHitMarkerConfig.PatternRadiusBonusPixels <= 36,
\t"pattern-hit radius must remain inside the fixed marker budget"
)
assert(
\tConfirmedHitMarkerConfig.ArmLengthPixels >= 10
\t\tand ConfirmedHitMarkerConfig.ArmLengthPixels <= 28
\t\tand ConfirmedHitMarkerConfig.ArmThicknessPixels >= 2
\t\tand ConfirmedHitMarkerConfig.ArmThicknessPixels <= 5,
\t"confirmed hit marker geometry must remain readable and bounded"
)
assert(
\tConfirmedHitMarkerConfig.FadeStartFraction >= 0.2 and ConfirmedHitMarkerConfig.FadeStartFraction <= 0.7,
\t"confirmed hit marker fade must preserve a crisp initial confirmation"
)
assert(
\tConfirmedHitMarkerConfig.HotChainThreshold >= 3
\t\tand ConfirmedHitMarkerConfig.BrutalChainThreshold > ConfirmedHitMarkerConfig.HotChainThreshold,
\t"confirmed hit marker chain thresholds must escalate monotonically"
)
assert(
\tConfirmedHitMarkerConfig.MaximumRememberedShotIds >= 32 and ConfirmedHitMarkerConfig.MaximumRememberedShotIds <= 256,
\t"marker deduplication memory must remain bounded"
)
assert(
\tConfirmedHitMarkerConfig.MaximumSecondaryImpacts == 3,
\t"pattern-hit punctuation must match the authoritative secondary-impact cap"
)
assert(
\tConfirmedHitMarkerConfig.PatternPulseScale >= 1.05 and ConfirmedHitMarkerConfig.PatternPulseScale <= 1.25,
\t"pattern-hit pulse must remain readable and restrained"
)
assert(getPatternPresentation("ConeCleave") ~= nil, "cone cleave requires pattern punctuation")
assert(getPatternPresentation("LinePierce") ~= nil, "line pierce requires pattern punctuation")
assert(getPatternPresentation("SingleTarget") == nil, "single-target hits must retain ordinary confirmation")

return table.freeze(ConfirmedHitMarkerConfig)
''')

          audit = Path("games/living-kingdoms/tests/ConfirmedHitMarkerSourceAudit.test.luau")
          audit.write_text('''--!strict

local fs = require("@lune/fs")
local luau = require("@lune/luau")

local function assertThat(condition: unknown, message: string)
\tif not condition then
\t\terror(message, 2)
\tend
end

local function contains(source: string, token: string): boolean
\treturn string.find(source, token, 1, true) ~= nil
end

local function count(source: string, token: string): number
\tlocal result = 0
\tlocal cursor = 1
\twhile true do
\t\tlocal index = string.find(source, token, cursor, true)
\t\tif index == nil then
\t\t\treturn result
\t\tend
\t\tresult += 1
\t\tcursor = index + #token
\tend
end

local controllerPath = "games/living-kingdoms/src/client/Controllers/ConfirmedHitMarkerController.luau"
local configPath = "games/living-kingdoms/src/shared/Config/ConfirmedHitMarkerConfig.luau"
local bootstrapPath = "games/living-kingdoms/src/client/init.client.luau"

local controllerSource = fs.readFile(controllerPath)
local configSource = fs.readFile(configPath)
local bootstrapSource = fs.readFile(bootstrapPath)

for _, required in {
\t"PresentationMessageKindIds.ShotFired",
\t"isLocalOperativeEntityId(payload.operativeEntityId)",
\t"payload.didApplyDamage ~= true",
\t"typeof(payload.impactWorldPosition) ~= \"Vector3\"",
\t"camera:WorldToViewportPoint(worldPosition)",
\t"not rememberShot(payload.shotId)",
\t"#ARM_DEFINITIONS == 4",
\t"math.min(99, confirmedChain + 1)",
\t"WeaponPatternConfig.get(payload.weaponId)",
\t"readSecondaryImpactCount(payload.secondaryImpacts",
\t"patternDefinition.MaximumSecondaryTargets",
\t"impact.targetEntityId",
\t"impact.impactWorldPosition",
\t"impact.damageAmount",
\t"patternHitCount = 1 + secondaryImpactCount",
\t"ConfirmedHitMarkerConfig.getPatternPresentation(patternModeId)",
} do
\tassertThat(contains(controllerSource, required), "confirmed marker is missing " .. required)
end
assertThat(count(controllerSource, "RenderStepped:Connect") == 1, "marker must own exactly one frame connection")
assertThat(count(controllerSource, "OnClientEvent:Connect") == 1, "marker must own exactly one disclosure connection")
for _, forbidden in {
\t":FireServer(",
\t"RemoteFunction",
\t"SetNetworkOwner",
\t"TakeDamage",
\t"DamageResolver",
\t"EnemyDirectorService",
\t"task.delay",
\t"task.spawn",
\t"RunProgressionService",
\t"EnemyLootService",
} do
\tassertThat(not contains(controllerSource, forbidden), "confirmed marker must not own gameplay: " .. forbidden)
end

local config = luau.load(configSource, {
\tdebugName = "ConfirmedHitMarkerConfig",
\tinjectGlobals = true,
})()
assertThat(type(config) == "table", "confirmed hit marker config did not load")
assertThat(config.MarkerDurationSeconds >= 0.18 and config.MarkerDurationSeconds <= 0.6, "marker duration escaped bounds")
assertThat(config.MaximumRadiusPixels + config.PatternRadiusBonusPixels <= 36, "pattern marker radius escaped budget")
assertThat(config.MaximumRememberedShotIds <= 256, "marker deduplication memory escaped bound")
assertThat(config.BrutalChainThreshold > config.HotChainThreshold, "marker escalation thresholds are not monotonic")
assertThat(config.MaximumSecondaryImpacts == 3, "pattern secondary cap drifted")
assertThat(config.getPatternPresentation("ConeCleave").Title == "BREACH CLEAVE", "shotgun punctuation title drifted")
assertThat(config.getPatternPresentation("LinePierce").Title == "LINE PIERCE", "sniper punctuation title drifted")
assertThat(config.getPatternPresentation("SingleTarget") == nil, "ordinary hits must not receive pattern punctuation")

assertThat(
\tcontains(bootstrapSource, "local ConfirmedHitMarkerController = require(script.Controllers.ConfirmedHitMarkerController)"),
\t"client bootstrap does not require confirmed hit marker"
)
assertThat(contains(bootstrapSource, "ConfirmedHitMarkerController.start()"), "client bootstrap does not start confirmed hit marker")

print("ConfirmedHitMarkerSourceAudit: authoritative pattern counts, shooter scope, fixed presentation, and authority bounds passed")
''')

          spec = Path("docs/specifications/authoritative-pattern-hit-punctuation.md")
          spec.write_text('''# Authoritative Pattern-Hit Punctuation

## Purpose

Make the existing shotgun cone cleave and sniper line pierce unmistakable when one accepted shot damages multiple hostiles. The pass strengthens weapon identity without adding damage, rewards, targeting input, or another HUD owner.

## Authoritative input

`OperativeCombatRuntimeService` already emits one server-authored `ShotFired` presentation disclosure containing the primary impact and up to three bounded `secondaryImpacts`. Each secondary entry carries its target entity ID, committed damage amount, and impact world position.

`ConfirmedHitMarkerController` may render those facts only when:

- the shooter is the local operative;
- the shot ID is new;
- primary damage was committed;
- the weapon has a known `WeaponPatternConfig` definition;
- every secondary impact is structurally valid; and
- the count does not exceed both the weapon definition and the global cap of three.

## Presentation

- Ordinary and single-target hits retain the existing `HIT CONFIRMED` / rapid-confirmation treatment.
- Shotgun cone damage with at least one secondary target renders `BREACH CLEAVE xN`.
- Sniper penetration with one secondary target renders `LINE PIERCE x2`.
- Pattern confirmation uses a mode-specific color, a seven-pixel radius bonus, and a restrained fixed scale pulse.
- Existing authoritative secondary tracers remain the spatial explanation of which hostiles were damaged.

## Runtime and authority bounds

- No new remote, request, controller, frame loop, audio source, particle system, reward, or server state.
- The existing marker keeps exactly one disclosure connection, one `RenderStepped` connection, four fixed arms, one label, and one fixed `UIScale`.
- Maximum secondary-impact work is three entries per accepted local shot.
- The client cannot establish targeting, hits, damage, death, XP, loot, ammunition, health, cadence, movement, or mission progress.

## Studio acceptance

Review from the isometric gameplay camera with the breach shotgun and sniper rifle. Confirm that multi-target shots are immediately legible, ordinary hits remain quiet, text does not collide with damage numbers, pattern colors remain readable, the pulse is comfortable, and rapid horde combat does not produce distracting overlap.
''')

          roadmap = "docs/roadmap/RECOMMENDED-PASSES.md"
          replace_once(
              roadmap,
              '- **Massacre crescendo pass** — escalating, non-rewarding kill-chain titles,\n  exact authoritative expiry, fixed audiovisual punch, and one verified tier\n  stinger without changing XP, loot, health, ammunition, or combat power\n  ([`../specifications/massacre-crescendo.md`](../specifications/massacre-crescendo.md)).\n',
              '- **Massacre crescendo pass** — escalating, non-rewarding kill-chain titles,\n  exact authoritative expiry, fixed audiovisual punch, and one verified tier\n  stinger without changing XP, loot, health, ammunition, or combat power\n  ([`../specifications/massacre-crescendo.md`](../specifications/massacre-crescendo.md)).\n- **Authoritative pattern-hit punctuation pass** — shotgun cleaves and sniper\n  pierces now replace generic local hit confirmation with bounded, mode-specific\n  multi-target punctuation sourced only from committed secondary impacts\n  ([`../specifications/authoritative-pattern-hit-punctuation.md`](../specifications/authoritative-pattern-hit-punctuation.md)).\n',
          )
          PY

      - name: Format focused Luau
        run: |
          stylua \
            games/living-kingdoms/src/client/Controllers/ConfirmedHitMarkerController.luau \
            games/living-kingdoms/src/shared/Config/ConfirmedHitMarkerConfig.luau \
            games/living-kingdoms/tests/ConfirmedHitMarkerSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        shell: bash
        run: |
          while IFS= read -r -d '' fixture; do
            echo "=== $fixture ==="
            lune run "$fixture"
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json -o /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          rm .github/workflows/finalize-pattern-hit-punctuation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/roadmap/RECOMMENDED-PASSES.md \
            docs/specifications/authoritative-pattern-hit-punctuation.md \
            games/living-kingdoms/src/client/Controllers/ConfirmedHitMarkerController.luau \
            games/living-kingdoms/src/shared/Config/ConfirmedHitMarkerConfig.luau \
            games/living-kingdoms/tests/ConfirmedHitMarkerSourceAudit.test.luau \
            .github/workflows/finalize-pattern-hit-punctuation-once.yml
          git commit -m "Make authoritative weapon patterns hit unmistakably"
          git push origin HEAD:feat/pattern-hit-punctuation-v1

name: Walker attack disclosure apply

on:
  push:
    branches:
      - feat/exclusion-walker-attack-disclosure

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exclusion-walker-attack-disclosure
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}
      - name: Add presentation contract and consumers
        run: |
          mkdir -p games/living-kingdoms/src/shared/Visual
          cat > games/living-kingdoms/src/shared/Visual/EnemyPresentationContracts.luau <<'EOF'
          --!strict

          --[[
          	Replicated, presentation-only disclosure names for server-owned enemies.
          	These attributes describe already-committed gameplay truth. They do not
          	request attacks, select targets, apply damage, change health, or own death.
          ]]

          local AttributeNames = table.freeze({
          	BehaviorStateId = "EnemyPresentationBehaviorStateId",
          	LifeStateId = "EnemyPresentationLifeStateId",
          	AttackSequence = "EnemyPresentationAttackSequence",
          	AttackServerTimestamp = "EnemyPresentationAttackServerTimestamp",
          	HitSequence = "EnemyPresentationHitSequence",
          	HitServerTimestamp = "EnemyPresentationHitServerTimestamp",
          })

          local LifeStateIds = table.freeze({
          	Alive = "Alive",
          	Dead = "Dead",
          })

          return table.freeze({
          	AttributeNames = AttributeNames,
          	LifeStateIds = LifeStateIds,
          })
          EOF

          cat > games/living-kingdoms/src/client/Presentation/EnemyPresentationPoseResolver.luau <<'EOF'
          --!strict

          --[[
          	VIS-0103 pure pose selection for the Exclusion Walker procedural fallback.
          	Inputs are replicated presentation facts. The resolver cannot move an enemy,
          	choose a target, apply damage, change health, or alter death and cleanup.
          ]]

          local PoseIds = table.freeze({
          	Idle = "Idle",
          	RoamingA = "RoamingA",
          	RoamingB = "RoamingB",
          	PursuingA = "PursuingA",
          	PursuingB = "PursuingB",
          	ThreatReady = "ThreatReady",
          	StrikeActiveLeft = "StrikeActiveLeft",
          	StrikeActiveRight = "StrikeActiveRight",
          	StrikeRecoveryLeft = "StrikeRecoveryLeft",
          	StrikeRecoveryRight = "StrikeRecoveryRight",
          	HitReaction = "HitReaction",
          	StandDown = "StandDown",
          	Dead = "Dead",
          })

          local SensorModes = table.freeze({
          	Normal = "Normal",
          	Alert = "Alert",
          	Strike = "Strike",
          	Hit = "Hit",
          	Dim = "Dim",
          	Dead = "Dead",
          })

          local Timing = table.freeze({
          	HitReactionSeconds = 0.28,
          	AttackActiveSeconds = 0.16,
          	AttackRecoverySeconds = 0.52,
          })

          export type PoseInput = {
          	isDead: boolean,
          	isStoodDown: boolean,
          	isMoving: boolean,
          	isPursuing: boolean,
          	attackSequence: number,
          	secondsSinceAttack: number?,
          	secondsSinceHit: number?,
          	strideIndex: number,
          }

          export type Pose = {
          	id: string,
          	torsoPitchDegrees: number,
          	torsoRollDegrees: number,
          	leftArmPitchDegrees: number,
          	rightArmPitchDegrees: number,
          	leftArmRollDegrees: number,
          	rightArmRollDegrees: number,
          	leftLegPitchDegrees: number,
          	rightLegPitchDegrees: number,
          	sensorMode: string,
          }

          local function pose(
          	id: string,
          	torsoPitchDegrees: number,
          	torsoRollDegrees: number,
          	leftArmPitchDegrees: number,
          	rightArmPitchDegrees: number,
          	leftArmRollDegrees: number,
          	rightArmRollDegrees: number,
          	leftLegPitchDegrees: number,
          	rightLegPitchDegrees: number,
          	sensorMode: string
          ): Pose
          	return table.freeze({
          		id = id,
          		torsoPitchDegrees = torsoPitchDegrees,
          		torsoRollDegrees = torsoRollDegrees,
          		leftArmPitchDegrees = leftArmPitchDegrees,
          		rightArmPitchDegrees = rightArmPitchDegrees,
          		leftArmRollDegrees = leftArmRollDegrees,
          		rightArmRollDegrees = rightArmRollDegrees,
          		leftLegPitchDegrees = leftLegPitchDegrees,
          		rightLegPitchDegrees = rightLegPitchDegrees,
          		sensorMode = sensorMode,
          	})
          end

          local IDLE = pose(PoseIds.Idle, 0, 0, 5, -5, 4, -4, 0, 0, SensorModes.Normal)
          local THREAT_READY = pose(PoseIds.ThreatReady, -8, 0, -38, -38, 12, -12, 5, -5, SensorModes.Alert)
          local STRIKE_ACTIVE_LEFT =
          	pose(PoseIds.StrikeActiveLeft, -21, -11, -92, -24, -31, -6, 15, -15, SensorModes.Strike)
          local STRIKE_ACTIVE_RIGHT =
          	pose(PoseIds.StrikeActiveRight, -21, 11, -24, -92, 6, 31, -15, 15, SensorModes.Strike)
          local STRIKE_RECOVERY_LEFT =
          	pose(PoseIds.StrikeRecoveryLeft, 3, 6, -18, -42, 13, -16, -7, 7, SensorModes.Alert)
          local STRIKE_RECOVERY_RIGHT =
          	pose(PoseIds.StrikeRecoveryRight, 3, -6, -42, -18, 16, -13, 7, -7, SensorModes.Alert)
          local HIT_REACTION = pose(PoseIds.HitReaction, 16, 9, 26, -34, -18, 20, -8, 8, SensorModes.Hit)
          local STAND_DOWN = pose(PoseIds.StandDown, 19, 0, 38, 38, 12, -12, 0, 0, SensorModes.Dim)
          local DEAD = pose(PoseIds.Dead, 72, 13, 66, 58, 24, -28, -18, 22, SensorModes.Dead)

          local EnemyPresentationPoseResolver = {
          	PoseIds = PoseIds,
          	SensorModes = SensorModes,
          	Timing = Timing,
          }

          function EnemyPresentationPoseResolver.resolve(input: PoseInput): Pose
          	if input.isDead then
          		return DEAD
          	end

          	local secondsSinceHit = input.secondsSinceHit
          	if
          		secondsSinceHit ~= nil
          		and secondsSinceHit >= 0
          		and secondsSinceHit <= Timing.HitReactionSeconds
          	then
          		return HIT_REACTION
          	end

          	if input.isStoodDown then
          		return STAND_DOWN
          	end

          	local secondsSinceAttack = input.secondsSinceAttack
          	if secondsSinceAttack ~= nil and secondsSinceAttack >= 0 then
          		local strikeUsesLeftArm = input.attackSequence % 2 == 1
          		if secondsSinceAttack <= Timing.AttackActiveSeconds then
          			return if strikeUsesLeftArm then STRIKE_ACTIVE_LEFT else STRIKE_ACTIVE_RIGHT
          		end
          		if secondsSinceAttack <= Timing.AttackRecoverySeconds then
          			return if strikeUsesLeftArm then STRIKE_RECOVERY_LEFT else STRIKE_RECOVERY_RIGHT
          		end
          	end

          	local strideIsEven = input.strideIndex % 2 == 0
          	if input.isMoving and input.isPursuing then
          		if strideIsEven then
          			return pose(PoseIds.PursuingA, -16, -2, -34, 26, 7, -7, 24, -24, SensorModes.Alert)
          		end
          		return pose(PoseIds.PursuingB, -16, 2, 26, -34, 7, -7, -24, 24, SensorModes.Alert)
          	end

          	if input.isMoving then
          		if strideIsEven then
          			return pose(PoseIds.RoamingA, -6, -1, -16, 12, 5, -5, 13, -13, SensorModes.Normal)
          		end
          		return pose(PoseIds.RoamingB, -6, 1, 12, -16, 5, -5, -13, 13, SensorModes.Normal)
          	end

          	if input.isPursuing then
          		return THREAT_READY
          	end

          	return IDLE
          end

          return table.freeze(EnemyPresentationPoseResolver)
          EOF

          cat > games/living-kingdoms/src/client/Controllers/EnemyPresentationController.luau <<'EOF'
          --!strict

          --[[
          	VIS-0103 client-local state readability for the Exclusion Walker fallback.
          	One RenderStepped connection reads server-authored presentation attributes
          	and changes only Motor6D poses plus the sensor appearance. It does not send
          	a remote, move an enemy root, select a target, predict an attack, apply
          	damage, change health, or alter death and cleanup.

          	The controller uses two folder-level lifecycle connections and zero per-enemy
          	connections. Motor writes occur only when a resolved pose ID changes.
          ]]

          local ReplicatedStorage = game:GetService("ReplicatedStorage")
          local RunService = game:GetService("RunService")
          local Workspace = game:GetService("Workspace")

          local EnemyConfig = require(ReplicatedStorage.Shared.Config.EnemyConfig)
          local EnemyContracts = require(ReplicatedStorage.Shared.Combat.EnemyContracts)
          local EnemyPresentationContracts = require(ReplicatedStorage.Shared.Visual.EnemyPresentationContracts)
          local EnemyPresentationPoseResolver = require(script.Parent.Parent.Presentation.EnemyPresentationPoseResolver)

          local EnemyPresentationController = {}

          local BehaviorStateIds = EnemyContracts.EnemyBehaviorStateIds
          local PresentationAttributeNames = EnemyPresentationContracts.AttributeNames
          local PresentationLifeStateIds = EnemyPresentationContracts.LifeStateIds

          local ENEMY_FOLDER_NAME = "EnemyEntities"
          local PRESENTATION_MODEL_NAME = "ExclusionWalkerPresentation"
          local MOVEMENT_THRESHOLD = 0.05
          local STRIDES_PER_SECOND = 3

          local SENSOR_COLORS = table.freeze({
          	Normal = Color3.fromRGB(218, 78, 53),
          	Alert = Color3.fromRGB(255, 145, 54),
          	Strike = Color3.fromRGB(255, 204, 74),
          	Hit = Color3.fromRGB(255, 245, 210),
          	Dim = Color3.fromRGB(105, 74, 62),
          	Dead = Color3.fromRGB(48, 28, 28),
          })

          local SENSOR_TRANSPARENCY = table.freeze({
          	Normal = 0,
          	Alert = 0,
          	Strike = 0,
          	Hit = 0,
          	Dim = 0.35,
          	Dead = 0.55,
          })

          type Record = {
          	root: BasePart,
          	humanoid: Humanoid,
          	sensor: BasePart,
          	torsoMotor: Motor6D,
          	leftArmMotor: Motor6D,
          	rightArmMotor: Motor6D,
          	leftLegMotor: Motor6D,
          	rightLegMotor: Motor6D,
          	torsoBaseC0: CFrame,
          	leftArmBaseC0: CFrame,
          	rightArmBaseC0: CFrame,
          	leftLegBaseC0: CFrame,
          	rightLegBaseC0: CFrame,
          	attackSequence: number,
          	attackServerTimestamp: number?,
          	hitSequence: number,
          	hitServerTimestamp: number?,
          	phaseOffsetSeconds: number,
          	poseId: string,
          }

          local started = false
          local enemyFolder: Folder? = nil
          local descendantAddedConnection: RBXScriptConnection? = nil
          local childRemovedConnection: RBXScriptConnection? = nil
          local renderConnection: RBXScriptConnection? = nil
          local records: { [Model]: Record } = {}

          local function readNumberAttribute(model: Model, attributeName: string): number?
          	local value = model:GetAttribute(attributeName)
          	return if type(value) == "number" then value else nil
          end

          local function readStringAttribute(model: Model, attributeName: string): string?
          	local value = model:GetAttribute(attributeName)
          	return if type(value) == "string" then value else nil
          end

          local function stablePhaseOffset(model: Model): number
          	local entityId = model:GetAttribute("CombatEntityId")
          	if type(entityId) ~= "string" then
          		return 0
          	end
          	local hash = 0
          	for index = 1, #entityId do
          		hash = (hash + string.byte(entityId, index) * index) % 997
          	end
          	return hash / 997
          end

          local function findMotor(model: Model, name: string): Motor6D?
          	local instance = model:FindFirstChild(name, true)
          	if instance ~= nil and instance:IsA("Motor6D") then
          		return instance
          	end
          	return nil
          end

          local function findEnemyModel(instance: Instance): Model?
          	local folder = enemyFolder
          	local current: Instance? = instance
          	while current ~= nil and current ~= folder do
          		if current:IsA("Model") and current:GetAttribute("EnemyArchetypeId") == EnemyConfig.Walker.ArchetypeId then
          			return current
          		end
          		current = current.Parent
          	end
          	return nil
          end

          local function trackModel(model: Model)
          	if records[model] ~= nil or model:GetAttribute("EnemyArchetypeId") ~= EnemyConfig.Walker.ArchetypeId then
          		return
          	end

          	local presentation = model:FindFirstChild(PRESENTATION_MODEL_NAME)
          	local root = model:FindFirstChild("HumanoidRootPart")
          	local humanoid = model:FindFirstChildOfClass("Humanoid")
          	if
          		presentation == nil
          		or not presentation:IsA("Model")
          		or root == nil
          		or not root:IsA("BasePart")
          		or humanoid == nil
          	then
          		return
          	end

          	local sensor = presentation:FindFirstChild("Sensor", true)
          	local torsoMotor = findMotor(model, "TorsoMotor")
          	local leftArmMotor = findMotor(model, "ForearmLeftMotor")
          	local rightArmMotor = findMotor(model, "ForearmRightMotor")
          	local leftLegMotor = findMotor(model, "LegLeftMotor")
          	local rightLegMotor = findMotor(model, "LegRightMotor")
          	if
          		sensor == nil
          		or not sensor:IsA("BasePart")
          		or torsoMotor == nil
          		or leftArmMotor == nil
          		or rightArmMotor == nil
          		or leftLegMotor == nil
          		or rightLegMotor == nil
          	then
          		return
          	end

          	local attackSequence = readNumberAttribute(model, PresentationAttributeNames.AttackSequence)
          	local attackServerTimestamp = readNumberAttribute(model, PresentationAttributeNames.AttackServerTimestamp)
          	local hitSequence = readNumberAttribute(model, PresentationAttributeNames.HitSequence)
          	local hitServerTimestamp = readNumberAttribute(model, PresentationAttributeNames.HitServerTimestamp)
          	if
          		attackSequence == nil
          		or attackServerTimestamp == nil
          		or hitSequence == nil
          		or hitServerTimestamp == nil
          	then
          		return
          	end

          	records[model] = {
          		root = root,
          		humanoid = humanoid,
          		sensor = sensor,
          		torsoMotor = torsoMotor,
          		leftArmMotor = leftArmMotor,
          		rightArmMotor = rightArmMotor,
          		leftLegMotor = leftLegMotor,
          		rightLegMotor = rightLegMotor,
          		torsoBaseC0 = torsoMotor.C0,
          		leftArmBaseC0 = leftArmMotor.C0,
          		rightArmBaseC0 = rightArmMotor.C0,
          		leftLegBaseC0 = leftLegMotor.C0,
          		rightLegBaseC0 = rightLegMotor.C0,
          		attackSequence = attackSequence,
          		attackServerTimestamp = if attackSequence > 0 and attackServerTimestamp > 0
          			then attackServerTimestamp
          			else nil,
          		hitSequence = hitSequence,
          		hitServerTimestamp = if hitSequence > 0 and hitServerTimestamp > 0 then hitServerTimestamp else nil,
          		phaseOffsetSeconds = stablePhaseOffset(model),
          		poseId = "",
          	}
          end

          local function restoreRecord(record: Record)
          	record.torsoMotor.C0 = record.torsoBaseC0
          	record.leftArmMotor.C0 = record.leftArmBaseC0
          	record.rightArmMotor.C0 = record.rightArmBaseC0
          	record.leftLegMotor.C0 = record.leftLegBaseC0
          	record.rightLegMotor.C0 = record.rightLegBaseC0
          	record.sensor.Color = SENSOR_COLORS.Normal
          	record.sensor.Transparency = SENSOR_TRANSPARENCY.Normal
          end

          local function untrackModel(model: Model)
          	local record = records[model]
          	if record == nil then
          		return
          	end
          	restoreRecord(record)
          	records[model] = nil
          end

          local function applyPose(record: Record, pose: EnemyPresentationPoseResolver.Pose)
          	record.torsoMotor.C0 = record.torsoBaseC0
          		* CFrame.Angles(math.rad(pose.torsoPitchDegrees), 0, math.rad(pose.torsoRollDegrees))
          	record.leftArmMotor.C0 = record.leftArmBaseC0
          		* CFrame.Angles(math.rad(pose.leftArmPitchDegrees), 0, math.rad(pose.leftArmRollDegrees))
          	record.rightArmMotor.C0 = record.rightArmBaseC0
          		* CFrame.Angles(math.rad(pose.rightArmPitchDegrees), 0, math.rad(pose.rightArmRollDegrees))
          	record.leftLegMotor.C0 = record.leftLegBaseC0 * CFrame.Angles(math.rad(pose.leftLegPitchDegrees), 0, 0)
          	record.rightLegMotor.C0 = record.rightLegBaseC0 * CFrame.Angles(math.rad(pose.rightLegPitchDegrees), 0, 0)

          	local color = SENSOR_COLORS[pose.sensorMode]
          	local transparency = SENSOR_TRANSPARENCY[pose.sensorMode]
          	if color ~= nil and transparency ~= nil then
          		record.sensor.Color = color
          		record.sensor.Transparency = transparency
          	end
          	record.poseId = pose.id
          end

          local function updateRecord(model: Model, record: Record, serverTimestamp: number)
          	local attackSequence = readNumberAttribute(model, PresentationAttributeNames.AttackSequence)
          	local attackServerTimestamp = readNumberAttribute(model, PresentationAttributeNames.AttackServerTimestamp)
          	if
          		attackSequence ~= nil
          		and attackServerTimestamp ~= nil
          		and attackSequence > record.attackSequence
          		and attackServerTimestamp > 0
          	then
          		record.attackSequence = attackSequence
          		record.attackServerTimestamp = attackServerTimestamp
          	end

          	local hitSequence = readNumberAttribute(model, PresentationAttributeNames.HitSequence)
          	local hitServerTimestamp = readNumberAttribute(model, PresentationAttributeNames.HitServerTimestamp)
          	if
          		hitSequence ~= nil
          		and hitServerTimestamp ~= nil
          		and hitSequence > record.hitSequence
          		and hitServerTimestamp > 0
          	then
          		record.hitSequence = hitSequence
          		record.hitServerTimestamp = hitServerTimestamp
          	end

          	local behaviorStateId = readStringAttribute(model, PresentationAttributeNames.BehaviorStateId)
          	local lifeStateId = readStringAttribute(model, PresentationAttributeNames.LifeStateId)
          	if behaviorStateId == nil or lifeStateId == nil then
          		return
          	end

          	local attackAt = record.attackServerTimestamp
          	local hitAt = record.hitServerTimestamp
          	local secondsSinceAttack = if attackAt == nil then nil else serverTimestamp - attackAt
          	local secondsSinceHit = if hitAt == nil then nil else serverTimestamp - hitAt
          	local isDead = lifeStateId == PresentationLifeStateIds.Dead
          	local isStoodDown = behaviorStateId == BehaviorStateIds.StandDown
          	local isMoving = record.humanoid.MoveDirection.Magnitude > MOVEMENT_THRESHOLD
          	local isPursuing = behaviorStateId == BehaviorStateIds.Pursuing
          		or behaviorStateId == BehaviorStateIds.Attacking
          	local strideIndex = math.floor((serverTimestamp + record.phaseOffsetSeconds) * STRIDES_PER_SECOND) % 2

          	local pose = EnemyPresentationPoseResolver.resolve({
          		isDead = isDead,
          		isStoodDown = isStoodDown,
          		isMoving = isMoving,
          		isPursuing = isPursuing,
          		attackSequence = record.attackSequence,
          		secondsSinceAttack = secondsSinceAttack,
          		secondsSinceHit = secondsSinceHit,
          		strideIndex = strideIndex,
          	})
          	if pose.id ~= record.poseId then
          		applyPose(record, pose)
          	end
          end

          function EnemyPresentationController.start()
          	if started then
          		return
          	end
          	started = true

          	local folder = Workspace:WaitForChild(ENEMY_FOLDER_NAME)
          	assert(folder:IsA("Folder"), "EnemyEntities must be a Folder")
          	enemyFolder = folder
          	for _, child in folder:GetChildren() do
          		if child:IsA("Model") then
          			trackModel(child)
          		end
          	end

          	descendantAddedConnection = folder.DescendantAdded:Connect(function(descendant)
          		local model = findEnemyModel(descendant)
          		if model ~= nil then
          			trackModel(model)
          		end
          	end)
          	childRemovedConnection = folder.ChildRemoved:Connect(function(child)
          		if child:IsA("Model") then
          			untrackModel(child)
          		end
          	end)
          	renderConnection = RunService.RenderStepped:Connect(function()
          		local serverTimestamp = Workspace:GetServerTimeNow()
          		for model, record in records do
          			if model.Parent == nil then
          				records[model] = nil
          			else
          				updateRecord(model, record, serverTimestamp)
          			end
          		end
          	end)
          end

          function EnemyPresentationController.stop()
          	if not started then
          		return
          	end
          	started = false
          	if descendantAddedConnection ~= nil then
          		descendantAddedConnection:Disconnect()
          		descendantAddedConnection = nil
          	end
          	if childRemovedConnection ~= nil then
          		childRemovedConnection:Disconnect()
          		childRemovedConnection = nil
          	end
          	if renderConnection ~= nil then
          		renderConnection:Disconnect()
          		renderConnection = nil
          	end
          	for model, record in records do
          		restoreRecord(record)
          		records[model] = nil
          	end
          	enemyFolder = nil
          end

          return table.freeze(EnemyPresentationController)
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:80]!r}; found {text.count(old)}")
              file_path.write_text(text.replace(old, new, 1))

          director = "games/living-kingdoms/src/server/Systems/EnemyDirectorService.luau"
          replace_once(
              director,
              'local EnemyContracts = require(ReplicatedStorage.Shared.Combat.EnemyContracts)\nlocal WorldFoundationConfig = require(ReplicatedStorage.Shared.Config.WorldFoundationConfig)',
              'local EnemyContracts = require(ReplicatedStorage.Shared.Combat.EnemyContracts)\nlocal EnemyPresentationContracts = require(ReplicatedStorage.Shared.Visual.EnemyPresentationContracts)\nlocal WorldFoundationConfig = require(ReplicatedStorage.Shared.Config.WorldFoundationConfig)',
          )
          replace_once(
              director,
              'local BehaviorStateIds = EnemyContracts.EnemyBehaviorStateIds\nlocal SpawnSourceIds = EnemyContracts.EnemySpawnSourceIds',
              'local BehaviorStateIds = EnemyContracts.EnemyBehaviorStateIds\nlocal PresentationAttributeNames = EnemyPresentationContracts.AttributeNames\nlocal PresentationLifeStateIds = EnemyPresentationContracts.LifeStateIds\nlocal SpawnSourceIds = EnemyContracts.EnemySpawnSourceIds',
          )
          replace_once(
              director,
              '\tlastAttackServerTimestamp: number?,\n\thealthRevision: number,',
              '\tlastAttackServerTimestamp: number?,\n\tattackPresentationSequence: number,\n\thitPresentationSequence: number,\n\thealthRevision: number,',
          )
          replace_once(
              director,
              '''local function setHealthPresentation(entry: EnemyEntry)\n\tentry.healthLabel.Text =\n\t\tstring.format("%s\\nHealth: %d", entry.model.Name, math.max(0, entry.healthState.currentHealth))\n\tentry.root.Color = if entry.isAlive then Color3.fromRGB(126, 46, 46) else Color3.fromRGB(74, 74, 74)\nend\n''',
              '''local function setHealthPresentation(entry: EnemyEntry)\n\tentry.healthLabel.Text =\n\t\tstring.format("%s\\nHealth: %d", entry.model.Name, math.max(0, entry.healthState.currentHealth))\n\tentry.root.Color = if entry.isAlive then Color3.fromRGB(126, 46, 46) else Color3.fromRGB(74, 74, 74)\nend\n\nlocal function setPresentationBehaviorState(entry: EnemyEntry, behaviorStateId: string)\n\tif entry.behaviorStateId == behaviorStateId then\n\t\treturn\n\tend\n\tentry.behaviorStateId = behaviorStateId\n\tentry.model:SetAttribute(PresentationAttributeNames.BehaviorStateId, behaviorStateId)\nend\n\nlocal function initializePresentationAttributes(entry: EnemyEntry)\n\tentry.model:SetAttribute(PresentationAttributeNames.BehaviorStateId, entry.behaviorStateId)\n\tentry.model:SetAttribute(PresentationAttributeNames.LifeStateId, PresentationLifeStateIds.Alive)\n\tentry.model:SetAttribute(PresentationAttributeNames.AttackSequence, 0)\n\tentry.model:SetAttribute(PresentationAttributeNames.AttackServerTimestamp, 0)\n\tentry.model:SetAttribute(PresentationAttributeNames.HitSequence, 0)\n\tentry.model:SetAttribute(PresentationAttributeNames.HitServerTimestamp, 0)\nend\n\nlocal function discloseCommittedAttack(entry: EnemyEntry, serverTimestamp: number)\n\tentry.attackPresentationSequence += 1\n\tentry.model:SetAttribute(PresentationAttributeNames.AttackSequence, entry.attackPresentationSequence)\n\tentry.model:SetAttribute(PresentationAttributeNames.AttackServerTimestamp, serverTimestamp)\nend\n\nlocal function discloseCommittedHit(entry: EnemyEntry, serverTimestamp: number)\n\tentry.hitPresentationSequence += 1\n\tentry.model:SetAttribute(PresentationAttributeNames.HitSequence, entry.hitPresentationSequence)\n\tentry.model:SetAttribute(PresentationAttributeNames.HitServerTimestamp, serverTimestamp)\nend\n''',
          )
          replace_once(
              director,
              '\t\tlastAttackServerTimestamp = nil,\n\t\thealthRevision = 1,',

name: VIS-0102 Selene diagnostic

on:
  push:
    branches:
      - "agent/vis-0102-runtime-carbine-presentation"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/vis-0102-runtime-carbine-presentation

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Capture Selene output
        run: |
          mkdir -p .diagnostics
          selene games/living-kingdoms/src > .diagnostics/vis-0102-selene.txt 2>&1 || true

      - name: Commit diagnostic
        run: |
          if git diff --quiet -- .diagnostics/vis-0102-selene.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/vis-0102-selene.txt
          git commit -m "Capture VIS-0102 Selene diagnostic"
          git push

name: Finalize authoritative weapon patterns once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feat/authoritative-weapon-patterns-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/authoritative-weapon-patterns-v1

      - name: Install pinned Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          path: .
          cache: false
          token: ${{ github.token }}

      - name: Integrate authoritative weapon patterns
        run: python3 tools/apply_authoritative_weapon_patterns.py

      - name: Format focused diff
        run: |
          stylua \
            games/living-kingdoms/src/shared/Config/WeaponPatternConfig.luau \
            games/living-kingdoms/src/shared/Combat/CombatContracts.luau \
            games/living-kingdoms/src/server/Systems/WeaponPatternResolver.luau \
            games/living-kingdoms/src/server/Systems/DamageResolver.luau \
            games/living-kingdoms/src/server/Systems/OperativeCombatRuntimeService.luau \
            games/living-kingdoms/src/client/Controllers/WeaponPresentationController.luau \
            games/living-kingdoms/src/client/Presentation/WeaponShotEffectPresenter.luau \
            games/living-kingdoms/tests/WeaponPatternResolver.test.luau \
            games/living-kingdoms/tests/WeaponPatternSourceAudit.test.luau

      - name: Run Selene
        run: selene games/living-kingdoms/src

      - name: Run complete Lune fixture suite
        id: lune
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          fixture_count=0
          status=0
          : > /tmp/authoritative-weapon-patterns-lune.log
          while IFS= read -r -d '' fixture; do
            echo "===== $fixture =====" | tee -a /tmp/authoritative-weapon-patterns-lune.log
            lune run "$fixture" 2>&1 | tee -a /tmp/authoritative-weapon-patterns-lune.log
            fixture_status=${PIPESTATUS[0]}
            fixture_count=$((fixture_count + 1))
            if [ "$fixture_status" -ne 0 ]; then
              status="$fixture_status"
              break
            fi
          done < <(find games/living-kingdoms/tests -type f -name '*.test.luau' -print0 | sort -z)
          if [ "$fixture_count" -eq 0 ]; then
            status=1
          fi
          echo "Executed $fixture_count fixtures before exit." | tee -a /tmp/authoritative-weapon-patterns-lune.log
          exit "$status"

      - name: Upload fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-weapon-patterns-lune-log
          path: /tmp/authoritative-weapon-patterns-lune.log
          retention-days: 1

      - name: Enforce fixture result
        if: steps.lune.outcome == 'failure'
        run: exit 1

      - name: Build Rojo project
        run: rojo build games/living-kingdoms/default.project.json --output /tmp/LivingKingdoms.rbxlx

      - name: Commit validated final source
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_authoritative_weapon_patterns.py
          rm .github/workflows/authoritative-weapon-patterns-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add authoritative shotgun cleave and sniper pierce"
          git push origin HEAD:feat/authoritative-weapon-patterns-v1
